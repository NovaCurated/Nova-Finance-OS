    const date    = bt.timestamp?.slice(0, 10) || '';
    const rawDesc = bt.description || bt.merchant_name || 'Unknown';
    const rule    = gcMatchRule(rawDesc);
    const sugDesc = rule ? rule.description : rawDesc.replace(/"/g, '\'').slice(0, 60);
    const sugCat  = rule ? rule.category : 'Other Expenses';
    return `<tr style="border-bottom:1px solid var(--border)">
      <td style="padding:8px 4px">
        <input type="checkbox" class="gc-chk" data-i="${i}" checked style="width:15px;height:15px;cursor:pointer">
      </td>
      <td style="padding:8px 6px;font-size:12px;color:var(--text-2);white-space:nowrap">${date}</td>
      <td style="padding:8px 6px">
        <input type="text" class="gc-desc" data-i="${i}" value="${sugDesc}"
          style="width:100%;font-size:13px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;background:var(--bg-2);color:var(--text-1)">
      </td>
      <td style="padding:8px 6px">
        <select class="gc-cat" data-i="${i}"
          style="width:100%;font-size:13px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;background:var(--bg-2);color:var(--text-1)">
          ${CATEGORIES.map(c => `<option${c===sugCat?' selected':''}>${c}</option>`).join('')}
        </select>
      </td>
      <td style="padding:8px 6px;text-align:right;font-weight:600;white-space:nowrap">£${amount.toFixed(2)}</td>
    </tr>`;
  }).join('');

  document.getElementById('modal-title').textContent = 'Review Bank Transactions';
  document.getElementById('modal-body').innerHTML = `
    <p style="font-size:13px;color:var(--text-2);margin-bottom:12px">
      ${_pendingBankTxs.length} new outgoing transaction${_pendingBankTxs.length > 1 ? 's' : ''} from your bank.
      Tick the ones to log, adjust descriptions/categories, then click Log.
    </p>
    <div style="overflow-x:auto;max-height:52vh;overflow-y:auto">
      <table style="width:100%;border-collapse:collapse">
        <thead><tr style="font-size:11px;color:var(--text-3);text-transform:uppercase;border-bottom:1px solid var(--border)">
          <th style="padding:4px 4px"></th>
          <th style="padding:4px 6px;text-align:left">Date</th>
          <th style="padding:4px 6px;text-align:left">Description</th>
          <th style="padding:4px 6px;text-align:left">Category</th>
          <th style="padding:4px 6px;text-align:right">Amount</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  document.getElementById('modal-footer').innerHTML = `
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="logBankTransactions()">Log Selected</button>`;
  openModal();
}

async function logBankTransactions() {
  const checks = document.querySelectorAll('.gc-chk');
  const descs  = document.querySelectorAll('.gc-desc');
  const cats   = document.querySelectorAll('.gc-cat');
  let added = 0;
  for (let i = 0; i < _pendingBankTxs.length; i++) {
    if (!checks[i]?.checked) continue;
    const bt     = _pendingBankTxs[i];
    const amount = Math.abs(bt.amount || 0);
    const date   = bt.timestamp?.slice(0, 10) || new Date().toISOString().slice(0, 10);
    const tx = {
      id: state.nextId.tx++,
      date,
      description: descs[i]?.value?.trim() || 'Bank Transaction',
      category:    cats[i]?.value || 'Other Expenses',
      amount
    };
    state.transactions.push(tx);
    skipNextRefresh = true;
    await dbUpsertTx(tx);
    added++;
  }
  if (added > 0) {
    state.settings.bankConfig.lastSync = new Date().toISOString().slice(0, 10);
    await dbSaveSettings();
  }
  closeModal();
  renderView('transactions');
  toast(`Logged ${added} transaction${added !== 1 ? 's' : ''} ✓`);
}

async function gcDisconnect() {
  if (!confirm('Disconnect your bank account?')) return;
  state.settings.bankConfig = {};
  await dbSaveSettings();
  renderView('settings');
  toast('Bank disconnected.');
}

// ── Password protection ──────────────────────────────────────────
const PW_HASH = '46cde98529630458a95bb5974210c1b1a0a76debaf8f4024301dd84782024db2'; // sha256 of current password
const PW_SESSION_KEY = 'nova_auth';
const PW_STORE = localStorage;

async function hashString(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkPassword() {
  const input = document.getElementById('pw-input');
  const error = document.getElementById('pw-error');
  const hash = await hashString(input.value);
  if (hash === PW_HASH) {
    PW_STORE.setItem(PW_SESSION_KEY, '1');
    document.getElementById('pw-screen').classList.add('hidden');
    input.value = '';
    error.textContent = '';
  } else {
    input.classList.add('shake');
    error.textContent = 'Incorrect password';
    setTimeout(() => { input.classList.remove('shake'); input.value = ''; input.focus(); }, 350);
  }
}

// Show/hide password screen
if (PW_STORE.getItem(PW_SESSION_KEY) === '1') {
  document.getElementById('pw-screen').classList.add('hidden');
} else {
  // Keep loading splash hidden until auth
  document.getElementById('loading-splash').style.display = 'none';
  setTimeout(() => document.getElementById('pw-input').focus(), 100);
}

// Boot
(async () => {
  // Wait for password if not yet authenticated
  if (PW_STORE.getItem(PW_SESSION_KEY) !== '1') {
    await new Promise(resolve => {
      const interval = setInterval(() => {
        if (PW_STORE.getItem(PW_SESSION_KEY) === '1') {
          clearInterval(interval);
          document.getElementById('loading-splash').style.display = '';
          resolve();
        }
      }, 100);
    });
  }
  // Exchange bank auth code FIRST — codes expire in ~30s, before Supabase loads
  const _urlParams  = new URLSearchParams(window.location.search);
  const _isBankAuth = _urlParams.get('bankauth') === '1';
  const _bankCode   = _urlParams.get('code');
  let   _bankTokens = null;
  if (_isBankAuth && _bankCode) {
    try { _bankTokens = await tlProxy('exchange_code', { code: _bankCode, redirect_uri: TL_REDIRECT }); }
    catch(e) { console.error('Early token exchange failed:', e); }
  }

  try {
    await loadFromSupabase();
    await checkRecurringExpenses();
    lastSyncTime = new Date();
    syncConnectionStatus = 'connected';
    subscribeRealtime();
  } catch (e) {
    console.error('Supabase load failed:', e);
    syncConnectionStatus = 'error';
    // Fallback to defaults in memory so UI is still usable
    state.orders       = JSON.parse(JSON.stringify(DEFAULT_DATA.orders));
    state.transactions = JSON.parse(JSON.stringify(DEFAULT_DATA.transactions));
    setSyncStatus('error', 'Offline — changes not saved');
  }
  // Hide splash
  const splash = document.getElementById('loading-splash');
  splash.classList.add('hidden');
  setTimeout(() => splash.remove(), 500);

  if (_isBankAuth) {
    navigate('settings');
    await gcCompleteAuth(_bankTokens);
  } else {
    navigate('dashboard');
  }
})();
</script>
