let realtimeChannel = null;
let pendingRemoteChange = false;
function subscribeRealtime() {
  realtimeChannel = sb.channel('nova-finance-sync')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' },       handleRemoteChange)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'transactions' }, handleRemoteChange)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' },     handleRemoteChange)
    .subscribe();
}
async function handleRemoteChange() {
  if (suppressRealtime > 0) return;
  // Never disturb an open form or a save in progress; apply the change when it closes.
  if (_busy || document.getElementById('modal-overlay')?.classList.contains('open')) { pendingRemoteChange = true; return; }
  pendingRemoteChange = false;
  setSyncStatus('syncing', 'Syncing…');
  try { await loadFromSupabase(); if (settingsDraft && !isDirty()) settingsDraft = null; renderView(currentView); setSyncStatus('synced', 'Synced'); }
  catch (e) { console.error(e); setSyncStatus('error', 'Sync failed'); }
}

// ═══════════════════════════════════════════════════
// REPORT ENGINE — one shared model for Overview, Reports, Balance and milestones
// ═══════════════════════════════════════════════════
//  Sales after refunds = sales of orders dated in the period − refunds dated in the period
//  Contribution        = sales after refunds − cost of scarves sold (net of resaleable returns)
//                        − postage (estimate, or matched actual) − platform fees (net of fee refunds)
//                        − return postage
//  Net profit    = contribution − packaging − gifts/samples stock − postage not linked to orders − opex
//  Profit before tax   = net profit + other income
//  Cash is a separate, as-at calculation (see cashAt).

const OPEX_CATS = ['Marketing & Advertising','Software & Subscriptions','Bank Fees','Rent','Utilities','Professional Fees','Insurance','Travel','Office Supplies','Other Expenses'];
const FOLD_DEFAULT_RATE = 0.15;
const ORDER_TYPES = { sale: 'Sale', gift: 'Gift', sample: 'Sample', cancelled: 'Cancelled' };

function num(v) { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; }
function r2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }
function lagDays(v, def) { const n = parseInt(v, 10); return Number.isFinite(n) && n >= 0 ? n : def; }
function orderChannel(o) { return o.channel || (o.outsideShopify ? 'direct' : 'shopify'); }
function orderType(o) { return ORDER_TYPES[o.orderType] ? o.orderType : 'sale'; }
function orderLines(o) {
  const src = Array.isArray(o.lineItems) && o.lineItems.length ? o.lineItems : [{ sku: o.skuType, qty: o.qty }];
  return src.map(li => ({ sku: li.sku || '', qty: Math.max(0, parseInt(li.qty, 10) || 0) }));
}

// ── Dated cost rates (Settings history) ────────────
function sortedHistory(h) { return [...h].sort((a, b) => (a.from < b.from ? -1 : a.from > b.from ? 1 : 0)); }
function historyOf(entry, key = 'cost') {
  const h = Array.isArray(entry?.history) ? entry.history.filter(x => x && isValidYMD(x.from)) : [];
  return h.length ? sortedHistory(h) : [{ from: EPOCH, [key]: entry?.[key] }];
}
function rateOn(history, date) {
  if (!history.length) return null;
  if (!isValidYMD(date)) return history[history.length - 1];
  let pick = history[0];
  for (const h of history) if (h.from <= date) pick = h;
  return pick;
}
function validCost(v) { const c = parseFloat(v); return Number.isFinite(c) && c >= 0 ? c : null; }
function findSkuEntry(sku, s = state.settings) {
  const list = s.skuCosts || [];
  return list.find(x => x.sku === sku) || list.find(x => Array.isArray(x.aliases) && x.aliases.includes(sku)) || null;
}
function findShipEntry(method, s = state.settings) {
  const list = s.shippingMethods || [];
  return list.find(x => x.method === method) || list.find(x => Array.isArray(x.aliases) && x.aliases.includes(method)) || null;
}
function skuCostOn(sku, date, s = state.settings) {
  const e = findSkuEntry(sku, s);
  return e ? validCost(rateOn(historyOf(e), date)?.cost) : null;      // null = unknown, never silently £0
}
function shippingCostOn(method, date, s = state.settings) {
  const def = num(rateOn(historyOf({ history: s.defaultShippingHistory, cost: s.defaultShipping }), date)?.cost);
  if (!method) return def;
  const e = findShipEntry(method, s);
  return e ? num(rateOn(historyOf(e), date)?.cost) : def;
}
function feesOn(date, s = state.settings) {
  const h = Array.isArray(s.feeHistory) && s.feeHistory.length ? sortedHistory(s.feeHistory.filter(x => x && isValidYMD(x.from)))
          : [{ from: EPOCH, rate: s.shopifyFeeRate, fixed: s.shopifyFixedFee }];
  const r = rateOn(h, date) || {};
  return { rate: num(r.rate), fixed: num(r.fixed) };
}
function historyText(hist, f = v => fmt(num(v.cost))) {
  if (hist.length < 2) return '';
  return hist.map((h, i) => {
    const next = hist[i + 1];
    if (i === 0) return `${f(h)} until ${fmtDateLong(addDays(next.from, -1))}`;
    return next ? `${f(h)} ${fmtDateLong(h.from)}–${fmtDateLong(addDays(next.from, -1))}` : `${f(h)} from ${fmtDateLong(h.from)}`;
  }).join(' · ');
}

// ── Order cost snapshots ───────────────────────────
// basis: 'recorded'  – captured when the order was saved in the app
//        'estimated' – derived from the dated rate on the order date during the reviewed backfill
//        'confirmed' – checked and confirmed by you (e.g. via Correct costs)
function buildSnapshot(o, basis, s = state.settings) {
  const f = feesOn(o.date, s);
  return {
    v: 2, basis, captured_on: londonToday(), app_version: APP_VERSION,
    lines: [...new Set(orderLines(o).map(l => l.sku))].map(sku => ({ sku, unit_cost: skuCostOn(sku, o.date, s) })),
    shipping: { method: o.shippingMethod || null, estimate: shippingCostOn(o.shippingMethod, o.date, s) },
    fees: { shopify_rate: f.rate, shopify_fixed: f.fixed },
    corrections: [],
  };
}
// Edit rules for an order that already has locked costs:
//  • customer, order #, revenue → costs unchanged (Shopify fee follows revenue at the locked rate)
//  • date → locked costs kept (they are the costs of that sale)
//  • quantity of an existing product → its locked unit cost is kept
//  • product added → unit cost = Settings rate on the order date; product removed → dropped
//  • shipping method changed → estimate = Settings rate for the new method on the order date
//  • channel changed → locked Shopify fee terms kept; Fold uses the order's own commission rate
function snapshotAfterEdit(prev, next) {
  if (!prev.costSnapshot) return null;
  const snap = clone(prev.costSnapshot);
  snap.lines = [...new Set(orderLines(next).map(l => l.sku))].map(sku =>
    snap.lines.find(x => x.sku === sku) || { sku, unit_cost: skuCostOn(sku, next.date), added_on: londonToday() });
  const oldMethod = snap.shipping ? (snap.shipping.method ?? null) : null;
  if ((next.shippingMethod || null) !== oldMethod) snap.shipping = { method: next.shippingMethod || null, estimate: shippingCostOn(next.shippingMethod, next.date), changed_on: londonToday() };
  return snap;
}
function snapshotLabel(o) {
  const s = o.costSnapshot;
  if (!s) return 'Not locked yet — using the Settings rates for the order date';
  const b = { recorded: 'Recorded with the order', estimated: 'Estimated from the rate on the order date', confirmed: 'Confirmed' }[s.basis] || 'Locked';
  return `${b} · locked ${fmtDateLong(s.captured_on)}${s.corrections?.length ? ` · ${s.corrections.length} correction${s.corrections.length > 1 ? 's' : ''}` : ''}`;
}

// ── Postage matching index ─────────────────────────
// A Shipping & Postage transaction can be matched to one or more orders (explicit review only).
// Matched amounts become those orders' actual postage; any unmatched remainder is "postage not
// linked to orders", expensed on the payment date.
function postageIndex(asOf = londonToday()) {
  const live = new Map(state.orders.filter(o => orderType(o) !== 'cancelled' && isValidYMD(o.date) && o.date <= asOf).map(o => [o.id, o]));
  const byOrder = new Map();
  const txInfo = new Map();
  state.transactions.forEach(t => {
    if (t.category !== 'Shipping & Postage') return;
    const pr = t.postageReview || null;
    let allocated = 0;
    const valid = (pr?.allocations || []).filter(a => live.has(a.order_id) && num(a.amount) > 0);
    const total = valid.reduce((s, a) => s + num(a.amount), 0);
    if (isValidYMD(t.date) && t.date <= asOf && total <= num(t.amount) + 0.005) valid.forEach(a => {
      const amt = num(a.amount);
      allocated += amt;
      byOrder.set(a.order_id, (byOrder.get(a.order_id) || 0) + amt);
    });
    const status = pr?.status === 'orders' || pr?.status === 'non_order' ? pr.status : 'unreviewed';
    txInfo.set(t.id, { allocated, unlinked: num(t.amount) - allocated, status });
  });
  return { byOrder, txInfo };
}

// ── One order, at the time of sale (refunds handled separately) ──
function calcOrder(o, idx = postageIndex()) {
  const type = orderType(o);
  const channel = orderChannel(o);
  const foldRate = o.foldCommissionRate ?? FOLD_DEFAULT_RATE;
  const snap = o.costSnapshot;
  const base = { type, channel, foldRate, locked: !!snap, basis: snap?.basis || null };
  if (type === 'cancelled') {
    return { ...base, revenue: 0, units: 0, productCost: 0, lines: [], missingSkus: [], costMissing: false,
             shipEst: 0, postageActual: null, postage: 0, postageMatched: false, shopifyFee: 0, foldFee: 0, fee: 0, payout: 0, contribution: 0 };
  }
  const missingSkus = [];
  let productCost = 0, units = 0;
  const lines = orderLines(o).map(l => {
    const sl = snap?.lines?.find(x => x.sku === l.sku);
    const locked = sl && validCost(sl.unit_cost) !== null;
    const unit = locked ? validCost(sl.unit_cost) : skuCostOn(l.sku, o.date);
    units += l.qty;
    if (unit === null) missingSkus.push(l.sku || '(blank)'); else productCost += l.qty * unit;
    return { ...l, unit, source: locked ? 'locked' : 'rate' };
  });
  const revenue = type === 'sale' ? r2(num(o.revenue)) : 0;
  const shipEst = snap?.shipping ? num(snap.shipping.estimate ?? snap.shipping.cost) : shippingCostOn(o.shippingMethod, o.date);
  const actual = idx.byOrder.has(o.id) ? idx.byOrder.get(o.id) : null;
  const postage = actual !== null ? actual : shipEst;
  const terms = snap?.fees ? { rate: num(snap.fees.shopify_rate), fixed: num(snap.fees.shopify_fixed) } : feesOn(o.date);
  const shopifyFee = channel === 'shopify' && revenue ? r2(revenue * terms.rate + terms.fixed) : 0;
  const foldFee = channel === 'fold' && revenue ? r2(revenue * foldRate) : 0;
  const fee = r2(shopifyFee + foldFee);
  return { ...base, revenue, units, productCost: r2(productCost), lines, missingSkus, costMissing: missingSkus.length > 0,
           shipEst, postageActual: actual, postage, postageMatched: actual !== null,
           shopifyFee, foldFee, fee, payout: r2(revenue - fee), contribution: r2(revenue - productCost - postage - fee) };
}

// ── Refunds ────────────────────────────────────────
// Each refund: { id, amount, date (recognised), paid_date|null, returned:[{sku,qty}], resaleable: true|false|null,
//                fees_retained, return_postage, note }. Legacy "refunded" flags with no details become a
// flagged legacy refund: full amount, dated at the order date (no date is invented), stock NOT assumed
// returned, platform fee assumed retained.
function refundsOf(o, c = calcOrder(o)) {
  if (c.type !== 'sale') return [];
  if (Array.isArray(o.refunds) && o.refunds.length) return o.refunds.filter(r => r && num(r.amount) >= 0);
  if (o.refunded && c.revenue > 0) return [{ id: 'legacy', legacy: true, amount: c.revenue, date: o.date, paid_date: o.date,
    returned: [], resaleable: null, fees_retained: c.fee, return_postage: 0 }];
  return [];
}
function refundEffects(o, r, c) {
  const amount = num(r.amount);
  const share = c.revenue > 0 ? Math.min(1, amount / c.revenue) : 0;
  const feeRefund = Math.max(0, r2(c.fee * share - num(r.fees_retained ?? c.fee * share)));
  let stockBack = 0;
  if (r.resaleable === true) {
    // units already returned by earlier refunds on this order can't come back twice
    const earlier = refundsOf(o, c).slice(0, Math.max(0, refundsOf(o, c).indexOf(r)));
    (r.returned || []).forEach(x => {
      const line = c.lines.find(l => l.sku === x.sku);
      if (!line || line.unit === null) return;
      const prior = earlier.reduce((a, e) => a + (e.resaleable === true ? (e.returned || []).filter(y => y.sku === x.sku).reduce((b, y) => b + num(y.qty), 0) : 0), 0);
      stockBack += Math.max(0, Math.min(num(x.qty), line.qty - prior)) * line.unit;
    });
  }
  return { date: r.date, paidDate: isValidYMD(r.paid_date) ? r.paid_date : null, amount, feeRefund, stockBack: r2(stockBack),
           returnPostage: num(r.return_postage), legacy: !!r.legacy, returnedUnknown: r.resaleable == null && !r.legacy && amount > 0 };
}
function refundTotal(o, c, asOf) {
  return refundsOf(o, c).filter(r => !asOf || (isValidYMD(r.date) && r.date <= asOf)).reduce((a, r) => a + num(r.amount), 0);
}
function fullyRefunded(o, c, asOf) { return c.revenue > 0 && refundTotal(o, c, asOf) >= c.revenue - 0.005; }
// Paid order: a positive-value sale not fully refunded (gifts, samples, cancelled excluded).
function isPaidOrder(o, c, asOf) { return c.type === 'sale' && c.revenue > 0 && !fullyRefunded(o, c, asOf); }

// ── Book stock (landed cost) ───────────────────────
function bookStock(dateStr, inclusive = true, idx = postageIndex()) {
  const cmp = d => isValidYMD(d) && (inclusive ? d <= dateStr : d < dateStr);
  let purchases = 0, used = 0, back = 0;
  state.transactions.forEach(t => { if (t.category === 'Stock Purchases' && cmp(t.date)) purchases += num(t.amount); });
  state.orders.forEach(o => {
    const c = calcOrder(o, idx);
    if (cmp(o.date)) used += c.productCost;
    refundsOf(o, c).forEach(r => { const e = refundEffects(o, r, c); if (cmp(e.date)) back += e.stockBack; });
  });
  const opening = num(state.settings.openingStock);
  return { opening, purchases, used, back, value: opening + purchases - used + back };
}

// ── Period report ──────────────────────────────────
function computeReport(rangeIn, today = londonToday()) {
  const range = capToToday(rangeIn, today);
  const idx = postageIndex();
  const inR = d => inDateRange(d, range);
  const R = {
    range, grossSales: 0, refunds: 0, refundCount: 0, partialRefundOrders: 0, fullRefundOrders: 0,
    cogs: 0, stockBack: 0, giftsCost: 0, units: 0, postageEst: 0, postageAdj: 0, matchedOrders: 0, unmatchedOrders: 0,
    shopifyFees: 0, foldFees: 0, feeRefunds: 0, returnPostage: 0,
    paidOrders: 0, paidSales: 0, nova: 0, fold: 0, direct: 0, giftCount: 0, cancelledCount: 0,
    missingCost: [], unlocked: [], zeroValue: [], estimatedLocks: 0, legacyRefunds: [], refundsUnpaid: 0, refundsNoReturnInfo: 0,
    unitsBySku: {}, byChannel: { shopify: { n: 0, contribution: 0 }, fold: { n: 0, contribution: 0 }, direct: { n: 0, contribution: 0 } },
    orderReceipts: 0, postageAssumedPaid: 0, refundsPaid: 0,
  };
  state.orders.forEach(o => {
    const c = calcOrder(o, idx);
    if (inR(o.date) && c.type !== 'cancelled') {
      if (c.type === 'sale') {
        R.grossSales += c.revenue; R.cogs += c.productCost; R.units += c.units;
        R.shopifyFees += c.shopifyFee; R.foldFees += c.foldFee; R.orderReceipts += c.payout;
        if (isPaidOrder(o, c, today)) { R.paidOrders++; R.paidSales += c.revenue; R[c.channel === 'fold' ? 'fold' : c.channel === 'direct' ? 'direct' : 'nova']++;
          R.byChannel[c.channel].n++; R.byChannel[c.channel].contribution += c.contribution; }
        c.lines.forEach(l => { R.unitsBySku[l.sku] = (R.unitsBySku[l.sku] || 0) + l.qty; });
        if (!(c.revenue > 0) && !o.orderType) R.zeroValue.push(o.id);
      } else { R.giftsCost += c.productCost; R.giftCount++; }
      R.postageEst += c.shipEst;
      if (c.postageMatched) { R.postageAdj += c.postage - c.shipEst; R.matchedOrders++; }
      else { R.postageAssumedPaid += c.shipEst; if (c.shipEst > 0) R.unmatchedOrders++; }
      if (c.costMissing) R.missingCost.push({ id: o.id, orderNum: o.orderNum, skus: c.missingSkus });
      if (!c.locked) R.unlocked.push(o.id); else if (c.basis === 'estimated') R.estimatedLocks++;
    } else if (inR(o.date) && c.type === 'cancelled') R.cancelledCount++;
    // refunds recognised on their own date
    const refs = refundsOf(o, c);
    let refInPeriod = false;
    refs.forEach(r => {
      const e = refundEffects(o, r, c);
      if (inR(e.date)) {
        refInPeriod = true;
        R.refunds += e.amount; R.refundCount++; R.stockBack += e.stockBack; R.feeRefunds += e.feeRefund; R.returnPostage += e.returnPostage;
        if (e.legacy) R.legacyRefunds.push(o.id);
        if (e.returnedUnknown) R.refundsNoReturnInfo++;
      }
      if (e.paidDate && inR(e.paidDate)) R.refundsPaid += e.amount;
      if (inR(e.date) && !e.paidDate) R.refundsUnpaid += e.amount;
    });
    if (refInPeriod) { if (fullyRefunded(o, c, today)) R.fullRefundOrders++; else R.partialRefundOrders++; }
  });

  const txs = state.transactions.filter(t => inR(t.date));
  const sumCat = cat => txs.filter(t => t.category === cat).reduce((a, t) => a + num(t.amount), 0);
  R.unlinkedPostage = 0; R.unreviewedPostage = 0; R.unreviewedPostageCount = 0; R.postageTx = 0;
  txs.forEach(t => {
    if (t.category !== 'Shipping & Postage') return;
    const info = idx.txInfo.get(t.id);
    R.postageTx += num(t.amount);
    R.unlinkedPostage += info.unlinked;
    if (info.status === 'unreviewed') { R.unreviewedPostage += num(t.amount); R.unreviewedPostageCount++; }
  });
  R.salesAfterRefunds = R.grossSales - R.refunds;
  R.costOfScarvesSold = R.cogs - R.stockBack;
  R.platformFees = R.shopifyFees + R.foldFees - R.feeRefunds;
  R.postageOrders = R.postageEst + R.postageAdj;
  R.contribution = R.salesAfterRefunds - R.costOfScarvesSold - R.postageOrders - R.platformFees - R.returnPostage;
  R.packaging = sumCat('Packaging');
  R.otherDirect = R.packaging + R.giftsCost + R.unlinkedPostage;
  R.opex = {}; OPEX_CATS.forEach(c => { R.opex[c] = sumCat(c); });
  R.totalOpEx = Object.values(R.opex).reduce((a, v) => a + v, 0);
  R.operatingProfit = R.contribution - R.otherDirect - R.totalOpEx;
  R.otherIncome = sumCat('Other Income');
  R.profitBeforeTax = R.operatingProfit + R.otherIncome;
  R.stockPurchases = sumCat('Stock Purchases');
  R.stockStart = bookStock(range.from, false, idx).value;
  R.stockEnd = R.stockStart + R.stockPurchases - R.cogs - R.giftsCost + R.stockBack;
  // Cash movement (estimated; receipts by order date, payout timing not applied)
  R.loanIn = sumCat('Loan Received'); R.loanOut = sumCat('Loan Repayment');
  R.ownerIn = sumCat('Owner Investment'); R.ownerOut = sumCat('Owner Drawings');
  R.cashMovement = R.orderReceipts + R.feeRefunds - R.refundsPaid - R.postageAssumedPaid - R.returnPostage + R.otherIncome
                 - R.stockPurchases - R.packaging - R.postageTx - R.totalOpEx + R.loanIn - R.loanOut + R.ownerIn - R.ownerOut;
  R.salesCatCount = txs.filter(t => t.category === 'Sales').length;
  R.salesCatTotal = sumCat('Sales');
  R.unknownCatCount = txs.filter(t => !CAT_CFG[t.category]).length;
  R.futureCount = (rangeIn.to > today) ? state.orders.filter(o => isValidYMD(o.date) && o.date > today && o.date <= rangeIn.to).length
                + state.transactions.filter(t => isValidYMD(t.date) && t.date > today && t.date <= rangeIn.to).length : 0;
  R.avgOrder = R.paidOrders ? R.paidSales / R.paidOrders : 0;   // gross value of orders still counted as paid
  R.cmPct = R.salesAfterRefunds ? R.contribution / R.salesAfterRefunds : 0;
  R.opMarginPct = R.salesAfterRefunds ? R.operatingProfit / R.salesAfterRefunds : 0;
  R.confidence = profitConfidence(R);
  return R;
}

// ── Confidence ─────────────────────────────────────
// Profit status never says "verified": the best it says is "Ready for review".
function profitConfidence(R) {
  const issues = [];
  if (R.missingCost.length) issues.push({ key: 'missing', level: 'err', title: `${R.missingCost.length} order${R.missingCost.length > 1 ? 's' : ''} missing product costs`,
    detail: `Scarf cost counted as £0 (${[...new Set(R.missingCost.flatMap(x => x.skus))].map(esc).join(', ')}). Profit is incomplete.`, action: 'missing' });
  if (R.unreviewedPostageCount) issues.push({ key: 'postage-tx', level: 'warn', title: `${R.unreviewedPostageCount} postage payment${R.unreviewedPostageCount > 1 ? 's' : ''} to review (${fmt(R.unreviewedPostage)})`,
    detail: 'Counted as postage not linked to orders. If they paid for customer shipments, match them so the estimate is replaced instead of counted twice.', action: 'postage' });
  if (R.unmatchedOrders) issues.push({ key: 'postage-est', level: 'info', title: `${R.unmatchedOrders} order${R.unmatchedOrders > 1 ? 's use' : ' uses'} estimated postage`,
    detail: 'Each keeps its shipping-method estimate until an actual postage payment is matched to it.', action: 'postage' });
  if (R.legacyRefunds.length) issues.push({ key: 'legacy-refund', level: 'warn', title: `${R.legacyRefunds.length} refund${R.legacyRefunds.length > 1 ? 's' : ''} need details`,
    detail: 'Marked refunded before refund details were recorded: treated as a full refund at the order date, stock not assumed returned, fees assumed kept by the platform.', action: 'refunds' });
  if (R.refundsNoReturnInfo) issues.push({ key: 'refund-return', level: 'info', title: `${R.refundsNoReturnInfo} refund${R.refundsNoReturnInfo > 1 ? 's' : ''} without return details`,
    detail: 'Returned stock is not assumed resaleable until you say so.', action: 'refunds' });
  if (R.unlocked.length) issues.push({ key: 'unlocked', level: 'info', title: `${R.unlocked.length} order${R.unlocked.length > 1 ? 's' : ''} without locked costs`,
    detail: 'Costed at the Settings rates for their dates. Lock them so later Settings changes can never alter them.', action: 'lock' });
  if (R.zeroValue.length) issues.push({ key: 'zero-value', level: 'info', title: `${R.zeroValue.length} zero-value order${R.zeroValue.length > 1 ? 's' : ''}`,
    detail: 'Not counted as paid orders. If they were gifts or samples, mark them so their stock cost is reported separately.', action: 'zero' });
  if (R.salesCatCount) issues.push({ key: 'sales-cat', level: 'warn', title: `${R.salesCatCount} transaction${R.salesCatCount > 1 ? 's' : ''} categorised Sales`,
    detail: `${fmt(R.salesCatTotal)} excluded from profit and cash — sales come from Orders. Record genuine sales as orders.`, action: 'expenses' });
  if (R.unknownCatCount) issues.push({ key: 'unknown-cat', level: 'warn', title: `${R.unknownCatCount} transaction${R.unknownCatCount > 1 ? 's' : ''} with an unknown category`, detail: 'Not counted anywhere.', action: 'expenses' });
  const status = R.missingCost.length ? 'incomplete' : (R.unmatchedOrders || R.unreviewedPostageCount || R.legacyRefunds.length || R.estimatedLocks || R.unlocked.length) ? 'estimated' : 'ready';
  const label = status === 'incomplete' ? 'Incomplete — product costs missing'
              : status === 'estimated' ? ((R.unmatchedOrders || R.unreviewedPostageCount) ? 'Estimated — postage not confirmed' : 'Estimated — some costs not confirmed')
              : 'Ready for review';
  return { status, label, issues, needsReview: issues.filter(i => i.level !== 'info').length };
}

// ── Cash (as at a date; independent of the reporting period) ──
function cashAt(date) {
  const s = state.settings;
  const idx = postageIndex(date);
  const shopifyLag = lagDays(s.platformPayoutLagDays, 7), foldLag = lagDays(s.foldPayoutLagDays, 14);
  const on = d => isValidYMD(d) && d <= date;
  const C = { date, startingCash: num(s.openingCash), startingCashRecorded: s.openingCash != null && s.openingCash !== '',
    ownerIn: 0, loansIn: 0, otherIncome: 0, salesReceipts: 0, feeRefunds: 0, spent: 0, stockPurchases: 0, postageAssumed: 0,
    returnPostage: 0, refundsPaid: 0, refundsRecorded: 0, loanRepay: 0, drawings: 0, shopifyPending: 0, foldPending: 0, shopifyLag, foldLag };
  state.transactions.forEach(t => {
    if (!on(t.date) || t.category === 'Sales') return;
    const a = num(t.amount);
    switch (t.category) {
      case 'Owner Investment': C.ownerIn += a; break;
      case 'Loan Received': C.loansIn += a; break;
      case 'Other Income': C.otherIncome += a; break;
      case 'Loan Repayment': C.loanRepay += a; break;
      case 'Owner Drawings': C.drawings += a; break;
      default: if (CAT_CFG[t.category]?.d === 'Out') { C.spent += a; if (t.category === 'Stock Purchases') C.stockPurchases += a; }
    }
  });
  const shopCut = addDays(date, -shopifyLag), foldCut = addDays(date, -foldLag);
  state.orders.forEach(o => {
    if (!on(o.date)) return;
    const c = calcOrder(o, idx);
    if (c.type === 'cancelled') return;
    if (!c.postageMatched) C.postageAssumed += c.shipEst;
    if (c.type === 'sale') {
      if (c.channel === 'shopify' && o.date >= shopCut) C.shopifyPending += c.payout;
      else if (c.channel === 'fold' && o.date >= foldCut) C.foldPending += c.payout;
      else C.salesReceipts += c.payout;
    }
    refundsOf(o, c).forEach(r => {
      const e = refundEffects(o, r, c);
      if (on(e.date)) { C.refundsRecorded += e.amount; C.feeRefunds += e.feeRefund; C.returnPostage += e.returnPostage; }
      if (e.paidDate && on(e.paidDate)) C.refundsPaid += e.amount;
    });
  });
  C.moneyIn = C.startingCash + C.ownerIn + C.loansIn + C.otherIncome + C.salesReceipts + C.feeRefunds;
  C.moneyOut = C.spent + C.postageAssumed + C.returnPostage + C.refundsPaid + C.loanRepay + C.drawings;
  C.cash = C.moneyIn - C.moneyOut;
  C.pending = C.shopifyPending + C.foldPending;
  C.refundsOwed = C.refundsRecorded - C.refundsPaid;
  return C;
}

// Latest bank-confirmed balance (entered from a statement, or from a connected bank), never derived from orders.
function confirmedBalance(today = londonToday()) {
  const list = (state.settings.bankBalances || []).filter(b => isValidYMD(b.asAt) && b.asAt <= today && Number.isFinite(parseFloat(b.amount)));
  if (!list.length) return null;
  const b = list.sort((a, c) => (a.asAt < c.asAt ? 1 : a.asAt > c.asAt ? -1 : (a.recordedAt < c.recordedAt ? 1 : -1)))[0];
  const est = cashAt(b.asAt);
  return { amount: num(b.amount), asAt: b.asAt, source: b.source || 'Bank statement', recordedAt: b.recordedAt, estimateThen: est.cash, difference: num(b.amount) - est.cash };
}

function computeAsAt(today = londonToday()) {
  const C = cashAt(today);
  const stock = bookStock(today, true);
  const txs = state.transactions.filter(t => onOrBefore(t.date, today));
  const sumCat = cat => txs.filter(t => t.category === cat).reduce((a, t) => a + num(t.amount), 0);
  const directorLoan = sumCat('Loan Received') - sumCat('Loan Repayment');
  const ownerCapital = sumCat('Owner Investment') - sumCat('Owner Drawings');
  const refundsOwed = C.refundsRecorded - C.refundsPaid;
  const retained = computeReport(allTimeRange(today), today).profitBeforeTax;
  const totalAssets = C.cash + C.pending + stock.value;
  const totalLiabilities = directorLoan + refundsOwed;
  const totalEquity = ownerCapital + C.startingCash + num(state.settings.openingStock) + retained;
  const difference = totalAssets - totalLiabilities - totalEquity;
  return { today, cash: C, inventory: stock.value, stock, directorLoan, refundsOwed, ownerCapital, retained,
           totalAssets, totalLiabilities, totalEquity, totalLiabEquity: totalLiabilities + totalEquity, difference, balanced: Math.abs(difference) < 0.01,
           invalidDateCount: state.orders.filter(o => !isValidYMD(o.date)).length + state.transactions.filter(t => !isValidYMD(t.date)).length,
           futureCount: state.orders.filter(o => isValidYMD(o.date) && o.date > today).length + state.transactions.filter(t => isValidYMD(t.date) && t.date > today).length };
}

function stockCountCheck(today = londonToday()) {
  const s = state.settings;
  const value = num(s.closingStock);
  const date = isValidYMD(s.stockCountDate) ? s.stockCountDate : null;
  if (!(value > 0) && !date) return { hasCount: false };
  const asOf = date && date <= today ? date : today;
  const book = bookStock(asOf, true);
  const maxPossible = book.opening + book.purchases;
  return { hasCount: true, value, date, asOf, book: book.value, maxPossible, variance: value - book.value,
           impossible: value > maxPossible + 0.005, large: Math.abs(value - book.value) > Math.max(25, Math.abs(book.value) * 0.10) };
}

// ═══════════════════════════════════════════════════
// PERIODS & FAIR COMPARISONS
// ═══════════════════════════════════════════════════
function shiftYear(d, n) { const { y, m, d: dd } = parseYMD(d); return ymd(y + n, m, Math.min(dd, daysInMonth(y + n, m))); }
function daysBetween(a, b) { const A = parseYMD(a), B = parseYMD(b); return Math.round((Date.UTC(B.y, B.m - 1, B.d) - Date.UTC(A.y, A.m - 1, A.d)) / 86400000); }
function firstTradingDate() {
  const d = state.orders.filter(o => orderType(o) === 'sale' && num(o.revenue) > 0 && isValidYMD(o.date)).map(o => o.date).sort()[0];
  return d || null;
}
function firstActivityDate() {
  return [...state.orders.map(o => o.date), ...state.transactions.map(t => t.date)].filter(isValidYMD).sort()[0] || null;
}

function periodRange(p = reportPeriod, today = londonToday()) {
  const t = parseYMD(today);
  if (p.kind === 'lastMonth') { const lm = addMonths(t.y, t.m, -1); return { kind: 'month-complete', from: monthStart(lm.y, lm.m), to: monthEnd(lm.y, lm.m), label: `${MONTHS_LONG[lm.m - 1]} ${lm.y}`, name: 'Last month' }; }
  if (p.kind === 'ytd') { const r = ytdRange(today); return { ...r, kind: 'ytd', name: 'Year to date' }; }
  if (p.kind === 'monthOf' && p.y && p.m) {
    if (p.y === t.y && p.m === t.m) return { kind: 'mtd', from: monthStart(t.y, t.m), to: today, label: `${MONTHS_LONG[t.m - 1]} ${t.y} to date`, name: 'This month' };
    return { kind: 'month-complete', from: monthStart(p.y, p.m), to: monthEnd(p.y, p.m), label: `${MONTHS_LONG[p.m - 1]} ${p.y}`, name: `${MONTHS_SHORT[p.m - 1]} ${p.y}` };
  }
  if (p.kind === 'custom' && isValidYMD(p.from) && isValidYMD(p.to)) {
    const [from, to] = p.from <= p.to ? [p.from, p.to] : [p.to, p.from];
    return { kind: 'custom', from, to, label: `${fmtDateLong(from)} – ${fmtDateLong(to)}`, name: 'Custom' };
  }
  return { kind: 'mtd', from: monthStart(t.y, t.m), to: today, label: `${MONTHS_LONG[t.m - 1]} ${t.y} to date`, name: 'This month' };
}

// Completed month → previous completed month; month to date → same elapsed dates last month;
// YTD → same elapsed part of the previous financial year; custom → preceding equal-length period.
function comparisonRange(cur, today = londonToday()) {
  const end = cur.to > today ? today : cur.to;
  if (cur.kind === 'month-complete') {
    const { y, m } = parseYMD(cur.from); const p = addMonths(y, m, -1);
    const r = { from: monthStart(p.y, p.m), to: monthEnd(p.y, p.m) };
    const a = daysInMonth(y, m), b = daysInMonth(p.y, p.m);
    return { ...r, label: `${MONTHS_LONG[p.m - 1]} ${p.y}`, note: a !== b ? `${a} vs ${b} days` : '' };
  }
  if (cur.kind === 'mtd') {
    const { y, m, d } = parseYMD(end); const p = addMonths(y, m, -1);
    const dd = Math.min(d, daysInMonth(p.y, p.m));
    return { from: monthStart(p.y, p.m), to: ymd(p.y, p.m, dd), label: `1–${dd} ${MONTHS_SHORT[p.m - 1]} ${p.y}`,
             note: d > dd ? `last month only had ${dd} days` : '' };
  }
  if (cur.kind === 'ytd') {
    const r = { from: shiftYear(cur.from, -1), to: shiftYear(end, -1) };
    return { ...r, label: `${fmtDateLong(r.from)} – ${fmtDateLong(r.to)}`, note: '' };
  }
  const n = daysBetween(cur.from, end) + 1;
  const r = { from: addDays(cur.from, -n), to: addDays(cur.from, -1) };
  return { ...r, label: `${fmtDateLong(r.from)} – ${fmtDateLong(r.to)}`, note: `previous ${n} days` };
}

function comparisonCoverage(prev) {
  const first = firstTradingDate();
  if (!first || prev.to < first) return 'none';
  if (prev.from < first) return 'partial';
  return 'full';
}

function signedMoney(d) { return (d >= 0 ? '+' : '−') + fmt(Math.abs(d)); }
function salesDelta(cur, prev, coverage) {
  if (coverage === 'none') return { text: 'No earlier sales to compare', tone: '', na: true };
  if (Math.abs(prev) < 0.005 && Math.abs(cur) < 0.005) return { text: 'No sales in either period', tone: '', na: true };
  if (Math.abs(prev) < 0.005) return { text: `First sales · ${signedMoney(cur)} vs £0`, tone: 'pos' };
  const d = cur - prev, pct = d / Math.abs(prev);
  return { text: `${signedMoney(d)} (${d >= 0 ? '+' : '−'}${Math.abs(pct * 100).toFixed(0)}%) vs ${fmt(prev)}`, tone: d > 0.005 ? 'pos' : d < -0.005 ? 'neg' : '' };
}
function profitDelta(cur, prev, coverage, curConf, prevConf) {
  if (curConf === 'incomplete' || prevConf === 'incomplete') return { text: 'Comparison unavailable — product costs missing', tone: '', na: true };
  if (coverage === 'none') return { text: 'No earlier trading to compare', tone: '', na: true };
  const d = cur - prev;
  if (prev < 0 && cur > 0) return { text: `Back in profit · ${fmt(d)} better than ${fmt(prev)}`, tone: 'pos' };
  if (Math.abs(d) < 0.005) return { text: `Same as ${fmt(prev)}`, tone: '' };
  return { text: `${fmt(Math.abs(d))} ${d > 0 ? 'better' : 'lower'} than ${fmt(prev)}`, tone: d > 0 ? 'pos' : 'neg' };
}
function ordersDelta(cur, prev, coverage) {
  if (coverage === 'none') return { text: 'No earlier orders to compare', tone: '', na: true };
  const d = cur - prev;
  if (prev === 0 && cur > 0) return { text: `First paid orders · +${cur} vs 0`, tone: 'pos' };
  if (d === 0) return { text: `Same as before (${prev})`, tone: '' };
  return { text: `${d > 0 ? '+' : '−'}${Math.abs(d)} order${Math.abs(d) !== 1 ? 's' : ''} vs ${prev}`, tone: d > 0 ? 'pos' : 'neg' };
}

function compareReports(p = reportPeriod, today = londonToday()) {
  const cur = periodRange(p, today);
  const prevR = comparisonRange(cur, today);
  const coverage = comparisonCoverage(prevR);
  const a = computeReport(cur, today), b = computeReport(prevR, today);
  return { cur, prevRange: prevR, coverage, a, b,
    sales: salesDelta(a.salesAfterRefunds, b.salesAfterRefunds, coverage),
    profit: profitDelta(a.operatingProfit, b.operatingProfit, coverage, a.confidence.status, b.confidence.status),
    orders: ordersDelta(a.paidOrders, b.paidOrders, coverage) };
}

// ── Monthly series (zero months included, years kept separate) ──
function monthlySeries(today = londonToday(), maxMonths = 12) {
  const first = firstActivityDate();
  const t = parseYMD(today);
  let start = addMonths(t.y, t.m, -(maxMonths - 1));
  if (first) { const f = parseYMD(first); if (f.y * 12 + f.m > start.y * 12 + start.m) start = { y: f.y, m: f.m }; }
  const out = [];
  for (let c = start; c.y * 12 + c.m <= t.y * 12 + t.m; c = addMonths(c.y, c.m, 1)) {
    const r = computeReport({ from: monthStart(c.y, c.m), to: monthEnd(c.y, c.m) }, today);
    out.push({ y: c.y, m: c.m, label: `${MONTHS_SHORT[c.m - 1]} ${String(c.y).slice(-2)}`, sales: r2(r.salesAfterRefunds),
               profit: r2(r.operatingProfit), incomplete: r.confidence.status === 'incomplete', complete: !(c.y === t.y && c.m === t.m) });
  }
  return out;
}

// ═══════════════════════════════════════════════════
// MILESTONES — automatic historical wins only, recognised from past records
// ═══════════════════════════════════════════════════
function computeMilestones(today = londonToday()) {
  const idx = postageIndex();
  const out = [];
  // paid orders (positive-value sales not fully refunded), in date order
  const paid = state.orders.map(o => ({ o, c: calcOrder(o, idx) })).filter(x => isValidYMD(x.o.date) && x.o.date <= today && isPaidOrder(x.o, x.c, today))
    .sort((x, y) => (x.o.date < y.o.date ? -1 : x.o.date > y.o.date ? 1 : x.o.id - y.o.id));
  [1, 10, 25, 50, 100].forEach(n => {
    if (paid.length >= n) out.push({ id: `orders-${n}`, kind: 'orders', title: n === 1 ? 'First paid order' : `${n} paid orders`, achievedOn: paid[n - 1].o.date,
      chip: n === 1 ? { label: 'First order', value: fmtDate(paid[0].o.date) } : { label: 'Milestone', value: `${n} orders` },
      short: n === 1 ? `First paid order · ${fmtDate(paid[0].o.date)}` : `${n} paid orders · ${fmtDate(paid[n - 1].o.date)}`,
      detail: n === 1 ? `${paid[0].o.orderNum || 'First order'} · ${fmtDateLong(paid[0].o.date)}` : `Reached on ${fmtDateLong(paid[n - 1].o.date)}`, status: 'met' });
  });
  // cumulative sales after refunds
  const events = [];
  state.orders.forEach(o => {
    const c = calcOrder(o, idx);
    if (c.type === 'sale' && c.revenue > 0 && isValidYMD(o.date) && o.date <= today) events.push({ d: o.date, v: c.revenue });
    refundsOf(o, c).forEach(r => { if (isValidYMD(r.date) && r.date <= today) events.push({ d: r.date, v: -num(r.amount) }); });
  });
  events.sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : a.v - b.v));
  const total = events.reduce((a, e) => a + e.v, 0);
  [1000, 2500, 5000].forEach(th => {
    let run = 0, hit = null;
    for (const e of events) { run += e.v; if (run >= th - 0.005 && !hit) hit = e.d; }
    if (hit) out.push({ id: `sales-${th}`, kind: 'sales', title: `${fmt(th, 0)} in sales after refunds`, achievedOn: hit, short: `${fmt(th, 0)} total sales · ${fmtDate(hit)}`, chip: { label: 'Total sales', value: `${fmt(th, 0)}+` },
      detail: total >= th - 0.005 ? `First reached ${fmtDateLong(hit)}` : `Reached ${fmtDateLong(hit)}, now ${fmt(total)} after later refunds`,
      status: total >= th - 0.005 ? 'met' : 'no-longer' });
  });
  // completed months
  const t = parseYMD(today);
  const firstTrade = firstTradingDate();
  if (firstTrade) {
    const f = parseYMD(firstTrade);
    const months = [];
    for (let c = { y: f.y, m: f.m }; c.y * 12 + c.m < t.y * 12 + t.m; c = addMonths(c.y, c.m, 1)) {
      const r = computeReport({ from: monthStart(c.y, c.m), to: monthEnd(c.y, c.m) }, today);
      months.push({ ...c, sales: r2(r.salesAfterRefunds), profit: r.operatingProfit, incomplete: r.confidence.status === 'incomplete' });
    }
    // Only awarded if every earlier completed month has complete costs — otherwise we can't know it was the first.
    let prof = null;
    for (const m of months) { if (m.incomplete) break; if (m.profit > 0.005) { prof = m; break; } }
    if (prof) out.push({ id: `first-profit-${prof.y}-${prof.m}`, kind: 'profit', title: 'First profitable month',
      chip: { label: 'First profit', value: MONTHS_SHORT[prof.m - 1] },
      short: `First profitable month · ${MONTHS_SHORT[prof.m - 1]} · ${fmt(prof.profit)} profit`, achievedOn: addDays(monthEnd(prof.y, prof.m), 1), detail: `${MONTHS_LONG[prof.m - 1]} ${prof.y}: net profit ${fmt(prof.profit)}`, status: 'met' });
    if (months.length >= 3) {
      const best = Math.max(...months.map(m => m.sales));
      const tied = months.filter(m => Math.abs(m.sales - best) < 0.005);
      const latest = tied[tied.length - 1];
      if (best > 0) out.push({ id: `best-month-${latest.y}-${String(latest.m).padStart(2, '0')}`, kind: 'best', title: tied.length > 1 ? 'Joint best sales month' : 'Best sales month so far',
        chip: { label: tied.length > 1 ? 'Joint best month' : 'Best month', value: fmt(best) },
        short: `${tied.length > 1 ? 'Joint best' : 'Best'} sales month · ${MONTHS_SHORT[latest.m - 1]} · ${fmt(best)}`,
        achievedOn: addDays(monthEnd(latest.y, latest.m), 1),
        detail: `${MONTHS_LONG[latest.m - 1]} ${latest.y}: ${fmt(best)} sales after refunds${tied.length > 1 ? ` (level with ${tied.slice(0, -1).map(m => `${MONTHS_SHORT[m.m - 1]} ${m.y}`).join(', ')})` : ''}. Sales only — not a profit record.`,
        status: 'met' });
    }
  }
  return out.sort((a, b) => (a.achievedOn < b.achievedOn ? -1 : a.achievedOn > b.achievedOn ? 1 : 0));
}

// On first use of this version, every win already achieved is stored as acknowledged, so
// upgrading never replays the history as "new". One settings row, merged on write.
async function ensureMilestoneBaseline() {
  if (milestoneState && milestoneState.baselineAt) return;
  const items = {};
  computeMilestones().forEach(m => { items[m.id] = { achievedOn: m.achievedOn, ackAt: new Date().toISOString(), baseline: true }; });
  const value = { baselineAt: londonToday(), items };
  const { error } = await saveSettingsRow('milestones', value);
  if (!error) milestoneState = value;
}
function milestoneView() {
  const list = computeMilestones();
  const items = milestoneState?.items || {};
  const enriched = list.map(m => ({ ...m, ack: !!items[m.id]?.ackAt, isNew: !!milestoneState?.baselineAt && !items[m.id] }));
  const known = new Set(list.map(m => m.id));
  const past = Object.entries(items).filter(([id]) => !known.has(id)).map(([id, v]) => ({ id, title: milestoneTitleFromId(id), achievedOn: v.achievedOn, status: 'superseded', ack: true }));
  const fresh = enriched.filter(m => m.isNew && m.status === 'met').sort((a, b) => (a.achievedOn < b.achievedOn ? 1 : -1));
  return { all: [...enriched, ...past].sort((a, b) => (a.achievedOn < b.achievedOn ? 1 : -1)), fresh };
}
function milestoneTitleFromId(id) {
  if (id.startsWith('best-month-')) { const [, , y, m] = id.split('-'); return `Best sales month (${MONTHS_SHORT[parseInt(m, 10) - 1]} ${y}) — since beaten`; }
  if (id.startsWith('first-profit-')) return 'First profitable month (no longer applies after corrections)';
  return id;
}
async function acknowledgeMilestone(id, achievedOn, opts = {}) {
  // re-read and merge so another device's acknowledgements are never lost
  const { data, error: readErr } = await sb.from('settings').select('*').eq('key', 'milestones').maybeSingle();
  if (readErr) { toast('Could not save — the win will show again next time.'); return; }
  const cur = (data && data.value) || milestoneState || { baselineAt: londonToday(), items: {} };
  cur.items = { ...(cur.items || {}), [id]: { achievedOn, ackAt: new Date().toISOString() } };
  const { error } = await saveSettingsRow('milestones', cur);
  if (error) { toast('Could not save — the win will show again next time.'); return; }
  milestoneState = cur;
  renderView(currentView);
}

// ═══════════════════════════════════════════════════
// INSIGHTS — at most three, from actual records only
// ═══════════════════════════════════════════════════
function computeInsights(cmp) {
  const { a, b, coverage } = cmp;
  const out = [];
  const est = a.confidence.status !== 'ready' ? ' (estimated)' : '';
  // cash fell while profit was positive, explained by stock purchases
  if (a.cashMovement < -0.005 && a.operatingProfit > 0.005 && a.stockPurchases > a.operatingProfit && a.confidence.status !== 'incomplete') {
    out.push({ text: `Cash fell by about ${fmt(-a.cashMovement)} while net profit was ${fmt(a.operatingProfit)}: ${fmt(a.stockPurchases)} went on stock, which is held as stock rather than charged to profit.`,
      short: `Cash fell ${fmt(-a.cashMovement)} despite ${fmt(a.operatingProfit)} profit — ${fmt(a.stockPurchases)} went on stock.`, link: ['reports', 'cash'] });
  }
  // sales change driven by order count vs average order value
  if (coverage === 'full' && a.paidOrders >= 3 && b.paidOrders >= 3 && Math.abs(a.salesAfterRefunds - b.salesAfterRefunds) > 0.005) {
    const volume = (a.paidOrders - b.paidOrders) * b.avgOrder;
    const value = (a.avgOrder - b.avgOrder) * a.paidOrders;
    const driver = Math.abs(volume) >= Math.abs(value) ? (a.paidOrders > b.paidOrders ? 'more orders' : 'fewer orders') : (a.avgOrder > b.avgOrder ? 'a higher average order' : 'a lower average order');
    out.push({ text: `Sales ${a.salesAfterRefunds > b.salesAfterRefunds ? 'rose' : 'fell'} mainly from ${driver}: ${a.paidOrders} orders averaging ${fmt(a.avgOrder)}, against ${b.paidOrders} averaging ${fmt(b.avgOrder)}.`,
      short: Math.abs(volume) >= Math.abs(value) ? `Sales ${a.salesAfterRefunds > b.salesAfterRefunds ? 'rose' : 'fell'} mainly from ${driver}: ${a.paidOrders} vs ${b.paidOrders}.` : `Sales ${a.salesAfterRefunds > b.salesAfterRefunds ? 'rose' : 'fell'} mainly from ${driver} (${fmt(a.avgOrder)} vs ${fmt(b.avgOrder)}).`, link: ['reports', 'orders'] });
  }
  // channel contribution per order
  const sh = a.byChannel.shopify, fo = a.byChannel.fold;
  if (sh.n >= 3 && fo.n >= 2 && a.confidence.status !== 'incomplete') {
    out.push({ text: `Contribution per order${est}: Shopify ${fmt(sh.contribution / sh.n)} (${sh.n} orders), Fold ${fmt(fo.contribution / fo.n)} (${fo.n}).`,
      short: `Contribution per order${est}: Shopify ${fmt(sh.contribution / sh.n)}, Fold ${fmt(fo.contribution / fo.n)}.`, link: ['reports', 'orders'] });
  }
  // postage per shipped order, actual where matched
  const shipped = a.matchedOrders + a.unmatchedOrders, shippedB = b.matchedOrders + b.unmatchedOrders;
  if (shipped >= 3 && shippedB >= 3 && coverage === 'full') {
    const pa = a.postageOrders / shipped, pb = b.postageOrders / shippedB;
    if (Math.abs(pa - pb) >= 0.1) out.push({ text: `Postage per shipped order ${fmt(pa)} vs ${fmt(pb)}${a.unmatchedOrders ? ' — partly estimated' : ''}.`,
      short: `Postage per shipped order ${fmt(pa)} vs ${fmt(pb)}${a.unmatchedOrders ? ' (partly estimated)' : ''}.`, link: ['expenses', 'postage'] });
  }
  // units by product type (SKU types, not individual designs)
  const skus = Object.entries(a.unitsBySku).filter(([, n]) => n > 0).sort((x, y) => y[1] - x[1]);
  if (skus.length >= 2 && out.length < 3) out.push({ text: `Units sold by product type: ${skus.map(([s, n]) => `${esc(s)} ${n}`).join(' · ')}.`, generic: true, link: ['reports', 'orders'] });
  return out.slice(0, 3);
}

// ═══════════════════════════════════════════════════
// NAVIGATION & SHARED UI
// ═══════════════════════════════════════════════════
let currentView = 'overview';
let reportsTab = 'pl';            // pl | orders | refunds | cash
let reportsOrderFilter = 'all';   // all | paid | refunds | missing

const VIEW_TITLES = { overview: 'Overview', orders: 'Orders', expenses: 'Expenses', reports: 'Reports', balance: 'Balance sheet', sync: 'Sync & backup', settings: 'Settings' };
const LEGACY_VIEWS = { dashboard: 'overview', transactions: 'expenses', pl: 'reports', monthly: 'reports' };

function navigate(view, swipeDir = null, { fromHistory = false } = {}) {
  view = LEGACY_VIEWS[view] || view;
  if (!VIEW_TITLES[view]) view = 'overview';
  closeMore();
  if (!fromHistory) pushViewHistory(view);
  currentView = view;
  document.body.className = 'view-' + view;
  document.querySelectorAll('.nav-item, .bottom-nav-item').forEach(el => {
    const on = el.dataset.view === view || (el.dataset.view === 'more' && ['balance', 'sync', 'settings'].includes(view));
    el.classList.toggle('active', on);
    if (el.dataset.view !== 'more') el.setAttribute('aria-current', el.dataset.view === view ? 'page' : 'false');
  });
  document.getElementById('page-title').textContent = VIEW_TITLES[view];
  document.getElementById('page-subtitle').textContent = pageSubtitle();
  document.getElementById('main').scrollTop = 0;
  renderView(view);
}
function toggleMore() {
  const s = document.getElementById('more-sheet');
  const open = !s.classList.contains('open');
  s.classList.toggle('open', open);
  document.getElementById('more-btn').setAttribute('aria-expanded', String(open));
  if (open) s.querySelector('button')?.focus();
}
function closeMore() { document.getElementById('more-sheet')?.classList.remove('open'); document.getElementById('more-btn')?.setAttribute('aria-expanded', 'false'); }

function pageSubtitle() {
  const fy = fyContaining(londonToday());
  return `${state.settings.businessName} · ${fy.label} (${fmtRange(fy)})`;
}

function globalNoticesHTML() {
  const list = [];
  if (loadError) list.push({ level: 'err', html: `<strong>Couldn't load data from the database</strong> (${esc(loadError)}). No figures are shown and nothing has been changed. Check your connection, then use Sync → <em>Sync now</em>.` });
  else if (dataEmpty) list.push({ level: 'warn', html: `The database returned <strong>no orders or transactions</strong>. Nothing has been created automatically. If this is unexpected, don't add records — check Supabase or restore from a backup first.` });
  return noticesHTML(list);
}
function noticesHTML(list) {
  if (!list || !list.length) return '';
  return `<div class="notice-list">${list.map(x => `<div class="notice ${x.level}">${x.html}</div>`).join('')}</div>`;
}

function renderView(view) {
  const content = document.getElementById('page-content');
  const actions = document.getElementById('page-actions');
  actions.innerHTML = '';
  const fn = { overview: renderOverview, orders: renderOrders, expenses: renderExpenses, reports: renderReports,
               balance: renderBalance, sync: renderSync, settings: renderSettings }[view] || renderOverview;
  if (loadError && ['overview', 'reports', 'balance'].includes(view)) content.innerHTML = '';   // never show figures from unloaded data
  else fn(content, actions);
  const notices = globalNoticesHTML();
  if (notices) content.insertAdjacentHTML('afterbegin', notices);
  if (typeof updatePending !== 'undefined' && updatePending) maybeApplyPendingUpdate();
}

// ── Shared period selector (Overview and Reports use the same period) ──
function setPeriod(kind) {
  if (kind === 'custom') {
    const cur = periodRange(reportPeriod);
    reportPeriod = { kind: 'custom', from: cur.from, to: cur.to };
  } else reportPeriod = { kind };
  rememberPeriod();
  renderView(currentView);
}
function setCustom(which, value) {
  if (!isValidYMD(value)) return;
  reportPeriod = { ...reportPeriod, kind: 'custom', [which]: value };
  rememberPeriod();
  renderView(currentView);
}
// Compact dates: "1 Jan – 15 Oct 2026" (years shown on both sides only when they differ)
function fmtRangeShort(from, to) {
  const A = parseYMD(from), B = parseYMD(to);
  if (A.y !== B.y) return `${fmtDateLong(from)} – ${fmtDateLong(to)}`;
  return `${A.d} ${MONTHS_SHORT[A.m - 1]} – ${B.d} ${MONTHS_SHORT[B.m - 1]} ${B.y}`;
}
function periodBarHTML(cmp, { minimal = false } = {}) {
  const k = reportPeriod.kind === 'monthOf' ? (cmp.cur.kind === 'mtd' ? 'month' : 'custom-month') : reportPeriod.kind;
  const btn = (kind, short, long) => `<button type="button" aria-pressed="${k === kind}" aria-label="${long}" onclick="setPeriod('${kind}')"><span class="sm">${short}</span><span class="lg">${long}</span></button>`;
  const custom = reportPeriod.kind === 'custom' ? `<div class="custom-range"><label for="pf">From</label>
      <input type="date" id="pf" value="${cmp.cur.from}" onchange="setCustom('from', this.value)">
      <label for="pt">to</label><input type="date" id="pt" value="${cmp.cur.to}" onchange="setCustom('to', this.value)"></div>` : '';
  const cov = cmp.coverage === 'none' ? 'No earlier trading to compare.' : cmp.coverage === 'partial' ? 'The comparison period includes time before trading began.' : '';
  const today = londonToday();
  const to = cmp.cur.to > today ? today : cmp.cur.to;
  const label = reportPeriod.kind === 'monthOf' && k === 'custom-month' ? `${MONTHS_LONG[reportPeriod.m - 1]} ${reportPeriod.y} · ` : '';
  const segHTML = `<div class="seg" role="group" aria-label="Reporting period">${btn('month', 'Month', 'This month')}${btn('lastMonth', 'Last month', 'Last month')}${btn('ytd', 'YTD', 'YTD')}${btn('custom', 'Custom', 'Custom')}</div>`;
  // Home page: presets need no dates; Custom shows only the chosen dates (its date fields).
  if (minimal) return `<div class="period-wrap minimal">${segHTML}${custom}${reportPeriod.kind === 'monthOf' ? `<div class="period-dates2"><span class="period-sel">${MONTHS_LONG[reportPeriod.m - 1]} ${reportPeriod.y}</span></div>` : ''}</div>`;
  return `<div class="period-wrap">
    <div class="seg" role="group" aria-label="Reporting period">${btn('month', 'Month', 'This month')}${btn('lastMonth', 'Last month', 'Last month')}${btn('ytd', 'YTD', 'YTD')}${btn('custom', 'Custom', 'Custom')}</div>
    ${custom}
    <div class="period-dates2"><span class="period-sel">${label}${fmtRangeShort(cmp.cur.from, to)}${cmp.cur.to > today ? ' (to today)' : ''}</span>
      <button type="button" class="linkbtn period-cmp-btn" aria-expanded="false" aria-controls="period-cmp" onclick="const d=document.getElementById('period-cmp');const o=d.hidden;d.hidden=!o;this.setAttribute('aria-expanded',String(o))">Compared with…</button>
      <span class="period-cmp" id="period-cmp" hidden>Compared with ${esc(cmp.prevRange.label)}${cmp.prevRange.note ? ` (${esc(cmp.prevRange.note)})` : ''}. ${cov}</span></div>
  </div>`;
}

// ── Compact review summary (expands to an actionable list) ──
function reviewBarHTML(R, id = 'rv') {
  const c = R.confidence;
  const cls = c.status === 'incomplete' ? 'err' : c.needsReview ? 'warn' : '';
  const dot = c.status === 'incomplete' ? 'err' : c.status === 'estimated' ? 'warn' : 'ok';
  const head = c.issues.length
    ? `Profit: ${esc(c.label)} · ${c.issues.length} item${c.issues.length > 1 ? 's' : ''} to review`
    : `Profit: ${esc(c.label)}`;
  const items = c.issues.map(i => `<div class="review-item"><div><span class="dot ${i.level}"></span><strong>${i.title}</strong><p>${i.detail}</p></div>
      ${reviewActionButton(i.action)}</div>`).join('');
  return `<div class="review-bar ${cls}" id="${id}">
    <div><span class="dot ${dot}"></span>${head}</div>
    ${c.issues.length ? `<button class="btn btn-secondary btn-sm" aria-expanded="false" onclick="const b=document.getElementById('${id}');const o=b.classList.toggle('open');this.setAttribute('aria-expanded',o);this.textContent=o?'Hide':'Review'">Review</button>` : ''}
    <div class="review-list">${items}
      <div style="font-size:12.5px;color:var(--text-3)">A balancing balance sheet or an empty list doesn't confirm figures against the bank — cash is checked separately.</div></div>
  </div>`;
}
// Overview: one compact line; the full list opens in a sheet.
function overviewIssues(R, today = londonToday()) {
  const list = [...R.confidence.issues];
  const sc = stockCountCheck(today);
  if (sc.hasCount && (sc.impossible || sc.large)) list.push({ key: 'stock-count', level: 'warn',
    title: sc.impossible ? 'Stock count is higher than everything bought' : `Stock count differs from book value by ${fmt(sc.variance)}`,
    detail: sc.impossible ? `Saved count ${fmt(sc.value)} is more than all stock bought at cost (${fmt(sc.maxPossible)}) — check it isn't at retail value.` : `Count ${fmt(sc.value)} vs book value ${fmt(sc.book)}. The count is a check only; it isn't booked.`, action: 'stock' });
  return list;
}
function reviewRowHTML(R) {
  const n = overviewIssues(R).length;
  if (!n) return '';
  const lvl = R.confidence.status === 'incomplete' ? 'err' : 'warn';
  return `<div class="review-row" data-testid="review-row"><span><span class="dot ${lvl}"></span>${n} item${n > 1 ? 's' : ''} to review</span>
    <button class="btn btn-secondary btn-sm" onclick="openReviewSheet()">Review</button></div>`;
}
function openReviewSheet() {
  const R = computeReport(periodRange(reportPeriod), londonToday());
  const items = overviewIssues(R);
  openFormModal('To review', `<p class="sheet-note">Profit status: <strong>${esc(R.confidence.label)}</strong>. A balancing balance sheet or an empty list doesn't confirm figures against the bank — cash is checked separately.</p>
    ${items.map(i => `<div class="review-item"><div><span class="dot ${i.level}"></span><strong>${i.title}</strong><p>${i.detail}</p></div>${reviewActionButton(i.action, true)}</div>`).join('') || '<p>Nothing to review.</p>'}`,
    `<button class="btn btn-primary" onclick="closeModal()">Close</button>`);
}
function reviewActionButton(action, fromSheet = false) {
  const map = { missing: ["Open orders", "openReview('missing')"], postage: ['Review postage', "openReview('postage')"],
    refunds: ['Open refunds', "openReview('refunds')"], lock: ['Lock costs', 'openLockCosts()'], expenses: ['Open expenses', "navigate('expenses')"],
    zero: ['Open orders', "openReview('zero')"], stock: ['Open stock', 'openStockSheet()'] };
  const m = map[action];
  return m ? `<button class="btn btn-ghost btn-sm" onclick="${fromSheet && !/^open(LockCosts|StockSheet)/.test(m[1]) ? 'closeModal();' : ''}${m[1]}">${m[0]}</button>` : '';
}
function openReview(kind) {
  if (kind === 'postage') { expenseFilter = 'postage'; navigate('expenses'); return; }
  orderFilter = kind === 'missing' ? 'missing' : kind === 'refunds' ? 'refunds' : kind === 'zero' ? 'zero' : 'review';
  navigate('orders');
}

// ── Saving helpers: one submission at a time, errors keep the form open ──
let _busy = false;
async function runSave(btn, fn) {
  if (_busy) return;
  _busy = true;
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  showModalError('');
  try { await fn(); }
  catch (e) {
    const m = (e && e.message) || 'Save failed';
    // something missing from the form is not a failure — say what's needed and keep the button as it was
    const input = (e && e.inputField) || /^(enter|choose|fill in|select) /i.test(m);
    if (!input) console.warn('Save failed:', m);
    if (document.getElementById('modal-overlay').classList.contains('open')) showModalError(m, { input, field: e && e.inputField });
    else toast((input ? '' : 'Not saved — ') + m);
    if (btn && !input) btn.textContent = 'Retry';
  }
  finally { _busy = false; if (btn && btn.isConnected) { btn.disabled = false; if (btn.textContent === 'Saving…') btn.textContent = label; }
    if (pendingRemoteChange && !document.getElementById('modal-overlay').classList.contains('open')) handleRemoteChange(); }
}
function showModalError(msg, { input = false, field = null } = {}) {
  const el = document.getElementById('modal-error');
  if (!el) return;
  document.querySelectorAll('#modal-body .field-invalid').forEach(f => { f.classList.remove('field-invalid'); f.removeAttribute('aria-invalid'); });
  el.classList.toggle('hint', !!(msg && input));
  el.textContent = !msg ? '' : input ? msg.charAt(0).toUpperCase() + msg.slice(1) + '.' : `Not saved — ${msg}. Your entries are still here; press Retry.`;
  el.classList.toggle('show', !!msg);
  const f = field && document.getElementById(field);
  if (f) { f.classList.add('field-invalid'); f.setAttribute('aria-invalid', 'true'); f.focus(); f.scrollIntoView({ block: 'center' }); }
}
// a missing or invalid entry in a form (shown as guidance, focuses the field)
function needInput(message, fieldId) { const e = new Error(message); e.inputField = fieldId; return e; }
function failIf(res) { if (res && res.error) { setSyncStatus('error', 'Save failed'); throw new Error(res.error.message || 'database error'); } setSyncStatus('synced', 'Saved'); return res; }
function openFormModal(title, bodyHTML, footerHTML) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  document.getElementById('modal-footer').innerHTML = footerHTML;
  showModalError('');
  openModal();
  // focus the first field, unless the user has already moved into the form
  setTimeout(() => { if (!document.getElementById('modal').contains(document.activeElement)) document.querySelector('#modal-body input, #modal-body select')?.focus(); }, 30);
}

let trendChart = null;
const isPhone = () => window.matchMedia('(max-width: 768px)').matches;

// One component for sales, profit and cash: same size, number style and emphasis.
// Phone: full-width row (label left, value right). Desktop: matching cards side by side.
function perfCard({ label, value, sub, subTone = '', badge, muted, onclick, testid, valueTestid, subTestid }) {
  return `<button class="perf-card" onclick="${onclick}" data-testid="${testid}">
    <span class="perf-label">${label}</span>
    <span class="perf-value ${muted ? 'muted-value' : ''}" ${valueTestid ? `data-testid="${valueTestid}"` : ''}>${value}</span>
    <span class="perf-cmp ${subTone}" ${subTestid ? `data-testid="${subTestid}"` : ''}>${sub || ''}</span>
    <span class="perf-badge-wrap">${badge ? `<span class="badge ${badge.cls}" data-testid="${testid}-badge" ${badge.aria ? `aria-label="${badge.aria}"` : ''}>${badge.text}</span>` : ''}</span>
  </button>`;
}
function salesCardHTML(a) {
  return perfCard({ label: 'Sales', value: fmt(a.salesAfterRefunds), testid: 'card-sales', onclick: "openFigureSheet('sales')" });
}
function profitCardHTML(a) {
  const incomplete = a.confidence.status === 'incomplete';
  // net profit as a % of sales after refunds; Incomplete stays because profit is overstated when costs are missing
  const margin = Math.abs(a.salesAfterRefunds) > 0.005 ? `${fmtPct(a.opMarginPct)}${incomplete ? '*' : ''} of sales` : '';
  return perfCard({ label: 'Net profit', value: incomplete ? `${fmt(a.operatingProfit)}*` : fmt(a.operatingProfit), muted: incomplete,
    testid: 'card-profit', onclick: "openFigureSheet('profit')", sub: margin, subTestid: 'profit-margin',
    badge: incomplete ? { cls: 'err', text: 'Incomplete' } : null });
}
// Cash at bank as shown on the home page: the bank-confirmed balance when one is recorded for today, otherwise the estimate.
function cashHeadline(today) { const conf = confirmedBalance(today); return conf && conf.asAt === today ? conf.amount : cashAt(today).cash; }
// Cash is an as-at figure: it never follows the reporting period. The badge carries its date.
function cashCardHTML(today) {
  const C = cashAt(today);
  const conf = confirmedBalance(today);
  const confirmedToday = conf && conf.asAt === today;
  const t = parseYMD(today), d = `${t.d} ${MONTHS_SHORT[t.m - 1]}`;
  return perfCard({ label: 'Cash at bank', value: fmt(confirmedToday ? conf.amount : C.cash), testid: 'card-cash', valueTestid: 'cash-figure', onclick: 'openCashBreakdown()',
    badge: { cls: 'plain', text: d, aria: `As at ${d}` } });
}

// ── Detail sheets ──
function openFigureSheet(kind) {
  const today = londonToday();
  const cmp = compareReports(reportPeriod, today);
  const a = cmp.a;
  const to = cmp.cur.to > today ? today : cmp.cur.to;
  const row = (l, v, cls = '') => `<tr class="${cls}"><td>${l}</td><td class="num">${v}</td></tr>`;
  const period = `<p class="sheet-note">${fmtRangeShort(cmp.cur.from, to)} · compared with ${esc(cmp.prevRange.label)}${cmp.prevRange.note ? ` (${esc(cmp.prevRange.note)})` : ''}.</p>`;
  if (kind === 'sales') {
    const ex = [a.fullRefundOrders ? `${a.fullRefundOrders} fully refunded` : '', a.giftCount ? `${a.giftCount} gift/sample` : ''].filter(Boolean).join(', ');
    openFormModal('Sales', `${period}
      <table class="cash-break" data-testid="sales-detail">
        ${row(`Sales of orders dated in the period (${a.paidOrders} paid order${a.paidOrders !== 1 ? 's' : ''})`, fmt(a.grossSales))}
        ${row(`Refunds recorded in the period${a.refundCount ? ` (${a.refundCount})` : ''}`, '−' + fmt(a.refunds))}
        ${row('Sales after refunds', fmt(a.salesAfterRefunds), 'total')}
      </table>
      <p class="sheet-note">${esc(cmp.sales.text)}. Paid orders: ${a.paidOrders} — ${esc(cmp.orders.text)}${ex ? `; excludes ${ex}` : ''}.</p>
      <p class="sheet-note">A refund reduces sales on the date it's recorded; the original sale stays on its own date.</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Close</button><button class="btn btn-primary" onclick="reportsTab='orders';reportsOrderFilter='all';navigate('reports')">Open in Reports</button>`);
  } else {
    const st = a.confidence;
    openFormModal('Net profit', `${period}
      <p class="sheet-note"><span class="badge ${st.status === 'incomplete' ? 'err' : st.status === 'estimated' ? 'warn' : 'ok'}">${esc(st.label)}</span></p>
      <table class="cash-break" data-testid="profit-detail">
        ${row('Sales after refunds', fmt(a.salesAfterRefunds))}
        ${row('Contribution (after scarves, postage and fees)', fmt(a.contribution))}
        ${row('Packaging, gifts and unlinked postage', '−' + fmt(a.otherDirect))}
        ${row('Operating expenses', '−' + fmt(a.totalOpEx))}
        ${row('Net profit', fmt(a.operatingProfit), 'total')}
      </table>
      <p class="sheet-note">${esc(cmp.profit.text)}.${st.status === 'incomplete' ? ` ${a.missingCost.length} order${a.missingCost.length > 1 ? 's have' : ' has'} no product cost, counted as £0 — profit is overstated until fixed.` : ''}</p>
      ${st.issues.length ? `<button class="btn btn-secondary" style="width:100%" onclick="openReviewSheet()">Review ${st.issues.length} item${st.issues.length > 1 ? 's' : ''}</button>` : ''}`,
      `<button class="btn btn-ghost" onclick="closeModal()">Close</button><button class="btn btn-primary" onclick="reportsTab='pl';navigate('reports')">Open P&amp;L</button>`);
  }
}

function cashBreakdownHTML(today) {
  const C = cashAt(today);
  const conf = confirmedBalance(today);
  const confirmedToday = conf && conf.asAt === today;
  const lastConf = conf && !confirmedToday
    ? `<p class="cash-note">Last confirmed: <strong>${fmt(conf.amount)}</strong> on ${fmtDateLong(conf.asAt)} (${esc(conf.source)}). Your records estimated ${fmt(conf.estimateThen)} for that date — ${Math.abs(conf.difference) < 0.01 ? 'they matched' : `a difference of ${fmt(conf.difference)}`}.</p>`
    : confirmedToday ? `<p class="cash-note">Bank balance ${fmt(conf.amount)} confirmed from ${esc(conf.source)}. Your records estimate ${fmt(C.cash)} for today${Math.abs(conf.amount - C.cash) >= 0.01 ? ` — ${fmt(conf.amount - C.cash)} different from the bank` : ', matching the bank'}.</p>`
    : '';
  const row = (l, v, sign = '') => `<tr><td>${l}</td><td class="num">${sign}${fmt(Math.abs(v))}</td></tr>`;
  return `<div data-testid="cash-breakdown">
    <p class="cash-note" style="margin-top:0"><strong>${confirmedToday ? 'Confirmed' : 'Estimated — not confirmed with the bank'}</strong> · as at ${fmtDateLong(today)}. Not affected by the reporting period.</p>
    ${lastConf}
    <table class="cash-break">
      <tr><td>Starting cash</td><td class="num">${C.startingCashRecorded ? fmt(C.startingCash) : 'Not recorded'}</td></tr>
      ${row('Owner investment and loans received', C.ownerIn + C.loansIn, '+')}
      ${C.otherIncome ? row('Other income', C.otherIncome, '+') : ''}
      ${row(`Sales receipts — estimated (payouts assumed to arrive ${C.shopifyLag} days after a Shopify order, ${C.foldLag} after Fold)`, C.salesReceipts, '+')}
      ${C.feeRefunds ? row('Platform fees refunded', C.feeRefunds, '+') : ''}
      ${row(`Money spent, including stock purchases of ${fmt(C.stockPurchases)}`, C.spent, '−')}
      ${C.postageAssumed ? row('Postage assumed paid (orders without a matched payment)', C.postageAssumed, '−') : ''}
      ${C.returnPostage ? row('Return postage', C.returnPostage, '−') : ''}
      ${C.refundsPaid ? row('Refunds paid to customers', C.refundsPaid, '−') : ''}
      ${row('Loan repayments and drawings', C.loanRepay + C.drawings, '−')}
      <tr class="total"><td>Estimated cash at bank</td><td class="num">${fmt(C.cash)}</td></tr>
    </table>
    <p class="cash-note"><strong>Cash inc. pending payouts: ${fmt(cashHeadline(today) + C.pending)}</strong> (cash at bank ${fmt(cashHeadline(today))} + pending ${fmt(C.pending)}).</p>
    <p class="cash-note">Not included: pending payouts of ${fmt(C.pending)}${C.refundsOwed > 0.005 ? ` and refunds owed to customers of ${fmt(C.refundsOwed)}` : ''}.
      Loans and your own money put in raise cash but are not sales or profit. Only a balance from your bank statement confirms this figure.</p>
  </div>`;
}
function openCashBreakdown() {
  openFormModal('Cash at bank', cashBreakdownHTML(londonToday()),
    `<button class="btn btn-ghost" onclick="closeModal()">Close</button><button class="btn btn-primary" onclick="openBankBalanceForm()">Record a bank balance</button>`);
}

function openStockSheet() {

// Small supporting totals, plus a visual win when there is one.

function drawTrend(today) {
  const phone = isPhone();
  const series = monthlySeries(today, phone ? 6 : 12);
  window.__trend = series;
  if (typeof Chart === 'undefined') return;
  if (trendChart) trendChart.destroy();
  const ctx = document.getElementById('trend-chart');
  if (!ctx) return;
  const money = v => Math.abs(v) >= 1000 ? `£${(v / 1000).toFixed(v % 1000 === 0 ? 0 : 1)}k` : `£${v}`;
  // the current, incomplete month: two-line label and a lighter bar — no explanation needed
  const labels = series.map((s, i) => {
    const yr = (i === 0 || s.m === 1) && series.some(x => x.y !== s.y) ? ` ${String(s.y).slice(-2)}` : '';
    return s.complete ? `${MONTHS_SHORT[s.m - 1]}${yr}` : [`${MONTHS_SHORT[s.m - 1]}${yr}`, 'so far'];
  });
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  trendChart = new Chart(ctx.getContext('2d'), {
    data: {
      labels,
      datasets: [
        { type: 'bar', label: 'Sales', data: series.map(s => s.sales), order: 2, borderRadius: 6, maxBarThickness: 46,
          backgroundColor: series.map(s => (s.complete ? '#C4A88A' : 'rgba(196,168,138,.45)')),
          borderColor: series.map(s => (s.complete ? '#C4A88A' : '#A88C6E')), borderWidth: series.map(s => (s.complete ? 0 : 1.5)), borderDash: [4, 3] },
        { type: 'line', label: 'Profit', data: series.map(s => (s.incomplete ? null : s.profit)), order: 1, borderColor: '#2F6248', backgroundColor: '#2F6248',
          borderWidth: 3, pointRadius: 4.5, pointHoverRadius: 6, spanGaps: false, tension: .25,
          segment: { borderDash: c => (series[c.p1DataIndex] && !series[c.p1DataIndex].complete ? [6, 4] : undefined) } },
      ],
    },
    options: {
      maintainAspectRatio: false, responsive: true,
      animation: reduce ? false : { duration: 400 },
      interaction: { mode: 'index', intersect: false },
      events: ['click', 'touchstart', 'mousemove', 'mouseout'],
      plugins: {
        legend: { display: true, position: 'top', align: 'start', labels: { sort: (a, b) => a.datasetIndex - b.datasetIndex, font: { family: 'Sono, monospace', size: 14 }, boxWidth: 14, boxHeight: 14, padding: 14 } },
        tooltip: { itemSort: (a, b) => a.datasetIndex - b.datasetIndex, titleFont: { family: 'Sono, monospace', size: 14 }, bodyFont: { family: 'Sono, monospace', size: 14 }, padding: 10,
          callbacks: { title: items => { const s = series[items[0].dataIndex]; return `${MONTHS_SHORT[s.m - 1]} ${s.y}${s.complete ? '' : ' (so far)'}`; },
                       label: c => {
                         if (c.raw == null) return `${c.dataset.label}: costs incomplete`;
                         const s = series[c.dataIndex];
                         // profit also as a % of that month's sales
                         return c.datasetIndex === 1 && Math.abs(s.sales) > 0.005 ? `${c.dataset.label}: ${fmt(c.raw)} (${fmtPct(c.raw / s.sales)})` : `${c.dataset.label}: ${fmt(c.raw)}`;
                       } } } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { family: 'Sono, monospace', size: 14 }, color: '#4A4540', maxRotation: 0, autoSkip: false } },
        y: { grid: { color: '#EEE8DF' }, border: { display: false }, ticks: { font: { family: 'Sono, monospace', size: 13 }, color: '#6B655E', maxTicksLimit: 6, callback: money } },
      },
    },
  });
}

async function saveBankBalance() {
  if (writesBlocked()) throw new Error('data not loaded');
  const asAt = document.getElementById('bb-date').value, amount = parseFloat(document.getElementById('bb-amt').value);
  if (!isValidYMD(asAt) || !Number.isFinite(amount)) throw new Error('enter a date and a balance');
  if (asAt > londonToday()) throw new Error('the date cannot be in the future');
  const next = clone(state.settings);
  next.bankBalances = [...(next.bankBalances || []), { asAt, amount, source: document.getElementById('bb-src').value.trim() || 'Bank statement', recordedAt: new Date().toISOString() }];
  failIf(await saveSettingsRow('app_settings', next));
  state.settings = next;
  if (settingsDraft) settingsDraft.bankBalances = clone(next.bankBalances);
  closeModal(); toast('Bank balance recorded.'); renderView(currentView);
}
