// ── Period report ──────────────────────────────────
function computeReport(rangeIn, today = londonToday()) {
  const range = capToToday(rangeIn, today);
  const idx = postageIndex();
  const inR = d => inDateRange(d, range);
  const R = {
    range, grossSales: 0, refunds: 0, refundCount: 0, partialRefundOrders: 0, fullRefundOrders: 0,
    cogs: 0, stockBack: 0, stockReturned: 0, giftsCost: 0, units: 0, postageEst: 0, postageAdj: 0, matchedOrders: 0, unmatchedOrders: 0,
    shopifyFees: 0, foldFees: 0, feeRefunds: 0, returnPostage: 0,
    paidOrders: 0, paidSales: 0, nova: 0, fold: 0, direct: 0, giftCount: 0, cancelledCount: 0,
    missingCost: [], unlocked: [], zeroValue: [], estimatedLocks: 0, legacyRefunds: [], refundsUnpaid: 0, refundsNoReturnInfo: 0,
    unitsBySku: {}, byChannel: { shopify: { n: 0, contribution: 0 }, fold: { n: 0, contribution: 0 }, direct: { n: 0, contribution: 0 } },
    orderReceipts: 0, postageAssumedPaid: 0, refundsPaid: 0,
  };
  state.orders.forEach(o => {
    const c = calcOrder(o, idx);
    if (inR(o.date) && c.type !== 'cancelled') {
      if (c.type === 'sale') {
        R.grossSales += c.revenue; R.cogs += c.productCost; R.units += c.units;
        R.shopifyFees += c.shopifyFee; R.foldFees += c.foldFee; R.orderReceipts += c.payout;
        if (isPaidOrder(o, c, today)) { R.paidOrders++; R.paidSales += c.revenue; R[c.channel === 'fold' ? 'fold' : c.channel === 'direct' ? 'direct' : 'nova']++;
          R.byChannel[c.channel].n++; R.byChannel[c.channel].contribution += c.contribution; }
        c.lines.forEach(l => { R.unitsBySku[l.sku] = (R.unitsBySku[l.sku] || 0) + l.qty; });
        if (!(c.revenue > 0) && !o.orderType) R.zeroValue.push(o.id);
      } else { R.giftsCost += c.productCost; R.giftCount++; }
      R.postageEst += c.shipEst;
      if (c.postageMatched) { R.postageAdj += c.postage - c.shipEst; R.matchedOrders++; }
      else { R.postageAssumedPaid += c.shipEst; if (c.shipEst > 0) R.unmatchedOrders++; }
      if (c.costMissing) R.missingCost.push({ id: o.id, orderNum: o.orderNum, skus: c.missingSkus });
      if (!c.locked) R.unlocked.push(o.id); else if (c.basis === 'estimated') R.estimatedLocks++;
    } else if (inR(o.date) && c.type === 'cancelled') R.cancelledCount++;
    // Refunds come off the month the order was placed (Tyler's standard), once the refund has happened
    // (refund date on or before today). Cash still moves on the refund's paid date (see cashAt).
    const refs = refundsOf(o, c);
    let refInPeriod = false;
    refs.forEach(r => {
      const e = refundEffects(o, r, c);
      const happened = isValidYMD(e.date) && e.date <= today;
      if (happened && inR(e.date)) R.stockReturned += e.stockBack;      // stock physically back in the period
      if (happened && inR(o.date)) {
        refInPeriod = true;
        R.refunds += e.amount; R.refundCount++; R.stockBack += e.stockBack; R.feeRefunds += e.feeRefund; R.returnPostage += e.returnPostage;
        if (e.legacy) R.legacyRefunds.push(o.id);
        if (e.returnedUnknown) R.refundsNoReturnInfo++;
      }
      if (e.paidDate && inR(e.paidDate)) R.refundsPaid += e.amount;
      if (happened && inR(o.date) && !e.paidDate) R.refundsUnpaid += e.amount;
    });
    if (refInPeriod) { if (fullyRefunded(o, c, today)) R.fullRefundOrders++; else R.partialRefundOrders++; }
  });

  const txs = state.transactions.filter(t => inR(t.date));
  const sumCat = cat => txs.filter(t => t.category === cat).reduce((a, t) => a + num(t.amount), 0);
  R.unlinkedPostage = 0; R.unreviewedPostage = 0; R.unreviewedPostageCount = 0; R.postageTx = 0;
  txs.forEach(t => {
    if (t.category !== 'Shipping & Postage') return;
    const info = idx.txInfo.get(t.id);
    R.postageTx += num(t.amount);
    R.unlinkedPostage += info.unlinked;
    if (info.status === 'unreviewed') { R.unreviewedPostage += num(t.amount); R.unreviewedPostageCount++; }
  });
  R.salesAfterRefunds = R.grossSales - R.refunds;
  R.costOfScarvesSold = R.cogs - R.stockBack;
  R.platformFees = R.shopifyFees + R.foldFees - R.feeRefunds;
  R.postageOrders = R.postageEst + R.postageAdj;
  R.contribution = R.salesAfterRefunds - R.costOfScarvesSold - R.postageOrders - R.platformFees - R.returnPostage;
  R.packaging = sumCat('Packaging');
  R.otherDirect = R.packaging + R.giftsCost + R.unlinkedPostage;
  R.opex = {}; OPEX_CATS.forEach(c => { R.opex[c] = sumCat(c); });
  R.totalOpEx = Object.values(R.opex).reduce((a, v) => a + v, 0);
  R.operatingProfit = R.contribution - R.otherDirect - R.totalOpEx;
  R.otherIncome = sumCat('Other Income');
  R.profitBeforeTax = R.operatingProfit + R.otherIncome;
  R.stockPurchases = sumCat('Stock Purchases');
  R.stockStart = bookStock(range.from, false, idx).value;
  R.stockEnd = R.stockStart + R.stockPurchases - R.cogs - R.giftsCost + R.stockReturned;   // book stock moves when stock actually comes back
  // Cash movement (estimated; receipts by order date, payout timing not applied)
  R.loanIn = sumCat('Loan Received'); R.loanOut = sumCat('Loan Repayment');
  R.ownerIn = sumCat('Owner Investment'); R.ownerOut = sumCat('Owner Drawings');
  R.cashMovement = R.orderReceipts + R.feeRefunds - R.refundsPaid - R.postageAssumedPaid - R.returnPostage + R.otherIncome
                 - R.stockPurchases - R.packaging - R.postageTx - R.totalOpEx + R.loanIn - R.loanOut + R.ownerIn - R.ownerOut;
  R.salesCatCount = txs.filter(t => t.category === 'Sales').length;
  R.salesCatTotal = sumCat('Sales');
  R.unknownCatCount = txs.filter(t => !CAT_CFG[t.category]).length;
  R.futureCount = (rangeIn.to > today) ? state.orders.filter(o => isValidYMD(o.date) && o.date > today && o.date <= rangeIn.to).length
                + state.transactions.filter(t => isValidYMD(t.date) && t.date > today && t.date <= rangeIn.to).length : 0;
  R.avgOrder = R.paidOrders ? R.paidSales / R.paidOrders : 0;   // gross value of orders still counted as paid
  R.cmPct = R.salesAfterRefunds ? R.contribution / R.salesAfterRefunds : 0;
  R.opMarginPct = R.salesAfterRefunds ? R.operatingProfit / R.salesAfterRefunds : 0;
  R.confidence = profitConfidence(R);
  return R;
}

// ── Confidence ─────────────────────────────────────
// Automatic cost locking is on unless Settings says otherwise (autoLockCosts: false).
function autoLockOn() { return state.settings.autoLockCosts !== false; }
function profitConfidence(R) {
  const issues = [];
  if (R.missingCost.length) issues.push({ key: 'missing', level: 'err', title: `${R.missingCost.length} order${R.missingCost.length > 1 ? 's' : ''} missing product costs`,
    detail: `Scarf cost counted as £0 (${[...new Set(R.missingCost.flatMap(x => x.skus))].map(esc).join(', ')}). Profit is incomplete.`, action: 'missing' });
  if (R.unreviewedPostageCount) issues.push({ key: 'postage-tx', level: 'warn', title: `${R.unreviewedPostageCount} postage payment${R.unreviewedPostageCount > 1 ? 's' : ''} to review (${fmt(R.unreviewedPostage)})`,
    detail: 'Counted as postage not linked to orders. If they paid for customer shipments, match them so the estimate is replaced instead of counted twice.', action: 'postage' });
  if (R.legacyRefunds.length) issues.push({ key: 'legacy-refund', level: 'warn', title: `${R.legacyRefunds.length} refund${R.legacyRefunds.length > 1 ? 's need' : ' needs'} details`,
    detail: 'Marked refunded before details were recorded: treated as a full refund on the order, stock not assumed returned, fees assumed kept by the platform.', action: 'refunds' });
  if (R.refundsNoReturnInfo) issues.push({ key: 'refund-return', level: 'info', title: `${R.refundsNoReturnInfo} refund${R.refundsNoReturnInfo > 1 ? 's' : ''} without return details`,
    detail: 'No returned scarf is recorded, so nothing has gone back into stock.', action: 'refunds' });
  if (R.unlocked.length && !autoLockOn()) issues.push({ key: 'unlocked', level: 'info', title: `${R.unlocked.length} order${R.unlocked.length > 1 ? 's' : ''} without locked costs`,
    detail: 'Costed at the Settings rates for their dates. Lock them so later Settings changes can never alter them.', action: 'lock' });
  if (R.zeroValue.length) issues.push({ key: 'zero-value', level: 'info', title: `${R.zeroValue.length} zero-value order${R.zeroValue.length > 1 ? 's' : ''}`,
    detail: 'Not counted as paid orders. Open one and tap Mark as gift so its scarf cost is reported separately.', action: 'zero' });
  if (R.salesCatCount) issues.push({ key: 'sales-cat', level: 'warn', title: `${R.salesCatCount} transaction${R.salesCatCount > 1 ? 's' : ''} categorised Sales`,
    detail: `${fmt(R.salesCatTotal)} excluded from profit and cash — sales come from Orders. Record genuine sales as orders.`, action: 'expenses' });
  if (R.unknownCatCount) issues.push({ key: 'unknown-cat', level: 'warn', title: `${R.unknownCatCount} transaction${R.unknownCatCount > 1 ? 's' : ''} with an unknown category`, detail: 'Not counted anywhere.', action: 'expenses' });
  // Postage at the Settings rates and automatically locked costs are final; only things that need a decision make profit "estimated".
  const status = R.missingCost.length ? 'incomplete' : (R.unreviewedPostageCount || R.legacyRefunds.length) ? 'estimated' : 'ready';
  const label = status === 'incomplete' ? 'Incomplete — product costs missing'
              : status === 'estimated' ? (R.unreviewedPostageCount ? 'Estimated — postage payments to review' : 'Estimated — refund details missing')
              : 'Up to date';
  return { status, label, issues, needsReview: issues.filter(i => i.level !== 'info').length };
}

// ── Cash (as at a date; independent of the reporting period) ──
function cashAt(date) {
  const s = state.settings;
  const idx = postageIndex(date);
  const shopifyLag = lagDays(s.platformPayoutLagDays, 7), foldLag = lagDays(s.foldPayoutLagDays, 14);
  const on = d => isValidYMD(d) && d <= date;
  const C = { date, startingCash: num(s.openingCash), startingCashRecorded: s.openingCash != null && s.openingCash !== '',
    ownerIn: 0, loansIn: 0, otherIncome: 0, salesReceipts: 0, feeRefunds: 0, spent: 0, stockPurchases: 0, postageAssumed: 0,
    returnPostage: 0, refundsPaid: 0, refundsRecorded: 0, loanRepay: 0, drawings: 0, shopifyPending: 0, foldPending: 0, confirmedReceipts: 0, shopifyLag, foldLag };
  state.transactions.forEach(t => {
    if (!on(t.date) || t.category === 'Sales') return;
    const a = num(t.amount);
    switch (t.category) {
      case 'Owner Investment': C.ownerIn += a; break;
      case 'Loan Received': C.loansIn += a; break;
      case 'Other Income': C.otherIncome += a; break;
      case 'Loan Repayment': C.loanRepay += a; break;
      case 'Owner Drawings': C.drawings += a; break;
      default: if (CAT_CFG[t.category]?.d === 'Out') { C.spent += a; if (t.category === 'Stock Purchases') C.stockPurchases += a; }
    }
  });
  const shopCut = addDays(date, -shopifyLag), foldCut = addDays(date, -foldLag);
  state.orders.forEach(o => {
    if (!on(o.date)) return;
    const c = calcOrder(o, idx);
    if (c.type === 'cancelled') return;
    if (!c.postageMatched) C.postageAssumed += c.shipEst;
    if (c.type === 'sale') {
      // A recorded payout date (from a platform statement) beats the payout-delay estimate.
      const pending = o.payoutDate ? !on(o.payoutDate) : (c.channel === 'shopify' ? o.date >= shopCut : c.channel === 'fold' ? o.date >= foldCut : false);
      if (pending && c.channel === 'shopify') C.shopifyPending += c.payout;
      else if (pending && c.channel === 'fold') C.foldPending += c.payout;
      else { C.salesReceipts += c.payout; if (o.payoutDate) C.confirmedReceipts += c.payout; }
    }
    refundsOf(o, c).forEach(r => {
      const e = refundEffects(o, r, c);
      if (on(e.date)) { C.refundsRecorded += e.amount; C.feeRefunds += e.feeRefund; C.returnPostage += e.returnPostage; }
      if (e.paidDate && on(e.paidDate)) C.refundsPaid += e.amount;
    });
  });
  C.moneyIn = C.startingCash + C.ownerIn + C.loansIn + C.otherIncome + C.salesReceipts + C.feeRefunds;
  C.moneyOut = C.spent + C.postageAssumed + C.returnPostage + C.refundsPaid + C.loanRepay + C.drawings;
  C.cash = C.moneyIn - C.moneyOut;
  C.pending = C.shopifyPending + C.foldPending;
  C.refundsOwed = C.refundsRecorded - C.refundsPaid;
  return C;
}

// Latest bank-confirmed balance (entered from a statement, or from a connected bank), never derived from orders.
function confirmedBalance(today = londonToday()) {
  const list = (state.settings.bankBalances || []).filter(b => isValidYMD(b.asAt) && b.asAt <= today && Number.isFinite(parseFloat(b.amount)));
  if (!list.length) return null;
  const b = list.sort((a, c) => (a.asAt < c.asAt ? 1 : a.asAt > c.asAt ? -1 : (a.recordedAt < c.recordedAt ? 1 : -1)))[0];
  const est = cashAt(b.asAt);
  return { amount: num(b.amount), asAt: b.asAt, source: b.source || 'Bank statement', recordedAt: b.recordedAt, estimateThen: est.cash, difference: num(b.amount) - est.cash };
}

function computeAsAt(today = londonToday()) {
  const C = cashAt(today);
  const stock = bookStock(today, true);
  const txs = state.transactions.filter(t => onOrBefore(t.date, today));
  const sumCat = cat => txs.filter(t => t.category === cat).reduce((a, t) => a + num(t.amount), 0);
  const directorLoan = sumCat('Loan Received') - sumCat('Loan Repayment');
  const ownerCapital = sumCat('Owner Investment') - sumCat('Owner Drawings');
  const refundsOwed = C.refundsRecorded - C.refundsPaid;
  const retained = computeReport(allTimeRange(today), today).profitBeforeTax;
  const totalAssets = C.cash + C.pending + stock.value;
  const totalLiabilities = directorLoan + refundsOwed;
  const totalEquity = ownerCapital + C.startingCash + num(state.settings.openingStock) + retained;
  const difference = totalAssets - totalLiabilities - totalEquity;
  return { today, cash: C, inventory: stock.value, stock, directorLoan, refundsOwed, ownerCapital, retained,
           totalAssets, totalLiabilities, totalEquity, totalLiabEquity: totalLiabilities + totalEquity, difference, balanced: Math.abs(difference) < 0.01,
           invalidDateCount: state.orders.filter(o => !isValidYMD(o.date)).length + state.transactions.filter(t => !isValidYMD(t.date)).length,
           futureCount: state.orders.filter(o => isValidYMD(o.date) && o.date > today).length + state.transactions.filter(t => isValidYMD(t.date) && t.date > today).length };
}

function stockCountCheck(today = londonToday()) {
  const s = state.settings;
  const value = num(s.closingStock);
  const date = isValidYMD(s.stockCountDate) ? s.stockCountDate : null;
  if (!(value > 0) && !date) return { hasCount: false };
  const asOf = date && date <= today ? date : today;
  const book = bookStock(asOf, true);
  const maxPossible = book.opening + book.purchases;
  return { hasCount: true, value, date, asOf, book: book.value, maxPossible, variance: value - book.value,
           impossible: value > maxPossible + 0.005, large: Math.abs(value - book.value) > Math.max(25, Math.abs(book.value) * 0.10) };
}

// ═══════════════════════════════════════════════════
// PERIODS & FAIR COMPARISONS
// ═══════════════════════════════════════════════════
function shiftYear(d, n) { const { y, m, d: dd } = parseYMD(d); return ymd(y + n, m, Math.min(dd, daysInMonth(y + n, m))); }
function daysBetween(a, b) { const A = parseYMD(a), B = parseYMD(b); return Math.round((Date.UTC(B.y, B.m - 1, B.d) - Date.UTC(A.y, A.m - 1, A.d)) / 86400000); }
function firstTradingDate() {
  const d = state.orders.filter(o => orderType(o) === 'sale' && num(o.revenue) > 0 && isValidYMD(o.date)).map(o => o.date).sort()[0];
  return d || null;
}
function firstActivityDate() {
  return [...state.orders.map(o => o.date), ...state.transactions.map(t => t.date)].filter(isValidYMD).sort()[0] || null;
}

function periodRange(p = reportPeriod, today = londonToday()) {
  const t = parseYMD(today);
  if (p.kind === 'lastMonth') { const lm = addMonths(t.y, t.m, -1); return { kind: 'month-complete', from: monthStart(lm.y, lm.m), to: monthEnd(lm.y, lm.m), label: `${MONTHS_LONG[lm.m - 1]} ${lm.y}`, name: 'Last month' }; }
  if (p.kind === 'ytd') { const r = ytdRange(today); return { ...r, kind: 'ytd', name: 'Year to date' }; }
  if (p.kind === 'l3m') {   // rolling: the day after the same date 3 months ago, up to today (6 Nov → 7 Aug – 6 Nov)
    const from = addDays(shiftMonths(today, -3), 1);
    return { kind: 'l3m', from, to: today, label: `${fmtDateLong(from)} – ${fmtDateLong(today)}`, name: 'Last 3 months' };
  }
  if (p.kind === 'all') return { kind: 'all', from: EPOCH, to: today, label: 'All time', name: 'All time' };
  if (p.kind === 'monthOf' && p.y && p.m) {
    if (p.y === t.y && p.m === t.m) return { kind: 'mtd', from: monthStart(t.y, t.m), to: today, label: `${MONTHS_LONG[t.m - 1]} ${t.y} to date`, name: 'This month' };
    return { kind: 'month-complete', from: monthStart(p.y, p.m), to: monthEnd(p.y, p.m), label: `${MONTHS_LONG[p.m - 1]} ${p.y}`, name: `${MONTHS_SHORT[p.m - 1]} ${p.y}` };
  }
  if (p.kind === 'custom' && isValidYMD(p.from) && isValidYMD(p.to)) {
    const [from, to] = p.from <= p.to ? [p.from, p.to] : [p.to, p.from];
    return { kind: 'custom', from, to, label: `${fmtDateLong(from)} – ${fmtDateLong(to)}`, name: 'Custom' };
  }
  return { kind: 'mtd', from: monthStart(t.y, t.m), to: today, label: `${MONTHS_LONG[t.m - 1]} ${t.y} to date`, name: 'This month' };
}

// Completed month → previous completed month; month to date → same elapsed dates last month;
// YTD → same elapsed part of the previous financial year; custom → preceding equal-length period.
function comparisonRange(cur, today = londonToday()) {
  const end = cur.to > today ? today : cur.to;
  if (cur.kind === 'month-complete') {
    const { y, m } = parseYMD(cur.from); const p = addMonths(y, m, -1);
    const r = { from: monthStart(p.y, p.m), to: monthEnd(p.y, p.m) };
    const a = daysInMonth(y, m), b = daysInMonth(p.y, p.m);
    return { ...r, label: `${MONTHS_LONG[p.m - 1]} ${p.y}`, note: a !== b ? `${a} vs ${b} days` : '' };
  }
  if (cur.kind === 'mtd') {
    const { y, m, d } = parseYMD(end); const p = addMonths(y, m, -1);
    const dd = Math.min(d, daysInMonth(p.y, p.m));
    return { from: monthStart(p.y, p.m), to: ymd(p.y, p.m, dd), label: `1–${dd} ${MONTHS_SHORT[p.m - 1]} ${p.y}`,
             note: d > dd ? `last month only had ${dd} days` : '' };
  }
  if (cur.kind === 'l3m') {   // the rolling 3 months before that (7 Aug – 6 Nov → 7 May – 6 Aug)
    const r = { from: addDays(shiftMonths(addDays(cur.from, -1), -3), 1), to: addDays(cur.from, -1) };
    return { ...r, label: `${fmtDateLong(r.from)} – ${fmtDateLong(r.to)}`, note: '' };
  }
  if (cur.kind === 'all') return { from: EPOCH, to: EPOCH, label: 'nothing (all time)', note: '' };   // no earlier period exists
  if (cur.kind === 'ytd') {
    const r = { from: shiftYear(cur.from, -1), to: shiftYear(end, -1) };
    return { ...r, label: `${fmtDateLong(r.from)} – ${fmtDateLong(r.to)}`, note: '' };
  }
  const n = daysBetween(cur.from, end) + 1;
  const r = { from: addDays(cur.from, -n), to: addDays(cur.from, -1) };
  return { ...r, label: `${fmtDateLong(r.from)} – ${fmtDateLong(r.to)}`, note: `previous ${n} days` };
}

function comparisonCoverage(prev) {
  const first = firstTradingDate();
  if (!first || prev.to < first) return 'none';
  if (prev.from < first) return 'partial';
  return 'full';
}

function signedMoney(d) { return (d >= 0 ? '+' : '−') + fmt(Math.abs(d)); }
function salesDelta(cur, prev, coverage) {
  if (coverage === 'none') return { text: 'No earlier sales to compare', tone: '', na: true };
  if (Math.abs(prev) < 0.005 && Math.abs(cur) < 0.005) return { text: 'No sales in either period', tone: '', na: true };
  if (Math.abs(prev) < 0.005) return { text: `First sales · ${signedMoney(cur)} vs £0`, tone: 'pos' };
  const d = cur - prev, pct = d / Math.abs(prev);
  return { text: `${signedMoney(d)} (${d >= 0 ? '+' : '−'}${Math.abs(pct * 100).toFixed(0)}%) vs ${fmt(prev)}`, tone: d > 0.005 ? 'pos' : d < -0.005 ? 'neg' : '' };
}
function profitDelta(cur, prev, coverage, curConf, prevConf) {
  if (curConf === 'incomplete' || prevConf === 'incomplete') return { text: 'Comparison unavailable — product costs missing', tone: '', na: true };
  if (coverage === 'none') return { text: 'No earlier trading to compare', tone: '', na: true };
  const d = cur - prev;
  if (prev < 0 && cur > 0) return { text: `Back in profit · ${fmt(d)} better than ${fmt(prev)}`, tone: 'pos' };
  if (Math.abs(d) < 0.005) return { text: `Same as ${fmt(prev)}`, tone: '' };
  return { text: `${fmt(Math.abs(d))} ${d > 0 ? 'better' : 'lower'} than ${fmt(prev)}`, tone: d > 0 ? 'pos' : 'neg' };
}
function ordersDelta(cur, prev, coverage) {
  if (coverage === 'none') return { text: 'No earlier orders to compare', tone: '', na: true };
  const d = cur - prev;
  if (prev === 0 && cur > 0) return { text: `First paid orders · +${cur} vs 0`, tone: 'pos' };
  if (d === 0) return { text: `Same as before (${prev})`, tone: '' };
  return { text: `${d > 0 ? '+' : '−'}${Math.abs(d)} order${Math.abs(d) !== 1 ? 's' : ''} vs ${prev}`, tone: d > 0 ? 'pos' : 'neg' };
}

function compareReports(p = reportPeriod, today = londonToday()) {
  const cur = periodRange(p, today);
  const prevR = comparisonRange(cur, today);
  const coverage = comparisonCoverage(prevR);
  const a = computeReport(cur, today), b = computeReport(prevR, today);
  return { cur, prevRange: prevR, coverage, a, b,
    sales: salesDelta(a.salesAfterRefunds, b.salesAfterRefunds, coverage),
    profit: profitDelta(a.operatingProfit, b.operatingProfit, coverage, a.confidence.status, b.confidence.status),
    orders: ordersDelta(a.paidOrders, b.paidOrders, coverage) };
}

// ── Monthly series (zero months included, years kept separate) ──
function monthlySeries(today = londonToday(), maxMonths = 12) {
  const first = firstActivityDate();
  const t = parseYMD(today);
  let start = addMonths(t.y, t.m, -(maxMonths - 1));
  if (first) { const f = parseYMD(first); if (f.y * 12 + f.m > start.y * 12 + start.m) start = { y: f.y, m: f.m }; }
  const out = [];
  for (let c = start; c.y * 12 + c.m <= t.y * 12 + t.m; c = addMonths(c.y, c.m, 1)) {
    const r = computeReport({ from: monthStart(c.y, c.m), to: monthEnd(c.y, c.m) }, today);
    out.push({ y: c.y, m: c.m, label: `${MONTHS_SHORT[c.m - 1]} ${String(c.y).slice(-2)}`, sales: r2(r.salesAfterRefunds),
               profit: r2(r.operatingProfit), incomplete: r.confidence.status === 'incomplete', complete: !(c.y === t.y && c.m === t.m) });
  }
  return out;
}

// ═══════════════════════════════════════════════════
// MILESTONES — automatic historical wins only, recognised from past records
// ═══════════════════════════════════════════════════
function computeMilestones(today = londonToday()) {
  const idx = postageIndex();
  const out = [];
  // paid orders (positive-value sales not fully refunded), in date order
  const paid = state.orders.map(o => ({ o, c: calcOrder(o, idx) })).filter(x => isValidYMD(x.o.date) && x.o.date <= today && isPaidOrder(x.o, x.c, today))
    .sort((x, y) => (x.o.date < y.o.date ? -1 : x.o.date > y.o.date ? 1 : x.o.id - y.o.id));
  [1, 10, 25, 50, 100].forEach(n => {
    if (paid.length >= n) out.push({ id: `orders-${n}`, kind: 'orders', title: n === 1 ? 'First paid order' : `${n} paid orders`, achievedOn: paid[n - 1].o.date,
      chip: n === 1 ? { label: 'First order', value: fmtDate(paid[0].o.date) } : { label: 'Milestone', value: `${n} orders` },
      short: n === 1 ? `First paid order · ${fmtDate(paid[0].o.date)}` : `${n} paid orders · ${fmtDate(paid[n - 1].o.date)}`,
      detail: n === 1 ? `${paid[0].o.orderNum || 'First order'} · ${fmtDateLong(paid[0].o.date)}` : `Reached on ${fmtDateLong(paid[n - 1].o.date)}`, status: 'met' });
  });
  // cumulative sales after refunds
  const events = [];
  state.orders.forEach(o => {
    const c = calcOrder(o, idx);
    if (c.type === 'sale' && c.revenue > 0 && isValidYMD(o.date) && o.date <= today) events.push({ d: o.date, v: c.revenue });
    refundsOf(o, c).forEach(r => { if (isValidYMD(r.date) && r.date <= today && isValidYMD(o.date)) events.push({ d: o.date, v: -num(r.amount) }); });   // refunds count against the order's month
  });
  events.sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : a.v - b.v));
  const total = events.reduce((a, e) => a + e.v, 0);
  [1000, 2500, 5000].forEach(th => {
    let run = 0, hit = null;
    for (const e of events) { run += e.v; if (run >= th - 0.005 && !hit) hit = e.d; }
    if (hit) out.push({ id: `sales-${th}`, kind: 'sales', title: `${fmt(th, 0)} in sales after refunds`, achievedOn: hit, short: `${fmt(th, 0)} total sales · ${fmtDate(hit)}`, chip: { label: 'Total sales', value: `${fmt(th, 0)}+` },
      detail: total >= th - 0.005 ? `First reached ${fmtDateLong(hit)}` : `Reached ${fmtDateLong(hit)}, now ${fmt(total)} after later refunds`,
      status: total >= th - 0.005 ? 'met' : 'no-longer' });
  });
  // completed months
  const t = parseYMD(today);
  const firstTrade = firstTradingDate();
  if (firstTrade) {
    const f = parseYMD(firstTrade);
    const months = [];
    for (let c = { y: f.y, m: f.m }; c.y * 12 + c.m < t.y * 12 + t.m; c = addMonths(c.y, c.m, 1)) {
      const r = computeReport({ from: monthStart(c.y, c.m), to: monthEnd(c.y, c.m) }, today);
      months.push({ ...c, sales: r2(r.salesAfterRefunds), profit: r.operatingProfit, incomplete: r.confidence.status === 'incomplete' });
    }
    // Only awarded if every earlier completed month has complete costs — otherwise we can't know it was the first.
    let prof = null;
    for (const m of months) { if (m.incomplete) break; if (m.profit > 0.005) { prof = m; break; } }
    if (prof) out.push({ id: `first-profit-${prof.y}-${prof.m}`, kind: 'profit', title: 'First profitable month',
      chip: { label: 'First profit', value: MONTHS_SHORT[prof.m - 1] },
      short: `First profitable month · ${MONTHS_SHORT[prof.m - 1]} · ${fmt(prof.profit)} profit`, achievedOn: addDays(monthEnd(prof.y, prof.m), 1), detail: `${MONTHS_LONG[prof.m - 1]} ${prof.y}: net profit ${fmt(prof.profit)}`, status: 'met' });
    if (months.length >= 3) {
      const best = Math.max(...months.map(m => m.sales));
      const tied = months.filter(m => Math.abs(m.sales - best) < 0.005);
      const latest = tied[tied.length - 1];
      if (best > 0) out.push({ id: `best-month-${latest.y}-${String(latest.m).padStart(2, '0')}`, kind: 'best', title: tied.length > 1 ? 'Joint best sales month' : 'Best sales month so far',
        chip: { label: tied.length > 1 ? 'Joint best month' : 'Best month', value: fmt(best) },
        short: `${tied.length > 1 ? 'Joint best' : 'Best'} sales month · ${MONTHS_SHORT[latest.m - 1]} · ${fmt(best)}`,
        achievedOn: addDays(monthEnd(latest.y, latest.m), 1),
        detail: `${MONTHS_LONG[latest.m - 1]} ${latest.y}: ${fmt(best)} sales after refunds${tied.length > 1 ? ` (level with ${tied.slice(0, -1).map(m => `${MONTHS_SHORT[m.m - 1]} ${m.y}`).join(', ')})` : ''}. Sales only — not a profit record.`,
        status: 'met' });
    }
  }
  return out.sort((a, b) => (a.achievedOn < b.achievedOn ? -1 : a.achievedOn > b.achievedOn ? 1 : 0));
}

// On first use of this version, every win already achieved is stored as acknowledged, so
// upgrading never replays the history as "new". One settings row, merged on write.
async function ensureMilestoneBaseline() {
  if (milestoneState && milestoneState.baselineAt) return;
  const items = {};
  computeMilestones().forEach(m => { items[m.id] = { achievedOn: m.achievedOn, ackAt: new Date().toISOString(), baseline: true }; });
  const value = { baselineAt: londonToday(), items };
  const { error } = await saveSettingsRow('milestones', value);
  if (!error) milestoneState = value;
}
function milestoneView() {
  const list = computeMilestones();
  const items = milestoneState?.items || {};
  const enriched = list.map(m => ({ ...m, ack: !!items[m.id]?.ackAt, isNew: !!milestoneState?.baselineAt && !items[m.id] }));
  const known = new Set(list.map(m => m.id));
  const past = Object.entries(items).filter(([id]) => !known.has(id)).map(([id, v]) => ({ id, title: milestoneTitleFromId(id), achievedOn: v.achievedOn, status: 'superseded', ack: true }));
  const fresh = enriched.filter(m => m.isNew && m.status === 'met').sort((a, b) => (a.achievedOn < b.achievedOn ? 1 : -1));
  return { all: [...enriched, ...past].sort((a, b) => (a.achievedOn < b.achievedOn ? 1 : -1)), fresh };
}
function milestoneTitleFromId(id) {
  if (id.startsWith('best-month-')) { const [, , y, m] = id.split('-'); return `Best sales month (${MONTHS_SHORT[parseInt(m, 10) - 1]} ${y}) — since beaten`; }
  if (id.startsWith('first-profit-')) return 'First profitable month (no longer applies after corrections)';
  return id;
}
async function acknowledgeMilestone(id, achievedOn, opts = {}) {
  // re-read and merge so another device's acknowledgements are never lost
  const { data, error: readErr } = await sb.from('settings').select('*').eq('key', 'milestones').maybeSingle();
  if (readErr) { toast('Could not save — the win will show again next time.'); return; }
  const cur = (data && data.value) || milestoneState || { baselineAt: londonToday(), items: {} };
  cur.items = { ...(cur.items || {}), [id]: { achievedOn, ackAt: new Date().toISOString() } };
  const { error } = await saveSettingsRow('milestones', cur);
  if (error) { toast('Could not save — the win will show again next time.'); return; }
  milestoneState = cur;
  renderView(currentView);
}

// ═══════════════════════════════════════════════════
// INSIGHTS — at most three, from actual records only
// ═══════════════════════════════════════════════════
function computeInsights(cmp) {
  const { a, b, coverage } = cmp;
  const out = [];
  const est = a.confidence.status !== 'ready' ? ' (estimated)' : '';
  // cash fell while profit was positive, explained by stock purchases
  if (a.cashMovement < -0.005 && a.operatingProfit > 0.005 && a.stockPurchases > a.operatingProfit && a.confidence.status !== 'incomplete') {
    out.push({ text: `Cash fell by about ${fmt(-a.cashMovement)} while net profit was ${fmt(a.operatingProfit)}: ${fmt(a.stockPurchases)} went on stock, which is held as stock rather than charged to profit.`,
      short: `Cash fell ${fmt(-a.cashMovement)} despite ${fmt(a.operatingProfit)} profit — ${fmt(a.stockPurchases)} went on stock.`, link: ['reports', 'cash'] });
  }
  // sales change driven by order count vs average order value
  if (coverage === 'full' && a.paidOrders >= 3 && b.paidOrders >= 3 && Math.abs(a.salesAfterRefunds - b.salesAfterRefunds) > 0.005) {
    const volume = (a.paidOrders - b.paidOrders) * b.avgOrder;
    const value = (a.avgOrder - b.avgOrder) * a.paidOrders;
    const driver = Math.abs(volume) >= Math.abs(value) ? (a.paidOrders > b.paidOrders ? 'more orders' : 'fewer orders') : (a.avgOrder > b.avgOrder ? 'a higher average order' : 'a lower average order');
    out.push({ text: `Sales ${a.salesAfterRefunds > b.salesAfterRefunds ? 'rose' : 'fell'} mainly from ${driver}: ${a.paidOrders} orders averaging ${fmt(a.avgOrder)}, against ${b.paidOrders} averaging ${fmt(b.avgOrder)}.`,
      short: Math.abs(volume) >= Math.abs(value) ? `Sales ${a.salesAfterRefunds > b.salesAfterRefunds ? 'rose' : 'fell'} mainly from ${driver}: ${a.paidOrders} vs ${b.paidOrders}.` : `Sales ${a.salesAfterRefunds > b.salesAfterRefunds ? 'rose' : 'fell'} mainly from ${driver} (${fmt(a.avgOrder)} vs ${fmt(b.avgOrder)}).`, link: ['reports', 'orders'] });
  }
  // channel contribution per order
  const sh = a.byChannel.shopify, fo = a.byChannel.fold;
  if (sh.n >= 3 && fo.n >= 2 && a.confidence.status !== 'incomplete') {
    out.push({ text: `Contribution per order${est}: Shopify ${fmt(sh.contribution / sh.n)} (${sh.n} orders), Fold ${fmt(fo.contribution / fo.n)} (${fo.n}).`,
      short: `Contribution per order${est}: Shopify ${fmt(sh.contribution / sh.n)}, Fold ${fmt(fo.contribution / fo.n)}.`, link: ['reports', 'orders'] });
  }
  // postage per shipped order, actual where matched
  const shipped = a.matchedOrders + a.unmatchedOrders, shippedB = b.matchedOrders + b.unmatchedOrders;
  if (shipped >= 3 && shippedB >= 3 && coverage === 'full') {
    const pa = a.postageOrders / shipped, pb = b.postageOrders / shippedB;
    if (Math.abs(pa - pb) >= 0.1) out.push({ text: `Postage per shipped order ${fmt(pa)} vs ${fmt(pb)}${a.unmatchedOrders ? ' — partly estimated' : ''}.`,
      short: `Postage per shipped order ${fmt(pa)} vs ${fmt(pb)}${a.unmatchedOrders ? ' (partly estimated)' : ''}.`, link: ['expenses', 'postage'] });
  }
  // units by product type (SKU types, not individual designs)
  const skus = Object.entries(a.unitsBySku).filter(([, n]) => n > 0).sort((x, y) => y[1] - x[1]);
  if (skus.length >= 2 && out.length < 3) out.push({ text: `Units sold by product type: ${skus.map(([s, n]) => `${esc(s)} ${n}`).join(' · ')}.`, generic: true, link: ['reports', 'orders'] });
  return out.slice(0, 3);
}

// ── Saving helpers: one submission at a time, errors keep the form open ──
let _busy = false;
async function runSave(btn, fn) {
  if (_busy) return;
  _busy = true;
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  showModalError('');
  try { await fn(); }
  catch (e) {
    const m = (e && e.message) || 'Save failed';
    // something missing from the form is not a failure — say what's needed and keep the button as it was
    const input = (e && e.inputField) || /^(enter|choose|fill in|select) /i.test(m);
    if (!input) console.warn('Save failed:', m);
    if (document.getElementById('modal-overlay').classList.contains('open')) showModalError(m, { input, field: e && e.inputField });
    else toast((input ? '' : 'Not saved — ') + m);
    if (btn && !input) btn.textContent = 'Retry';
  }
  finally { _busy = false; if (btn && btn.isConnected) { btn.disabled = false; if (btn.textContent === 'Saving…') btn.textContent = label; }
    if (pendingRemoteChange && !document.getElementById('modal-overlay').classList.contains('open')) handleRemoteChange(); }
}
function showModalError(msg, { input = false, field = null } = {}) {
  const el = document.getElementById('modal-error');
  if (!el) return;
  document.querySelectorAll('#modal-body .field-invalid').forEach(f => { f.classList.remove('field-invalid'); f.removeAttribute('aria-invalid'); });
  el.classList.toggle('hint', !!(msg && input));
  el.textContent = !msg ? '' : input ? msg.charAt(0).toUpperCase() + msg.slice(1) + '.' : `Not saved — ${msg}. Your entries are still here; press Retry.`;
  el.classList.toggle('show', !!msg);
  const f = field && document.getElementById(field);
  if (f) { f.classList.add('field-invalid'); f.setAttribute('aria-invalid', 'true'); f.focus(); f.scrollIntoView({ block: 'center' }); }
}
// a missing or invalid entry in a form (shown as guidance, focuses the field)
function needInput(message, fieldId) { const e = new Error(message); e.inputField = fieldId; return e; }
function failIf(res) { if (res && res.error) { setSyncStatus('error', 'Save failed'); throw new Error(res.error.message || 'database error'); } setSyncStatus('synced', 'Saved'); return res; }
function openFormModal(title, bodyHTML, footerHTML) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  document.getElementById('modal-footer').innerHTML = footerHTML;
  showModalError('');
  openModal();
  // Desktop: focus the first field. Phones: focus the sheet itself, so no keyboard or date picker opens until a field is tapped.
  setTimeout(() => { const m = document.getElementById('modal'); if (m.contains(document.activeElement)) return;
    if (isPhone()) m.focus({ preventScroll: true }); else document.querySelector('#modal-body input, #modal-body select')?.focus(); }, 30);
}

function drawTrend(today) {
  const phone = isPhone();
  const series = monthlySeries(today, phone ? 6 : 12);
  window.__trend = series;
  if (typeof Chart === 'undefined') return;
  if (trendChart) trendChart.destroy();
  const ctx = document.getElementById('trend-chart');
  if (!ctx) return;
  const money = v => `${v < 0 ? '−' : ''}£${Math.abs(v) >= 1000 ? `${(Math.abs(v) / 1000).toFixed(v % 1000 === 0 ? 0 : 1)}k` : Math.abs(v)}`;
  // Even steps sized to the data, so a small loss in one month doesn't add a whole empty band under £0.
  const vals = series.flatMap(x => [x.sales, x.incomplete ? 0 : x.profit]);
  const hi = Math.max(0, ...vals), lo = Math.min(0, ...vals);
  const rawStep = Math.max(hi, -lo, 1) / 5, mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(k => k >= rawStep) || 10 * mag;
  const yMax = Math.max(step, Math.ceil(hi / step) * step);
  const yMin = lo >= 0 ? 0 : -lo <= step * 0.25 ? -step * 0.25 : -Math.ceil(-lo / step) * step;    // a tiny loss gets a sliver, not a full step
  const tickValues = []; for (let v = Math.ceil(yMin / step) * step; v <= yMax + 1e-9; v += step) tickValues.push({ value: Math.round(v * 100) / 100 });
  // the current, incomplete month: two-line label and a lighter bar — no explanation needed
  const labels = series.map((s, i) => {
    const yr = (i === 0 || s.m === 1) && series.some(x => x.y !== s.y) ? ` ${String(s.y).slice(-2)}` : '';
    return s.complete ? `${MONTHS_SHORT[s.m - 1]}${yr}` : [`${MONTHS_SHORT[s.m - 1]}${yr}`, 'so far'];
  });
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  trendChart = new Chart(ctx.getContext('2d'), {
    data: {
      labels,
      datasets: [
        { type: 'bar', label: 'Sales', data: series.map(s => s.sales), order: 2, borderRadius: 6, maxBarThickness: 46,
          backgroundColor: series.map(s => (s.complete ? '#C4A88A' : 'rgba(196,168,138,.45)')),
          borderColor: series.map(s => (s.complete ? '#C4A88A' : '#A88C6E')), borderWidth: series.map(s => (s.complete ? 0 : 1.5)), borderDash: [4, 3] },
        { type: 'line', label: 'Profit', data: series.map(s => (s.incomplete ? null : s.profit)), order: 1, borderColor: '#2F6248', backgroundColor: '#2F6248',
          borderWidth: 3, pointRadius: 4.5, pointHoverRadius: 6, spanGaps: false, tension: .25,
          segment: { borderDash: c => (series[c.p1DataIndex] && !series[c.p1DataIndex].complete ? [6, 4] : undefined) } },
      ],
    },
    options: {
      maintainAspectRatio: false, responsive: true,
      animation: reduce ? false : { duration: 400 },
      interaction: { mode: 'index', intersect: false },
      events: ['click', 'touchstart', 'mousemove', 'mouseout'],
      plugins: {
        legend: { display: true, position: 'top', align: 'start', labels: { sort: (a, b) => a.datasetIndex - b.datasetIndex, font: { family: 'Sono, monospace', size: 14 }, boxWidth: 14, boxHeight: 14, padding: 14 } },
        tooltip: { itemSort: (a, b) => a.datasetIndex - b.datasetIndex, titleFont: { family: 'Sono, monospace', size: 14 }, bodyFont: { family: 'Sono, monospace', size: 14 }, padding: 10,
          callbacks: { title: items => { const s = series[items[0].dataIndex]; return `${MONTHS_SHORT[s.m - 1]} ${s.y}${s.complete ? '' : ' (so far)'}`; },
                       label: c => {
                         if (c.raw == null) return `${c.dataset.label}: costs incomplete`;
                         const s = series[c.dataIndex];
                         // profit also as a % of that month's sales
                         return c.datasetIndex === 1 && Math.abs(s.sales) > 0.005 ? `${c.dataset.label}: ${fmt(c.raw)} (${fmtPct(c.raw / s.sales)})` : `${c.dataset.label}: ${fmt(c.raw)}`;
                       } } } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { family: 'Sono, monospace', size: 14 }, color: '#4A4540', maxRotation: 0, autoSkip: false } },
        y: { grid: { color: '#EEE8DF' }, border: { display: false }, min: yMin, max: yMax, ticks: { font: { family: 'Sono, monospace', size: 13 }, color: '#6B655E', stepSize: step, callback: money }, afterBuildTicks: axis => { axis.ticks = tickValues; } },
      },
    },
  });
}

async function saveBankBalance() {

let orderSearch = '';
let orderFilter = 'all';     // all | review | missing | refunds | gifts | zero
const openOrders = new Set();
let editingOrderId = null;

function orderNet(o, c) { return c.revenue - refundTotal(o, c); }
function orderChips(o, c) {
  const chips = [];
  if (c.type !== 'sale') chips.push(`<span class="status-chip">${ORDER_TYPES[c.type]}</span>`);
  if (c.costMissing) chips.push(`<span class="status-chip err">Cost missing</span>`);
  const refs = refundsOf(o, c);
  if (refs.some(r => r.legacy)) chips.push(`<span class="status-chip warn">Refund — add details</span>`);
  else if (refs.length) chips.push(`<span class="status-chip">${fullyRefunded(o, c) ? 'Refunded' : 'Part refunded'}</span>`);
  return chips.join('');
}
function orderMatches(o, c, q) {
  if (q && !((o.customer || '').toLowerCase().includes(q) || (o.orderNum || '').toLowerCase().includes(q) || orderLines(o).some(l => l.sku.toLowerCase().includes(q)))) return false;
  const refs = refundsOf(o, c);
  switch (orderFilter) {
    case 'missing': return c.costMissing;
    case 'refunds': return refs.length > 0;
    case 'gifts': return c.type !== 'sale';
    case 'zero': return c.type === 'sale' && !(c.revenue > 0) && !o.orderType;
    case 'review': return c.costMissing || refs.some(r => r.legacy) || (c.type === 'sale' && !(c.revenue > 0) && !o.orderType);
    default: return true;
  }
}

// Only the list re-renders while typing, so the search box keeps focus and cursor position.
function updateOrderList() {
  const list = document.getElementById('order-list');
  if (!list) return;
  const idx = postageIndex();
  const q = orderSearch.trim().toLowerCase();
  const rows = state.orders.map(o => ({ o, c: calcOrder(o, idx) })).filter(x => orderMatches(x.o, x.c, q))
    .sort((a, b) => (a.o.date < b.o.date ? 1 : a.o.date > b.o.date ? -1 : b.o.id - a.o.id));
  document.getElementById('order-count').textContent = `${rows.length} order${rows.length !== 1 ? 's' : ''}`;
  list.innerHTML = rows.length ? rows.map(({ o, c }) => orderRowHTML(o, c)).join('')

      <div><span>Platform fee</span>${fmt(c.fee)}${c.fold ? `<br><span class="form-hint" style="font-size:13px">Commission ${fmt(c.fold.commission)}${c.fold.delivery ? ` (excl. ${fmt(c.fold.delivery)} delivery)` : ''} + card fee ${fmt(c.fold.cardFee)} (${pct1(c.fold.cardRate, 2)})</span>` : ''}</div>
      <div><span>${c.type === 'sale' ? 'Profit on this order' : 'Cost of this ' + ORDER_TYPES[c.type].toLowerCase()}</span>${c.costMissing ? 'incomplete' : fmt(c.type === 'sale' ? c.contribution : c.productCost + c.postage)}</div>

// When the payout reached (or should reach) the bank: a date from a statement, or the payout-delay estimate.
function payoutStatus(o, c, today = londonToday()) {
  if (o.payoutDate) return o.payoutDate <= today ? `paid ${fmtDay(o.payoutDate)} (statement)` : `due ${fmtDay(o.payoutDate)} (statement)`;
  const lag = c.channel === 'fold' ? lagDays(state.settings.foldPayoutLagDays, 14) : lagDays(state.settings.platformPayoutLagDays, 7);
  const due = addDays(o.date, lag + 1);       // counted as received from the day after the delay ends (see cashAt)
  return due <= today ? 'counted as received' : `expected about ${fmtDay(due)}`;
}

function validateOrderForm(f, prev = null) {

  if (refunded > 0 && f.orderType) throw new Error('this order has refunds recorded — remove them before changing it to a gift, sample or cancelled');
  if (refunded > f.revenue + 0.005) throw new Error(`the sale value can't be less than the ${fmt(refunded)} already refunded`);

// Re-reads the order before a change to refunds or locked costs, so another device's edits are never overwritten.
async function freshOrderRow(id) {
  const { data, error } = await sb.from('orders').select('*').eq('id', id).maybeSingle();
  if (error) throw new Error(error.message || 'could not re-read the order');
  if (!data) throw new Error('this order no longer exists (deleted on another device?)');
  return rowToOrder(data);
}
function sameJSON(a, b) { return JSON.stringify(a ?? null) === JSON.stringify(b ?? null); }
async function saveOrder() {
  if (writesBlocked()) throw new Error('data not loaded');
  const f = readOrderForm(); validateOrderForm(f);
  const o = { ...f, refunded: false, refunds: [] };
  o.costSnapshot = schema.costSnapshot ? buildSnapshot(o, 'recorded') : null;
  const res = failIf(await insertRecord('orders', { ...orderBaseRow(o), refunded: false, ...orderOptionalRow(o, ['cost_snapshot', 'order_type']) }));
  state.orders.push(rowToOrder({ ...res.data, cost_snapshot: res.data.cost_snapshot ?? o.costSnapshot, order_type: res.data.order_type ?? o.orderType }));
  closeModal(); toast('Order added.'); renderView(currentView);
}
async function updateOrder(id) {
  if (writesBlocked()) throw new Error('data not loaded');
  const prev = state.orders.find(x => x.id === id);
  if (!prev) throw new Error('order not found');
  const f = readOrderForm(); validateOrderForm(f, prev);
  const fresh = await freshOrderRow(id);
  if (!sameJSON(fresh.costSnapshot, prev.costSnapshot) || !sameJSON(fresh.refunds, prev.refunds)) {
    Object.assign(prev, { costSnapshot: fresh.costSnapshot, refunds: fresh.refunds, refunded: fresh.refunded });
    throw new Error('costs or refunds on this order were changed on another device — check the latest values, then save again');
  }
  const next = { ...prev, ...f };
  next.costSnapshot = prev.costSnapshot ? snapshotAfterEdit(prev, next) : null;
  failIf(await updateRecord('orders', id, { ...orderBaseRow(next), ...orderOptionalRow(next, ['cost_snapshot', 'order_type']) }));
  Object.assign(prev, next);
  closeModal(); toast('Order updated.'); renderView(currentView);
}
async function deleteOrder(id) {

  if (res.error) { toast('Delete FAILED — ' + res.error.message); return; }
  state.orders = state.orders.filter(o => o.id !== id);

}

function openRefund(id) {
  const o = state.orders.find(x => x.id === id); if (!o) return;
  const c = calcOrder(o);
  const existing = (o.refunds || []).reduce((a, r) => a + num(r.amount), 0);
  const remaining = Math.max(0, c.revenue - existing);
  const today = londonToday();
  openFormModal(`Record refund — ${o.orderNum || 'order'}`, `
    ${o.refunded && !(o.refunds || []).length ? `<div class="notice warn" style="margin-bottom:12px">This order was marked refunded without details. Recording the details replaces the legacy treatment.</div>` : ''}
    <div class="form-grid">
      <div class="form-group"><label for="rf-amt">Refund amount (£)</label><input type="number" id="rf-amt" step="0.01" min="0" value="${remaining.toFixed(2)}"></div>
      <div class="form-group"><label for="rf-date">Refund date</label><input type="date" id="rf-date" value="${today}"></div>
      <div class="form-group full"><label class="checkbox-row" style="text-transform:none;letter-spacing:0"><input type="checkbox" id="rf-paid" checked onchange="document.getElementById('rf-paid-row').style.display=this.checked?'':'none'"> Refund has been paid to the customer</label></div>
      <div class="form-group" id="rf-paid-row"><label for="rf-paid-date">Date paid</label><input type="date" id="rf-paid-date" value="${today}"></div>
      <div class="form-group full"><label for="rf-resale">Did the scarf come back?</label><select id="rf-resale" onchange="refundReturnChanged(this.value)">
        <option value="">No / not known</option><option value="yes">Yes, and it can be resold</option><option value="no">Yes, but it can't be resold</option></select></div>
      <div class="form-group full" id="rf-ret-row" style="display:none"><label>How many came back</label>${c.lines.map(l => { const prior = (o.refunds || []).filter(r => r.resaleable === true).reduce((a, r) => a + (r.returned || []).filter(x => x.sku === l.sku).reduce((b, x) => b + num(x.qty), 0), 0);
        const left = Math.max(0, l.qty - prior); return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px"><span style="flex:1">${esc(l.sku)}</span>
        <input type="number" class="rf-ret" data-sku="${esc(l.sku)}" aria-label="Returned ${esc(l.sku)}" min="0" max="${left}" value="0" style="width:70px"> of ${left}${prior ? ` (${prior} already returned)` : ''}</div>`; }).join('')}</div>
      <div class="form-group"><label for="rf-fee">Platform fee kept by the platform (£)</label><input type="number" id="rf-fee" step="0.01" min="0" value="${(c.fee * (remaining / (c.revenue || 1))).toFixed(2)}"></div>
      <div class="form-group"><label for="rf-post">Return postage you paid (£)</label><input type="number" id="rf-post" step="0.01" min="0" value="0"></div>
      <div class="form-group full"><label for="rf-note">Note</label><input type="text" id="rf-note"></div>
    </div>
    <p class="form-hint">The refund comes off sales in the month the order was placed; the refund date is used for cash. Leave return postage at £0 if you log the return label as a Shipping &amp; Postage expense and match it to this order.</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="runSave(this, () => saveRefund(${id}))">Save refund</button>`);
}
// Returned quantities appear only when a scarf came back, pre-filled with everything that can still be returned.
function refundReturnChanged(v) {
  const row = document.getElementById('rf-ret-row'); if (!row) return;
  row.style.display = v ? '' : 'none';
  const inputs = Array.from(document.querySelectorAll('.rf-ret'));
  if (!v) inputs.forEach(i => { i.value = 0; });
  else if (!inputs.some(i => parseInt(i.value) > 0)) inputs.forEach(i => { i.value = i.max; });
}
async function saveRefund(id) {
  if (writesBlocked()) throw new Error('data not loaded');
  const o = state.orders.find(x => x.id === id); if (!o) throw new Error('order not found');
  const c = calcOrder(o);
  const amount = parseFloat(document.getElementById('rf-amt').value);
  const date = document.getElementById('rf-date').value;
  if (!(amount > 0)) throw new Error('enter a refund amount');
  if (!isValidYMD(date)) throw new Error('enter the refund date');
  const fresh = await freshOrderRow(id);
  o.refunds = fresh.refunds; o.refunded = fresh.refunded;
  const already = (o.refunds || []).reduce((a, r) => a + num(r.amount), 0);
  if (already + amount > c.revenue + 0.005) throw new Error(`refunds would exceed the sale value (${fmt(c.revenue)})`);
  const paid = document.getElementById('rf-paid').checked;
  const paidDate = document.getElementById('rf-paid-date').value;
  if (paid && !isValidYMD(paidDate)) throw new Error('enter the date the refund was paid');
  const resale = document.getElementById('rf-resale').value;
  const returned = resale ? Array.from(document.querySelectorAll('.rf-ret')).map(i => ({ sku: i.dataset.sku, qty: parseInt(i.value) || 0 })).filter(x => x.qty > 0) : [];
  if (resale && !returned.length) throw needInput('Enter how many scarves came back, or choose "No / not known".', 'rf-resale');
  const refund = { id: newUid(), amount: r2(amount), date, paid_date: paid ? paidDate : null, returned,
    resaleable: resale === 'yes' ? true : resale === 'no' ? false : null,
    fees_retained: r2(num(document.getElementById('rf-fee').value)), return_postage: r2(num(document.getElementById('rf-post').value)),
    note: document.getElementById('rf-note').value.trim(), recorded_at: new Date().toISOString() };
  const refunds = [...(o.refunds || []), refund];
  const full = refunds.reduce((a, r) => a + num(r.amount), 0) >= c.revenue - 0.005;
  failIf(await updateRecord('orders', id, { refunds, refunded: full }));
  o.refunds = refunds; o.refunded = full;
  closeModal(); toast('Refund recorded.'); renderView(currentView);
}
async function deleteRefund(id, refundId) {
  if (writesBlocked()) return;
  if (!confirm('Remove this refund record?')) return;
  const o = state.orders.find(x => x.id === id); if (!o) return;
  const c = calcOrder(o);
  let fresh; try { fresh = await freshOrderRow(id); } catch (e) { toast('Not saved — ' + e.message); return; }
  const refunds = (fresh.refunds || []).filter(r => r.id !== refundId);
  const full = refunds.reduce((a, r) => a + num(r.amount), 0) >= c.revenue - 0.005 && refunds.length > 0;
  const res = await updateRecord('orders', id, { refunds, refunded: full });
  if (res.error) { toast('Not saved — ' + res.error.message); return; }
  o.refunds = refunds; o.refunded = full; renderView(currentView);
}

async function saveCostCorrection(id) {
  if (writesBlocked()) throw new Error('data not loaded');

  after.lines = Array.from(document.querySelectorAll('.cc-unit')).map(i => ({ sku: i.dataset.sku, unit_cost: i.value === '' ? null : r2(num(i.value)) }));
  after.shipping = { method: o.shippingMethod || null, estimate: r2(num(document.getElementById('cc-ship').value)) };
  after.fees = { shopify_rate: num(document.getElementById('cc-rate').value), shopify_fixed: r2(num(document.getElementById('cc-fixed').value)) };
  after.basis = document.getElementById('cc-basis').value;
  after.corrections = [...(before.corrections || []), { on: londonToday(), reason, before: { lines: before.lines, shipping: before.shipping, fees: before.fees, basis: before.basis },
    summary: `${snapshotSummary(before)} → ${snapshotSummary(after)}` }];
  failIf(await updateRecord('orders', id, { cost_snapshot: after }));
  o.costSnapshot = after;
  closeModal(); toast('Cost correction saved.'); renderView(currentView);
}

// ── Review & lock: older and synced orders get costs from the rates on their own order dates ──
// Each is marked "estimated" unless you tick it as confirmed (checked against invoices). Nothing is
// claimed as confirmed automatically, and already-locked orders are never overwritten.
function lockCandidates() { return state.orders.filter(o => !o.costSnapshot && orderType(o) !== 'cancelled' && isValidYMD(o.date)).sort((a, b) => (a.date < b.date ? -1 : 1)); }
function openLockCosts() {
  if (schema.costSnapshot !== true) { toast('Run migration 002 first.'); return; }
  const hits = lockCandidates();
  if (!hits.length) { toast('All orders already have locked costs.'); return; }
  const rows = hits.map(o => { const s = buildSnapshot(o, 'estimated'); const missing = calcOrder(o).costMissing;
    return `<tr><td>${fmtDate(o.date)}</td><td>${esc(o.orderNum)}</td><td>${esc(snapshotSummary(s))}</td>
      <td style="text-align:center"><input type="checkbox" class="lk-conf" data-id="${o.id}" aria-label="Costs confirmed for ${esc(o.orderNum)}" ${missing ? 'disabled title="A product cost is missing"' : ''}></td></tr>`; }).join('');
  openFormModal('Review & lock costs on existing orders', `
    <p style="font-size:13.5px;color:var(--text-2);margin-bottom:10px">${hits.length} order${hits.length > 1 ? 's' : ''} will be locked with the costs <strong>in force on each order's date</strong>. Each is marked <strong>estimated</strong> unless you tick <em>Confirmed</em> because you've checked its costs. Already-locked orders are never overwritten. A backup is downloaded first.</p>
    <label class="checkbox-row" style="text-transform:none;letter-spacing:0;margin-bottom:8px"><input type="checkbox" id="lk-all" onchange="document.querySelectorAll('.lk-conf:not(:disabled)').forEach(c => c.checked = this.checked)"> Tick all as confirmed</label>
    <div style="max-height:46vh;overflow:auto;border:1px solid var(--border-light);border-radius:var(--radius)"><table class="mini-table"><thead><tr><th>Date</th><th>Order</th><th>Costs to lock</th><th>Confirmed</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${hits.some(o => calcOrder(o).costMissing) ? `<p class="form-hint neg-text" style="margin-top:8px">Orders with a missing product cost are locked without it and stay flagged — fix them with Correct costs.</p>` : ''}`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="lock-go" onclick="runSave(this, runLockBackup)">Download backup</button>`);
}
async function runLockBackup() {
  const ok = await exportBackup();
  if (!ok) throw new Error('the backup failed, so nothing was locked');
  const n = lockCandidates().length;
  document.getElementById('modal-body').insertAdjacentHTML('beforeend', `<div class="notice warn" style="margin-top:10px">Backup <strong>${esc(lastBackup.file)}</strong> sent to your browser — check it's in your Downloads before continuing.</div>`);
  document.getElementById('modal-footer').innerHTML = `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" id="lock-confirm" onclick="runSave(this, lockEstimatedCosts)">Backup saved — lock ${n} order${n !== 1 ? 's' : ''}</button>`;
}
// Automatic locking: orders that arrive without saved costs (e.g. from the Shopify sync) get the Settings
// costs for their own date as soon as the app has loaded them. Already-locked orders are never touched
// (the update only applies while cost_snapshot is still empty), and an order with a missing product cost
// is left alone so it stays flagged. Figures don't change: the locked values are the ones already in use.
let autoLocking = false;
async function autoLockCosts() {
  if (autoLocking || loadError || !autoLockOn() || schema.costSnapshot !== true) return 0;
  const hits = lockCandidates().filter(o => !calcOrder(o).costMissing);
  if (!hits.length) return 0;
  autoLocking = true; suppressRealtime++;
  let done = 0;
  try {
    for (const o of hits) {
      const snap = buildSnapshot(o, 'auto');
      try {
        const { data, error } = await sb.from('orders').update({ cost_snapshot: snap }).eq('id', o.id).is('cost_snapshot', null).select('id');
        if (error) break;                                   // offline or failing: try again next time the app loads
        if (data && data.length) { const cur = state.orders.find(x => x.id === o.id); if (cur && !cur.costSnapshot) cur.costSnapshot = snap; done++; }
      } catch (e) { break; }
    }
  } finally { suppressRealtime--; autoLocking = false; }
  if (done && !_busy && !document.getElementById('modal-overlay')?.classList.contains('open') && ['orders', 'reports'].includes(currentView)
      && !['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) renderView(currentView);
  return done;
}
async function lockEstimatedCosts() {
  if (writesBlocked()) throw new Error('data not loaded');
  const confirmed = new Set(Array.from(document.querySelectorAll('.lk-conf:checked')).map(c => parseInt(c.dataset.id, 10)));
  const hits = lockCandidates();
  let done = 0, conf = 0; const failed = [], noChange = [];
  suppressRealtime++;
  try {
    for (const o of hits) {
      const snap = buildSnapshot(o, confirmed.has(o.id) && !calcOrder(o).costMissing ? 'confirmed' : 'estimated');
      const { data, error } = await sb.from('orders').update({ cost_snapshot: snap }).eq('id', o.id).is('cost_snapshot', null).select('id');
      if (error) failed.push(o.orderNum || `#${o.id}`); else if (!data || !data.length) noChange.push(o.id);
      else { o.costSnapshot = snap; done++; if (snap.basis === 'confirmed') conf++; }
    }
  } finally { suppressRealtime--; }
  let skipped = 0;
  try { await loadFromSupabase(); noChange.forEach(id => { if (state.orders.find(x => x.id === id)?.costSnapshot) skipped++; else failed.push(`#${id}`); }); }
  catch (e) { noChange.forEach(id => failed.push(`#${id}`)); }
  const summary = `Locked ${done} order${done !== 1 ? 's' : ''} (${conf} confirmed, ${done - conf} estimated)${skipped ? ` · ${skipped} already locked elsewhere` : ''}`;
  if (failed.length) {
    document.getElementById('modal-title').textContent = 'Locking only partly saved';
    document.getElementById('modal-body').innerHTML = `<div class="notice err" data-testid="lock-partial">${summary}. <strong>${failed.length} NOT saved:</strong> ${failed.map(esc).join(', ')}. They still use the rates for their dates — run Review &amp; lock again to retry them.</div>`;
    document.getElementById('modal-footer').innerHTML = `<button class="btn btn-primary" onclick="closeModal()">Close</button>`;
    renderView(currentView); return;
  }
  closeModal(); renderView(currentView); toast(summary + '.');
}

function categoryTreatmentHint(cat) {

    case 'Sales': return 'Not counted in profit or cash — sales come from Orders. Record a sale as an order instead.';

function editTx(id) {

async function createTx(t) {

  const tx = rowToTx(res.data);

    if (res.error) toast('Not saved — ' + res.error.message); else { toast(`Copied "${o.description}" to today.`); renderView(currentView); }
  } finally { _busy = false; }
}
async function deleteTx(id) {

  if (res.error) { toast('Delete FAILED — ' + res.error.message); return; }
  state.transactions = state.transactions.filter(t => t.id !== id);
  toast('Deleted.'); renderView(currentView);

// ── Postage matching (explicit; never automatic) ───
function openMatchPostage(txId) {
  const t = state.transactions.find(x => x.id === txId); if (!t) return;
  const idx = postageIndex();
  const from = addDays(t.date, -21), to = addDays(t.date, 7);
  const cands = state.orders.filter(o => orderType(o) !== 'cancelled' && isValidYMD(o.date) && o.date >= from && o.date <= to && o.date <= londonToday())
    .sort((a, b) => (a.date < b.date ? 1 : -1));
  openFormModal('Match postage payment', `
    <p style="font-size:13.5px;color:var(--text-2);margin-bottom:10px"><strong>${esc(t.description)}</strong> · ${fmt(t.amount)} paid ${fmtDateLong(t.date)}.
      Tick the order(s) this paid for and enter each one's share. Orders are listed from 3 weeks before to 1 week after the payment — nothing is matched automatically.</p>
    <div style="max-height:44vh;overflow:auto">${cands.map(o => { const c = calcOrder(o, idx);
      return `<label class="checkbox-row" style="text-transform:none;letter-spacing:0;padding:6px 0;border-bottom:1px solid var(--border-light)">
        <input type="checkbox" class="mp-chk" data-id="${o.id}" onchange="mpSum(${t.amount})">
        <span style="flex:1">${fmtDate(o.date)} ${esc(o.orderNum)} ${esc(o.customer)} <span class="muted">· est. ${fmt(c.shipEst)}${c.postageMatched ? ` · already matched ${fmt(c.postageActual)}` : ''}</span></span>
        <input type="number" class="mp-amt" data-id="${o.id}" step="0.01" min="0" value="${c.shipEst.toFixed(2)}" style="width:84px" oninput="mpSum(${t.amount})" aria-label="Amount for ${esc(o.orderNum)}"></label>`; }).join('') || '<p class="form-hint">No orders around this date.</p>'}</div>
    <p id="mp-sum" style="margin-top:10px;font-size:13.5px"></p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="runSave(this, () => savePostageMatch(${txId}))">Save match</button>`);
  mpSum(t.amount);
}
function mpSum(total) {
  let s = 0;
  document.querySelectorAll('.mp-chk').forEach(ch => { if (ch.checked) s += num(document.querySelector(`.mp-amt[data-id="${ch.dataset.id}"]`).value); });
  const el = document.getElementById('mp-sum'); if (!el) return;
  const left = total - s;
  el.innerHTML = `Matched ${fmt(s)} of ${fmt(total)}${Math.abs(left) < 0.005 ? '' : left > 0 ? ` · ${fmt(left)} stays as postage not linked to orders` : ` · <span class="neg-text">${fmt(-left)} more than the payment</span>`}`;
}
async function savePostageMatch(txId) {
  if (writesBlocked()) throw new Error('data not loaded');
  const t = state.transactions.find(x => x.id === txId); if (!t) throw new Error('payment not found');
  const allocations = [];
  document.querySelectorAll('.mp-chk').forEach(ch => { if (ch.checked) allocations.push({ order_id: parseInt(ch.dataset.id, 10), amount: r2(num(document.querySelector(`.mp-amt[data-id="${ch.dataset.id}"]`).value)) }); });
  if (!allocations.length) throw new Error('tick at least one order, or use "Not for an order"');
  const total = allocations.reduce((a, x) => a + x.amount, 0);
  if (total > num(t.amount) + 0.005) throw new Error('the matched amounts are more than the payment');
  const review = { status: 'orders', allocations, reviewed_on: londonToday() };
  failIf(await updateRecord('transactions', txId, { postage_review: review }));
  t.postageReview = review;
  closeModal(); toast('Postage matched.'); renderView(currentView);
}
async function markNonOrderPostage(txId) {
  if (writesBlocked()) throw new Error('data not loaded');
  const t = state.transactions.find(x => x.id === txId); if (!t) return;
  const review = { status: 'non_order', allocations: [], reviewed_on: londonToday() };
  failIf(await updateRecord('transactions', txId, { postage_review: review }));
  t.postageReview = review; toast('Marked as not for a customer order.'); renderView(currentView);
}

function reportPLHTML(p) {
  const inc = p.confidence.status === 'incomplete';

  return `<div class="pl-statement">
    ${plHead('Sales')}
    ${plRow(`Gross sales (${p.paidOrders} paid order${p.paidOrders !== 1 ? 's' : ''})`, p.grossSales, '', true)}
    ${p.refunds ? plRow(`Less refunds on these orders (${p.refundCount})`, -p.refunds, '', true) : ''}
    ${plRow('Sales after refunds', p.salesAfterRefunds, 'total')}

// Shopify · Fold (· Direct only when there are any) — shown in Reports → Orders, not on the home page (too tight on phones)
function channelSplit(rows) {
  const n = { shopify: 0, fold: 0, direct: 0 };
  rows.forEach(({ c }) => { n[c.channel === 'fold' ? 'fold' : c.channel === 'direct' ? 'direct' : 'shopify']++; });
  return `Shopify ${n.shopify} · Fold ${n.fold}${n.direct ? ` · Direct ${n.direct}` : ''}`;
}
function reportOrdersHTML(p) {
  const idx = postageIndex();

  const rows = state.orders.map(o => ({ o, c: calcOrder(o, idx) })).filter(x => inDateRange(x.o.date, p.range))
    .filter(x => reportsOrderFilter === 'paid' ? isPaidOrder(x.o, x.c, today) : reportsOrderFilter === 'refunds' ? refundsOf(x.o, x.c).length : reportsOrderFilter === 'missing' ? x.c.costMissing : true)

      <span class="amt">${fmt(c.revenue)}<div class="sub" style="font-weight:400">${c.costMissing ? 'cost missing' : c.type !== 'sale' ? `cost ${fmt(c.productCost)}` : `profit ${fmt(c.contribution)}`}</div></span>

// SETTINGS — edits live in a draft; reports use saved settings until Save succeeds

let settingsDraftBase = null;   // saved settings the draft started from
function draft() { if (!settingsDraft) { settingsDraft = clone(state.settings); settingsDraftBase = clone(state.settings); } return settingsDraft; }
function isDirty() { return !!settingsDraft && JSON.stringify(settingsDraft) !== JSON.stringify(state.settings); }
function pct1(r, dp = 1) { const v = num(r) * 100; return `${Number(v.toFixed(dp))}%`; }
function foldSettingsHTML(s) {
  const f = { ...DEFAULT_SETTINGS.fold, ...(s.fold || {}) };
  const pin = (id, key, label, max, hint = '') => `<div class="form-group"><label for="${id}">${label}</label><input type="number" id="${id}" min="0" max="${max}" step="0.01" inputmode="decimal" value="${Number((num(f[key]) * 100).toFixed(2))}" oninput="setDraft('fold.${key}', +(Math.max(0, parseFloat(this.value) || 0) / 100).toFixed(6))">${hint ? `<p class="form-hint">${hint}</p>` : ''}</div>`;
  return `<div class="form-group" style="grid-column:1/-1"><label>Fold fees</label><p class="form-hint">How a Fold sale was paid isn't known when it's recorded, so delivered orders are treated as online and Collection orders as in-store. Commission is never charged on delivery. An order with a fixed commission rate keeps it.</p></div>
      ${pin('s-fold-on', 'onlineRate', 'Online commission (%)', 50)}
      ${pin('s-fold-in', 'inStoreRate', 'In-store / event commission (%)', 50)}
      ${pin('s-fold-oncard', 'onlineCardFee', 'Online card fee (%)', 10, 'Charged on everything paid, including delivery.')}
      ${pin('s-fold-incard', 'inStoreCardFee', 'In-store card fee (%)', 10, 'Till 1.6%, SumUp 1.69%.')}
      <div class="form-group"><label for="s-fold-del">Fold delivery charge (£)</label><input type="number" id="s-fold-del" min="0" step="0.01" inputmode="decimal" value="${num(f.deliveryCharge)}" oninput="setDraft('fold.deliveryCharge', Math.max(0, parseFloat(this.value) || 0))"><p class="form-hint">Included in delivered orders' sale value; not commissioned.</p></div>`;
}
function setDraft(path, value) {
  const d = draft(); const keys = path.split('.'); let o = d;
  for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
  o[keys[keys.length - 1]] = value;
  updateSaveBar();
}
function updateSaveBar() {
  const bar = document.getElementById('save-bar'); if (!bar) return;
  const dirty = isDirty();
  bar.style.display = dirty || settingsDraftError ? 'flex' : 'none';
  document.getElementById('save-bar-msg').innerHTML = settingsDraftError
    ? `<strong>Not saved</strong> — ${esc(settingsDraftError)}. Your changes are kept.` : 'Unsaved changes — reports still use your saved settings.';
}

// ═══════════════════════════════════════════════════
// APPLY COST CHANGE — one workflow for dated rates and corrections to saved orders
// ═══════════════════════════════════════════════════
//  A. Forward only (default): the new cost goes into the dated rate history from an effective date.
//     Saved (locked) orders keep their costs.
//  B. Apply to existing orders too: the chosen cost component is updated on matching orders in an
//     order-date range — nothing else on those orders changes — and a correction (previous cost, new
//     cost, dates, reason) is recorded on each. The new default applies from its own effective date.
//  Stock-purchase payments and bank transactions are never touched.

function costChanges(base, next) {
  const out = [];
  const today = londonToday();
  const cmp = (bList, nList, key, kind) => (nList || []).forEach(n => {
    const b = (bList || []).find(x => x.uid && x.uid === n.uid);
    const was = b ? validCost(rateOn(historyOf(b), today)?.cost) : null, now = validCost(n.cost);
    if (b && now !== null && was !== null && Math.abs(now - was) > 1e-9) out.push({ kind, uid: n.uid, label: n[key], was, now });
  });
  cmp(base.skuCosts, next.skuCosts, 'sku', 'sku');
  cmp(base.shippingMethods, next.shippingMethods, 'method', 'ship');
  const bDef = num(rateOn(historyOf({ history: base.defaultShippingHistory, cost: base.defaultShipping }), today)?.cost);
  if (Math.abs(num(next.defaultShipping) - bDef) > 1e-9) out.push({ kind: 'defship', label: 'Default shipping', was: bDef, now: num(next.defaultShipping) });
  const bFee = feesOn(today, base);
  if (Math.abs(num(next.shopifyFeeRate) - bFee.rate) > 1e-9 || Math.abs(num(next.shopifyFixedFee) - bFee.fixed) > 1e-9)
    out.push({ kind: 'fee', label: 'Shopify fee', was: bFee, now: { rate: num(next.shopifyFeeRate), fixed: num(next.shopifyFixedFee) } });

}
// Writes each change into its dated history from ch.eff (or fromDate). Entries on/after that date are replaced.
function applyCostChanges(next, base, changes, fromDate) {
  const today = londonToday();
  changes.forEach(ch => {
    const from = ch.eff || fromDate;
    const meta = { set_on: today, ...(ch.reason ? { reason: ch.reason } : {}), ...(ch.mode === 'existing' ? { applied_to_orders: { from: ch.from, to: ch.to } } : {}) };
    const put = (hist, entry) => sortedHistory([...hist.filter(h => h.from < from), { from, ...entry, ...meta }]);
    if (ch.kind === 'sku' || ch.kind === 'ship') {

      next.defaultShippingHistory = put(historyOf({ history: base.defaultShippingHistory, cost: base.defaultShipping }), { cost: ch.now });
      next.defaultShipping = num(rateOn(next.defaultShippingHistory, today).cost);
    } else {
      const prev = Array.isArray(base.feeHistory) && base.feeHistory.length ? sortedHistory(base.feeHistory) : [{ from: EPOCH, rate: base.shopifyFeeRate, fixed: base.shopifyFixedFee }];
      next.feeHistory = put(prev, { rate: ch.now.rate, fixed: ch.now.fixed });

}
function withSettings(s, fn) { const keep = state.settings; state.settings = s; try { return fn(); } finally { state.settings = keep; } }

// ── Cost components on orders ──
function componentNames(ch, s = state.settings) {

  if (ch.kind === 'ship') return names.includes(postageMethod(o));

}

// Matching saved orders in the chosen range whose cost would actually change (option B).
function existingHits(ch, base = state.settings) {
  const names = componentNames(ch, base);

function costChangeImpact(ch) {

  }

  const to = ch.mode === 'existing' ? (ch.to > today ? today : ch.to) : today;
  const hasPeriod = from <= to;
  const rep = () => { const R = computeReport({ kind: 'custom', from, to, label: '' }, today); return { c: R.contribution, op: R.operatingProfit }; };
  const allOp = () => computeReport(allTimeRange(today), today).operatingProfit;

async function confirmApplyCostChange() {

  job.changes.forEach((ch, i) => { const p = ccProblem(ch); if (p) throw needInput(`${p} (${componentTitle(ch)})`, `cc-eff-${i}`); });
  job.changes.forEach((ch, i) => { if (ch.mode === 'existing' && !ch.reason) throw needInput(`enter a reason for changing existing orders (${componentTitle(ch)})`, `cc-reason-${i}`); });

  job.plans = job.changes.filter(ch => ch.mode === 'existing').map(ch => ({ ch, names: componentNames(ch, job.base), ids: existingHits(ch, job.base).map(t => t.o.id) }));

  const def = job.changes.filter(updatesDefault);
  if (def.length) {
    const next = applyCostChanges(clone(job.direct ? state.settings : draft()), state.settings, def);
    await persistSettings(next, { checkDraftBase: !job.direct });
  }
  job.settingsSaved = def.length > 0;

}
async function applyCostToOrders(job, onlyFailed = false) {

  suppressRealtime++;

    for (let pi = 0; pi < job.plans.length; pi++) {
      const { ch, names, ids } = job.plans[pi];

        if (onlyFailed && !prevFailed.has(`${pi}:${id}`)) continue;
        const local = state.orders.find(x => x.id === id);
        try {
          const fresh = await freshOrderRow(id);
          if (orderType(fresh) === 'cancelled' || !(fresh.date >= ch.from && fresh.date <= ch.to)) { job.unchanged++; continue; }
          const snap0 = fresh.costSnapshot ? clone(fresh.costSnapshot) : buildSnapshot(fresh, 'estimated', job.base);
          const before = componentOf(snap0, ch, names);

            before, after: ch.now, orders_from: ch.from, orders_to: ch.to, default_from: updatesDefault(ch) ? ch.eff : null,
            locked_now: !fresh.costSnapshot, summary: `${componentTitle(ch)}: ${fmtComp(before, ch)} → ${fmtComp(ch.now, ch)} (orders ${fmtDate(ch.from)}–${fmtDate(ch.to)})` }];

          if (res.error) throw new Error(res.error.message || 'database error');

      }

}
