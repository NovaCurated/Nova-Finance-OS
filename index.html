  return `
    <div class="form-grid">
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="o-date" value="${o?.date || today}" onchange="refreshOrderPreview()">
      </div>
      <div class="form-group">
        <label>Order #</label>
        <input type="text" id="o-num" value="${esc(o?.orderNum||'')}" placeholder="#1013">
      </div>
      <div class="form-group full">
        <label>Customer Name</label>
        <input type="text" id="o-customer" value="${esc(o?.customer||'')}" placeholder="Full name">
      </div>
      <div class="form-group full">
        <label>Items</label>
        <div id="line-items-list">${lineItemsHTML}</div>
        <button type="button" class="btn btn-ghost" style="margin-top:6px;font-size:12px;padding:4px 10px" onclick="addLineItem()">+ Add item</button>
      </div>
      <div class="form-group">
        <label>Revenue (£)</label>
        <input type="number" id="o-rev" value="${o?.revenue||''}" placeholder="78.00" step="0.01" min="0" oninput="refreshOrderPreview()">
      </div>
      <div class="form-group">
        <label>Shipping Method</label>
        <select id="o-ship" onchange="refreshOrderPreview()">${methodOptions}</select>
      </div>
      <div class="form-group">
        <label>Channel</label>
        <div id="o-channel-row" style="padding:4px;transition:background 0.2s;border-radius:var(--radius)">
          <select id="o-channel" onchange="refreshOrderPreview(); document.getElementById('o-fold-rate-row').style.display=this.value==='fold'?'':'none'">
            <option value="shopify" ${(!o || o.channel==='shopify')?'selected':''}>Shopify</option>
            <option value="fold" ${o?.channel==='fold'?'selected':''}>Fold</option>
            <option value="direct" ${o?.channel==='direct'?'selected':''}>Direct — no fee</option>
          </select>
        </div>
      </div>
      <div class="form-group" id="o-fold-rate-row" style="display:${o?.channel==='fold'?'':'none'}">
        <label>Fold Commission Rate</label>
        <select id="o-fold-rate" onchange="refreshOrderPreview()">
          <option value="0.15" ${(!o?.foldCommissionRate || o.foldCommissionRate===0.15)?'selected':''}>15% (standard)</option>
          <option value="0.20" ${o?.foldCommissionRate===0.20?'selected':''}>20%</option>
          <option value="0.25" ${o?.foldCommissionRate===0.25?'selected':''}>25%</option>
          <option value="0.30" ${o?.foldCommissionRate===0.30?'selected':''}>30%</option>
        </select>
      </div>
    </div>
    <div id="order-preview"></div>`;
}

function openAddOrder() {
  editingOrderId = null;
  document.getElementById('modal-title').textContent = 'Add Order';
  document.getElementById('modal-body').innerHTML = orderFormHTML(null);
  document.getElementById('modal-footer').innerHTML = `
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveOrder()">Add Order</button>
  `;
  openModal();
  setTimeout(refreshOrderPreview, 0);
}

function editOrder(id) {
  const o = state.orders.find(x => x.id === id);
  if (!o) return;
  editingOrderId = id;
  document.getElementById('modal-title').textContent = 'Edit Order';
  document.getElementById('modal-body').innerHTML = orderFormHTML(o);
  document.getElementById('modal-footer').innerHTML = `
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="updateOrder(${id})">Save Changes</button>
  `;
  openModal();
  setTimeout(refreshOrderPreview, 0);
}

// Every change is shown immediately, then rolled back if the database write fails,
// so figures never include a record that wasn't saved.
async function updateOrder(id) {
  const idx = state.orders.findIndex(x => x.id === id);
  if (idx === -1) return;
  const form = readOrderForm();
  if (!form.date || !form.customer) { toast('Please fill in date and customer name.'); return; }
  editingOrderId = id;
  const prev = state.orders[idx];
  const updated = { ...prev, ...form };
  state.orders[idx] = updated;
  skipNextRefresh = true;
  closeModal();
  renderView('orders');
  if (await dbUpsertOrder(updated)) toast('Order updated.');
  else { const i = state.orders.indexOf(updated); if (i !== -1) state.orders[i] = prev; renderView(currentView); }
}

async function saveOrder() {
  const form = readOrderForm();
  if (!form.date || !form.customer) { toast('Please fill in date and customer name.'); return; }
  if (writesBlocked()) return;
  const order = { id: state.nextId.order++, ...form };
  state.orders.push(order);
  skipNextRefresh = true;
  closeModal();
  renderView('orders');
  if (await dbUpsertOrder(order)) toast('Order added.');
  else { state.orders = state.orders.filter(o => o !== order); renderView(currentView); }
}

async function deleteOrder(id) {
  if (!confirm('Delete this order?')) return;
  const before = state.orders;
  state.orders = state.orders.filter(o => o.id !== id);
  skipNextRefresh = true;
  renderView('orders');
  if (await dbDeleteOrder(id)) toast('Order deleted.');
  else { state.orders = before; renderView(currentView); }
}

async function toggleRefunded(id) {
  const order = state.orders.find(o => o.id === id);
  if (!order) return;
  const newVal = !order.refunded;
  order.refunded = newVal;
  skipNextRefresh = true;
  renderView('orders');
  if (await dbUpsertOrder(order)) toast(newVal ? 'Order marked as refunded.' : 'Refund reversed.');
  else { order.refunded = !newVal; renderView(currentView); }
}

let txSearch = '';
let txSort = { col: 'date', dir: -1 };

function renderTransactions(el, actions) {
  actions.innerHTML = `<button class="btn btn-primary" onclick="openAddTx()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Add Transaction
  </button>`;

  let txs = [...state.transactions];
  if (txSearch) {
    const q = txSearch.toLowerCase();
    txs = txs.filter(t =>
      t.description.toLowerCase().includes(q) ||
      t.category.toLowerCase().includes(q)
    );
  }

  txs.sort((a,b) => {
    let va = a[txSort.col], vb = b[txSort.col];
    if (va < vb) return -1 * txSort.dir;
    if (va > vb) return 1 * txSort.dir;
    return 0;
  });

  const rows = txs.map(t => {
    const cfg = CAT_CFG[t.category] || {};
    const cashEffect = cfg.d === 'In' ? t.amount : -t.amount;
    return `<tr>
      <td>${fmtDate(t.date)}</td>
      <td>${t.description}</td>
      <td>${t.category}</td>
      <td class="num">${fmt(t.amount)}</td>
      <td>${treatmentBadge(t.category)}</td>
      <td><span class="badge ${cfg.d==='In'?'badge-in':'badge-out'}">${cfg.d||'—'}</span></td>
      <td class="num">${colorFmt(cashEffect)}</td>
      <td>
        <div class="row-actions">
          <button class="edit-btn" onclick="editTx(${t.id})" title="Edit">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="edit-btn" onclick="copyTxToday(${t.id})" title="Copy to today">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button class="delete-btn" onclick="deleteTx(${t.id})" title="Delete">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
        </div>
      </td>
    </tr>`;
  }).join('');

  const thSort = (col, label) => {
    const active = txSort.col === col;
    const cls = active ? (txSort.dir === 1 ? 'sort-asc' : 'sort-desc') : '';
    return `<th class="${cls}" onclick="sortTx('${col}')">${label}</th>`;
  };

  const totalIn = txs.filter(t=>CAT_CFG[t.category]?.d==='In').reduce((a,t)=>a+t.amount,0);
  const totalOut = txs.filter(t=>CAT_CFG[t.category]?.d==='Out').reduce((a,t)=>a+t.amount,0);

  el.innerHTML = `
    <div class="table-wrap">
      <div class="table-toolbar">
        <div class="table-toolbar-left">
          <input class="search-input" type="text" placeholder="Search transactions…"
            value="${txSearch}" oninput="txSearch=this.value;renderView('transactions')">
          <span class="muted" style="font-size:12px">${txs.length} transaction${txs.length !== 1 ? 's' : ''}</span>
        </div>
        <div style="font-size:12px;color:var(--text-2)">
          In <strong class="pos-text">${fmt(totalIn)}</strong> &nbsp;·&nbsp;
          Out <strong class="neg-text">${fmt(totalOut)}</strong>
        </div>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              ${thSort('date','Date')}
              ${thSort('description','Description')}
              ${thSort('category','Category')}
              ${thSort('amount','Amount')}
              <th>Treatment</th>
              <th>Direction</th>
              <th>Cash Effect</th>
              <th></th>
            </tr>
          </thead>
          <tbody>${rows || `<tr><td colspan="8"><div class="empty-state"><div class="empty-state-icon">💳</div><div class="empty-state-text">No transactions yet.</div></div></td></tr>`}</tbody>
        </table>
      </div>
    </div>
  `;
}

function sortTx(col) {
  if (txSort.col === col) txSort.dir *= -1;
  else { txSort.col = col; txSort.dir = -1; }
  renderView('transactions');
}

function openAddTx() {
  const catOptions = CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
  document.getElementById('modal-title').textContent = 'Add Transaction';
  document.getElementById('modal-body').innerHTML = `
    <div class="form-grid">
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="t-date" value="${londonToday()}">
      </div>
      <div class="form-group">

        <input type="text" id="t-desc" placeholder="Brief description">

function editTx(id) {
  const t = state.transactions.find(x => x.id === id);
  if (!t) return;
  const catOptions = CATEGORIES.map(c =>
    `<option value="${c}" ${t.category===c?'selected':''}>${c}</option>`).join('');

  document.getElementById('modal-title').textContent = 'Edit Transaction';
  document.getElementById('modal-body').innerHTML = `
    <div class="form-grid">
      <div class="form-group">
        <label>Date</label>

      </div>
      <div class="form-group">

  };
  document.getElementById('t-cat').addEventListener('change', updateHint);
  updateHint();

  document.getElementById('modal-footer').innerHTML = `
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="updateTx(${id})">Save Changes</button>
  `;

}

async function updateTx(id) {
  const idx = state.transactions.findIndex(x => x.id === id);
  if (idx === -1) return;
  const date = document.getElementById('t-date').value;
  const description = document.getElementById('t-desc').value.trim();
  const amount = parseFloat(document.getElementById('t-amount').value);
  const category = document.getElementById('t-cat').value;
  if (!date || !description || isNaN(amount) || amount <= 0) {
    toast('Please fill in all fields with a valid amount.'); return;
  }
  const prev = state.transactions[idx];
  const updated = { ...prev, date, description, amount, category };
  state.transactions[idx] = updated;
  skipNextRefresh = true;
  closeModal();
  renderView('transactions');
  if (await dbUpsertTx(updated)) toast('Transaction updated.');
  else { const i = state.transactions.indexOf(updated); if (i !== -1) state.transactions[i] = prev; renderView(currentView); }
}

async function saveTx() {
  const date = document.getElementById('t-date').value;
  const description = document.getElementById('t-desc').value.trim();
  const amount = parseFloat(document.getElementById('t-amount').value);
  const category = document.getElementById('t-cat').value;

  if (!date || !description || isNaN(amount) || amount <= 0) {
    toast('Please fill in all fields with a valid amount.'); return;
  }

  if (writesBlocked()) return;
  const tx = { id: state.nextId.tx++, date, description, category, amount };
  state.transactions.push(tx);
  skipNextRefresh = true;
  closeModal();
  renderView('transactions');
  if (await dbUpsertTx(tx)) toast('Transaction added.');
  else { state.transactions = state.transactions.filter(t => t !== tx); renderView(currentView); }
}

async function copyTxToday(id) {
  const orig = state.transactions.find(t => t.id === id);
  if (!orig) return;
  const today = londonToday();
  if (writesBlocked()) return;
  const tx = { ...orig, id: state.nextId.tx++, date: today };
  state.transactions.push(tx);
  skipNextRefresh = true;
  renderView('transactions');
  if (await dbUpsertTx(tx)) toast(`Copied "${orig.description}" to today ✓`);
  else { state.transactions = state.transactions.filter(t => t !== tx); renderView(currentView); }
}

async function deleteTx(id) {
  if (!confirm('Delete this transaction?')) return;
  const before = state.transactions;
  state.transactions = state.transactions.filter(t => t.id !== id);
  skipNextRefresh = true;
  renderView('transactions');
  if (await dbDeleteTx(id)) toast('Transaction deleted.');
  else { state.transactions = before; renderView(currentView); }
}

const _todayParts = parseYMD(londonToday());
let mvFromMonth = _todayParts.m, mvFromYear = _todayParts.y;
let mvToMonth   = _todayParts.m, mvToYear   = _todayParts.y;

function inRange(dateStr, fromM, fromY, toM, toY) {
  return inDateRange(dateStr, monthRange({ y: fromY, m: fromM }, { y: toY, m: toM }));
}

function renderMonthly(el, actions) {
  const monthOpts = (selected) => MONTHS_SHORT.map((m,i) =>
    `<option value="${i+1}" ${selected===i+1?'selected':''}>${m}</option>`).join('');

  const range = monthRange({ y: mvFromYear, m: mvFromMonth }, { y: mvToYear, m: mvToMonth });
  const filtered = state.orders.filter(o => inDateRange(o.date, range));

  const calc = filtered.map(o => ({ o, c: calcOrder(o) }));
  const totalRev   = calc.reduce((a,x) => a + effRev(x.o), 0);
  const totalCost  = calc.reduce((a,x) => a + x.c.productCost, 0);
  const totalShip  = calc.reduce((a,x) => a + x.c.shippingOut, 0);
  const totalShop  = calc.reduce((a,x) => a + x.c.platformCut, 0);

    .map(({ o, c }) => {

        <td class="num muted">${fmt(c.shippingOut)}</td>

      <select onchange="mvToMonth=parseInt(this.value);renderView('monthly')">${monthOpts(mvToMonth)}</select>
      <input type="number" value="${mvToYear}" min="2020" max="2099" style="width:72px"
        onchange="mvToYear=parseInt(this.value)||${_todayParts.y};renderView('monthly')">
      <span class="period-viewing">Viewing: ${range.label}</span>
    </div>
    <div class="period-dates">Order dates ${fmtRange(range)} · order-level contribution only — overheads and postage adjustments are in the P&amp;L</div>

    <div class="kpi-grid mb-24" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
      <div class="kpi-card">
        <div class="kpi-label">Orders</div>
        <div class="kpi-value">${filtered.length}</div>

      <div class="kpi-card">

let plMode = 'ytd';          // 'ytd' | 'fy' | 'months'
let plFyYear = null;         // financial-year start year when plMode === 'fy'
let plFrom = null, plTo = null;  // { y, m } when plMode === 'months'

function plRange(today = londonToday()) {
  if (plMode === 'fy') return fyRange(plFyYear ?? fyContaining(today).fyStartYear);
  if (plMode === 'months') {
    const t = parseYMD(today);
    return monthRange(plFrom || { y: t.y, m: t.m }, plTo || plFrom || { y: t.y, m: t.m });
  }
  return ytdRange(today);
}

function fyYearOptions(today) {
  const cur = fyContaining(today).fyStartYear;
  const dates = [...state.orders.map(o => o.date), ...state.transactions.map(t => t.date)].filter(isValidYMD);
  const first = dates.length ? fyContaining(dates.reduce((a, b) => a < b ? a : b)).fyStartYear : cur;
  const years = [];
  for (let y = Math.min(first, cur); y <= cur; y++) years.push(y);
  return years;
}

function renderPL(el, actions) {
  const today = londonToday();
  const range = plRange(today);
  const p = computeReport(range, today);
  const sc = stockCountCheck(today);
  const warnings = [...reportWarnings(p)];
  if (sc.hasCount && sc.date && inDateRange(sc.date, p.range)) warnings.push(...stockWarnings(sc));
  else if (sc.hasCount && !sc.date) warnings.push(...stockWarnings(sc).filter(w => w.level !== 'warn' || /no count date/.test(w.html)));

  const row = (label, val, cls='', indent=false) => {
    const indentStyle = indent ? ' style="padding-left:36px"' : '';
    return `<div class="pl-row ${cls}">
      <span${indentStyle}>${label}</span>
      <span class="pl-value">${colorFmt(val)}</span>
    </div>`;
  };
  const sectionHeader = label => `<div class="pl-row section-header"><span>${label}</span></div>`;
  const muted = (label, val) => `<div class="pl-row"><span style="color:var(--text-3);font-size:12px">${label}</span><span class="pl-value" style="font-size:12px;color:var(--text-3)">${val}</span></div>`;

  const opexRows = OPEX_CATS.map(cat => p.opex[cat] > 0 ? row(esc(cat), -p.opex[cat], '', true) : '').join('');

  const t = parseYMD(today);
  const f = plFrom || { y: t.y, m: t.m };
  const to = plTo || f;
  const moSel = (sel, onch) => `<select onchange="${onch}">${MONTHS_SHORT.map((m,i) => `<option value="${i+1}" ${sel===i+1?'selected':''}>${m}</option>`).join('')}</select>`;
  const yrInp = (val, onch) => `<input type="number" value="${val}" min="2020" max="2099" style="width:72px" onchange="${onch}">`;

  const curFy = fyContaining(today).fyStartYear;
  const controls = plMode === 'fy'
    ? `<select onchange="plFyYear=parseInt(this.value);renderView('pl')">${fyYearOptions(today).map(y => `<option value="${y}" ${(plFyYear ?? curFy)===y?'selected':''}>${fyLabel(y)}</option>`).join('')}</select>`
    : plMode === 'months'
    ? `<strong style="font-size:12px;color:var(--text-2)">From</strong>
       ${moSel(f.m, `plFrom={y:${f.y},m:parseInt(this.value)};renderView('pl')`)}
       ${yrInp(f.y, `plFrom={y:parseInt(this.value)||${t.y},m:${f.m}};renderView('pl')`)}
       <strong style="font-size:12px;color:var(--text-2);margin-left:6px">To</strong>
       ${moSel(to.m, `plTo={y:${to.y},m:parseInt(this.value)};renderView('pl')`)}
       ${yrInp(to.y, `plTo={y:parseInt(this.value)||${t.y},m:${to.m}};renderView('pl')`)}`
    : '';

  const datesLine = `Reporting dates: <strong style="color:var(--text-2)">${fmtRange(p.range)}</strong>` +
    (p.range.capped ? ` · the period runs to ${fmtDateLong(p.range.requestedTo)}; records after today are excluded` : '') +
    (p.range.from > today ? ' · this period is in the future' : '');

  const pFromLabel = p.pFrom ? fmtDateLong(p.pFrom) : '';

  el.innerHTML = `
    <div class="period-bar" style="gap:6px 14px;flex-wrap:wrap">
      <strong style="font-size:12px;color:var(--text-2)">Period</strong>
      <select onchange="plMode=this.value;renderView('pl')">
        <option value="ytd" ${plMode==='ytd'?'selected':''}>Year to date</option>
        <option value="fy" ${plMode==='fy'?'selected':''}>Financial year</option>
        <option value="months" ${plMode==='months'?'selected':''}>Month(s)</option>
      </select>
      ${controls}
      <span class="period-viewing">Viewing: ${esc(range.label)}</span>
    </div>
    <div class="period-dates">${datesLine}</div>
    ${noticesHTML(warnings)}

    <div class="pl-statement">
      ${sectionHeader('Revenue')}
      ${row(`Sales — orders (${p.ordersCount})`, p.salesRev, '', true)}
      ${row('Total Revenue', p.salesRev, 'total')}

      ${sectionHeader('Direct costs of orders')}
      ${row(`Cost of scarves sold (${p.unitsSold} unit${p.unitsSold!==1?'s':''} × locked landed cost)`, -p.cogsSold, '', true)}
      ${row('Postage — order estimates', -p.postageEst, '', true)}
      ${p.shopifyFees ? row('Shopify transaction fees', -p.shopifyFees, '', true) : ''}
      ${p.foldFees ? row('Fold commission', -p.foldFees, '', true) : ''}
      ${row('Contribution', p.contribution, 'total')}
      ${muted('Contribution margin', fmtPct(p.cmPct))}

      ${sectionHeader('Other direct costs')}
      ${row('Packaging', -p.packaging, '', true)}
      ${p.actualWindow ? row(`Postage adjustment — actual less estimated (from ${pFromLabel})`, -p.postageAdjustment, '', true) : ''}
      ${p.postageOther ? row('Other postage (transactions not replacing estimates)', -p.postageOther, '', true) : ''}
      ${row('Total other direct costs', -p.otherDirect, 'subtotal')}

      ${sectionHeader('Operating Expenses')}
      ${opexRows || `<div class="pl-row"><span style="color:var(--text-3);padding-left:36px">No operating expenses in this period</span></div>`}
      ${row('Total Operating Expenses', -p.totalOpEx, 'subtotal')}

      <div class="pl-row net-profit">
        <span>Operating Profit</span>
        <span class="pl-value">${colorFmt(p.operatingProfit)}</span>
      </div>
      ${muted('Operating margin', fmtPct(p.opMarginPct))}
      ${p.otherIncome ? row('Other income', p.otherIncome, '', true) + row('Profit before tax', p.profitBeforeTax, 'total') : ''}
      <div class="pl-note">Stock purchases are not expensed here — they are added to book stock (below) and charged to profit as scarves are sold.
        Contribution and operating profit match the dashboard for the same dates. No tax is calculated.</div>
    </div>

    <p class="section-heading" style="margin-top:24px">Stock — book value at landed cost</p>
    <div class="pl-statement">
      ${row(`Book stock at start (before ${fmtDateLong(p.range.from)})`, p.stockStart)}
      ${row('Add: stock purchases (incl. inbound shipping)', p.stockPurchases, '', true)}
      ${row('Less: cost of scarves sold', -p.cogsSold, '', true)}
      ${row(`Book stock at ${fmtDateLong(p.range.to)}`, p.stockEnd, 'total')}
      ${sc.hasCount ? `<div class="pl-note">Last stock count: <strong>${fmt(sc.value)}</strong> ${sc.date ? `on ${fmtDateLong(sc.date)}` : '(undated)'} · book stock at ${fmtDateLong(sc.asOf)}: ${fmt(sc.book)} · variance ${fmt(sc.variance)} — shown for checking, <strong>not booked to profit</strong>.</div>` : ''}
    </div>

    <p class="section-heading" style="margin-top:24px">Cash movement — estimated</p>
    <div class="pl-statement">
      ${row('Order receipts (revenue less platform fees)*', p.orderReceipts, '', true)}
      ${p.postagePaidEst ? row('Postage paid — order estimates*', -p.postagePaidEst, '', true) : ''}
      ${p.otherIncome ? row('Other income', p.otherIncome, '', true) : ''}
      ${row('Stock purchases', -p.stockPurchases, '', true)}
      ${p.packaging ? row('Packaging', -p.packaging, '', true) : ''}
      ${p.postageTxTotal ? row('Postage — Shipping & Postage transactions', -p.postageTxTotal, '', true) : ''}
      ${row('Operating expenses', -p.totalOpEx, '', true)}

      ${p.ownerIn || p.ownerOut ? row('Owner investment less drawings', p.ownerIn - p.ownerOut, '', true) : ''}
      ${row('Net cash movement (estimated)', p.cashMovement, 'total')}
      <div class="pl-note">*Estimated from orders by order date: payout timing isn't applied and receipts aren't confirmed against the bank. Full bank reconciliation is not part of this version.
        ${p.salesCatCount ? `<br>Excluded from profit and cash: ${p.salesCatCount} transaction${p.salesCatCount!==1?'s':''} categorised Sales (${fmt(p.salesCatTotal)}).` : ''}</div>
    </div>
  `;
}

async function manualSync() {
  setSyncStatus('syncing', 'Syncing…');
  try {
    await loadFromSupabase();
    setSyncStatus('synced', 'Synced');
    renderView(currentView);
    toast('Data refreshed ✓');
  } catch (e) {
    setSyncStatus('error', 'Sync failed');
    toast('Sync failed — check connection');
  }
}

function hardReload() {
  if (swRegistration?.waiting) swRegistration.waiting.postMessage('skipWaiting');
  caches.keys().then(keys => Promise.all(keys.map(k => caches.delete(k)))).finally(() => {
    window.location.reload(true);
  });
}

function renderSettings(el, actions) {
  const s = state.settings;

  actions.innerHTML = `<button class="btn btn-primary" onclick="saveSettings()">Save Changes</button>`;

  const usedBy = (names) => state.orders.filter(o => orderLines(o).some(l => names.includes(l.sku))).length;
  const usedByMethod = (names) => state.orders.filter(o => names.includes(o.shippingMethod)).length;
  const histLine = (x, cols) => {
    const t = historyText(historyOf(x));
    const alias = Array.isArray(x.aliases) && x.aliases.length ? `Previously named: ${x.aliases.map(esc).join(', ')}. ` : '';
    return (t || alias) ? `<tr><td colspan="${cols}" style="font-size:11px;color:var(--text-3);padding-top:0">${alias}${t ? 'Cost history: ' + t : ''}</td></tr>` : '';
  };
  const archivedRow = (label, n, restore) => `<tr style="opacity:.6"><td colspan="3" style="font-size:12px">${esc(label)} — archived, kept for ${n} past order${n!==1?'s':''}</td>
    <td><button class="edit-btn" title="Restore" onclick="${restore}">↺</button></td></tr>`;

  const skuRows = s.skuCosts.map((x, i) => x.archived ? archivedRow(x.sku, usedBy([x.sku, ...(x.aliases||[])]), `restoreSkuRow(${i})`) : `<tr>
    <td><input type="text" value="${esc(x.sku)}" onchange="state.settings.skuCosts[${i}].sku=this.value"></td>
    <td><input type="number" value="${x.cost}" step="0.01" min="0" style="width:80px" onchange="state.settings.skuCosts[${i}].cost=parseFloat(this.value)||0"></td>
    <td><input type="text" value="${esc(x.notes)}" onchange="state.settings.skuCosts[${i}].notes=this.value"></td>
    <td><button class="delete-btn" onclick="removeSkuRow(${i})">×</button></td>
  </tr>${histLine(x, 4)}`).join('');

  const shippingRows = s.shippingMethods.map((x, i) => x.archived ? archivedRow(x.method, usedByMethod([x.method, ...(x.aliases||[])]), `restoreShipRow(${i})`) : `<tr>
    <td><input type="text" value="${esc(x.method)}" onchange="state.settings.shippingMethods[${i}].method=this.value"></td>
    <td><input type="number" value="${x.cost}" step="0.01" min="0" style="width:80px" onchange="state.settings.shippingMethods[${i}].cost=parseFloat(this.value)||0"></td>
    <td><input type="text" value="${esc(x.notes)}" onchange="state.settings.shippingMethods[${i}].notes=this.value"></td>
    <td><button class="delete-btn" onclick="removeShipRow(${i})">×</button></td>

async function saveSettings() {
  if (writesBlocked()) return;
  const s = state.settings;
  const numIn = id => { const v = parseFloat(document.getElementById(id).value); return Number.isFinite(v) ? v : 0; };
  s.businessName          = document.getElementById('s-biz').value;
  s.financialYearStartMonth = parseInt(document.getElementById('s-fy').value, 10) || 1;
  s.openingStock          = numIn('s-os');
  s.closingStock          = numIn('s-cs');
  const cd = document.getElementById('s-csdate').value;
  s.stockCountDate        = isValidYMD(cd) ? cd : null;
  const pf = document.getElementById('s-postfrom').value;
  s.postageActualFrom     = isValidYMD(pf) ? pf : null;
  s.defaultShipping       = numIn('s-defship');
  s.shopifyFeeRate        = numIn('s-sfrate');
  s.shopifyFixedFee       = numIn('s-sffixed');
  s.platformPayoutLagDays = lagDays(document.getElementById('s-payoutlag').value, 5);
  s.foldPayoutLagDays     = lagDays(document.getElementById('s-foldlag').value, 14);

  const base = savedSettings || JSON.parse(JSON.stringify(s));
  // Renames: remember the old name so past orders using it keep their costs.
  [['skuCosts', 'sku'], ['shippingMethods', 'method']].forEach(([list, key]) => (s[list] || []).forEach(e => {
    const b = (base[list] || []).find(x => x.uid === e.uid);
    if (b && b[key] && b[key] !== e[key]) e.aliases = [...new Set([...(e.aliases || []), b[key]])].filter(a => a !== e[key]);
  }));
  const changes = costChanges(base, s);
  if (changes.length) { openCostChangePrompt(changes); return; }
  await commitSettings(null, null);
}

function costChangeFromDate() {
  const v = document.querySelector('input[name=cc-when]:checked')?.value || 'today';
  if (v === 'all') return EPOCH;
  if (v === 'date') { const d = document.getElementById('cc-date').value; return isValidYMD(d) ? d : null; }
  return londonToday();
}

function refreshCostImpact() {
  const el = document.getElementById('cc-impact');
  if (!el || !_pendingCostChanges) return;
  const from = costChangeFromDate();
  const btn = document.getElementById('cc-save');
  if (!from) { el.className = 'notice warn'; el.innerHTML = 'Choose a valid date.'; if (btn) btn.disabled = true; return; }
  if (btn) btn.disabled = false;
  const imp = costChangeImpact(state.settings, savedSettings, _pendingCostChanges, from);
  const replaces = _pendingCostChanges.some(ch => {
    const hist = ch.kind === 'sku' ? historyOf(savedSettings.skuCosts.find(x => x.uid === ch.uid))
               : ch.kind === 'ship' ? historyOf(savedSettings.shippingMethods.find(x => x.uid === ch.uid))
               : ch.kind === 'defship' ? historyOf({ history: savedSettings.defaultShippingHistory, cost: savedSettings.defaultShipping })
               : (savedSettings.feeHistory || []);
    return hist.some(h => h.from > from && h.from !== EPOCH);
  });
  el.className = 'notice' + (imp.affected ? ' warn' : '');
  el.innerHTML = (imp.affected
    ? `Reprices <strong>${imp.affected} existing order${imp.affected!==1?'s':''}</strong>; profit to date changes by <strong>${fmt(imp.delta)}</strong>.`
    : 'No existing orders change — only orders from that date onwards.')
    + (replaces ? '<br>This replaces a later cost change already recorded for one of these items.' : '');
}

function cancelCostChanges() {
  _pendingCostChanges = null;
  closeModal();
  state.settings = JSON.parse(JSON.stringify(savedSettings));   // nothing saved — discard the edits
  toast('Nothing saved — changes discarded.');
  renderView('settings');
}

async function confirmCostChanges() {
  const from = costChangeFromDate();
  if (!from || !_pendingCostChanges) return;
  const changes = _pendingCostChanges;
  _pendingCostChanges = null;
  closeModal();
  await commitSettings(changes, from);
}

async function commitSettings(changes, fromDate) {
  if (changes) applyCostChanges(state.settings, savedSettings, changes, fromDate);
  if (state.settings.financialYearStartMonth !== savedSettings?.financialYearStartMonth) plFyYear = null;
  const ok = await dbSaveSettings();
  if (ok) {
    savedSettings = JSON.parse(JSON.stringify(state.settings));
    setSyncStatus('synced', 'Saved');
    toast(changes ? `Settings saved — new cost${changes.length>1?'s apply':' applies'} ${fromDate === EPOCH ? 'to all orders' : 'from ' + fmtDateLong(fromDate)}.` : 'Settings saved.');
  } else {
    if (savedSettings) state.settings = JSON.parse(JSON.stringify(savedSettings));
    toast('Settings NOT saved — database error. Your changes were discarded.');
  }
  document.getElementById('page-subtitle').textContent = pageSubtitle();
  renderView('settings');
}

// ── Backup export ───────────────────────────────────
// Reads fresh copies from the database (not the screen), strips bank secrets, verifies the
// JSON round-trips, and only reports success once the download has been handed to the browser.
const SECRET_KEY_RE = /token|secret|password|expires/i;

function stripSecrets(v) {
  if (Array.isArray(v)) return v.map(stripSecrets);
  if (v && typeof v === 'object') {
    const out = {};
    for (const [k, val] of Object.entries(v)) { if (!SECRET_KEY_RE.test(k)) out[k] = stripSecrets(val); }
    return out;
  }
  return v;
}

async function exportBackup() {
  try {
    setSyncStatus('syncing', 'Preparing backup…');
    const [orders, transactions, settingsRows] = await Promise.all([
      fetchAllRows('orders', 'id'),
      fetchAllRows('transactions', 'id'),
      fetchAllRows('settings', 'key'),
    ]);
    const settings = settingsRows.map(r => ({ ...r, value: stripSecrets(r.value) }));
    const stamp = londonToday();
    const payload = {
      format: 'nova-finance-backup', format_version: 1,
      app_version: APP_VERSION, exported_at: new Date().toISOString(), exported_on: stamp, timezone: LONDON_TZ,
      source: SUPABASE_URL,
      counts: { orders: orders.length, transactions: transactions.length, settings: settings.length },
      excluded: 'Bank access/refresh tokens and token expiry fields are removed from settings.',
      orders, transactions, settings,
    };
    const json = JSON.stringify(payload, null, 2);
    const check = JSON.parse(json);
    if (check.orders.length !== orders.length || check.transactions.length !== transactions.length) throw new Error('verification failed');
    if (/"(accessToken|refreshToken|access_token|refresh_token)"/.test(JSON.stringify(check.settings))) throw new Error('bank token still present');

    const file = `nova-finance-backup-${stamp}.json`;
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = file; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);

    lastBackup = { at: new Date(), file, counts: payload.counts };
    setSyncStatus('synced', 'Backup ready');
    toast(`Backup downloaded: ${file} — ${orders.length} orders, ${transactions.length} transactions`);
    if (currentView === 'sync' || currentView === 'settings') renderView(currentView);
    return true;
  } catch (e) {
    console.error('Backup failed:', e);
    setSyncStatus('error', 'Backup failed');
    toast('Backup FAILED — nothing was downloaded. ' + (e?.message || ''));
    return false;
  }
}

function gcMatchRule(raw) {
  const up = raw.toUpperCase();
  return BANK_RULES.find(r => r.keywords.some(k => up.includes(k))) || null;
}

async function tlProxy(action, params = {}) {
  const res = await fetch(TL_PROXY, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'apikey': SUPABASE_KEY,
    },
    body: JSON.stringify({ action, ...params }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'TrueLayer proxy error');
  return data;
}

async function gcEnsureToken() {
  const cfg = state.settings.bankConfig || {};
  const now = Date.now();
  if (cfg.accessToken && (cfg.accessExpires || 0) > now + 60000) return;
  if (!cfg.refreshToken) throw new Error('Not connected to bank. Please reconnect.');
  const d = await tlProxy('refresh_token', { refresh_token: cfg.refreshToken });
  if (!d.access_token) throw new Error(d.error || 'Failed to refresh token. Please reconnect.');
  cfg.accessToken   = d.access_token;
  cfg.accessExpires = now + (d.expires_in || 3600) * 1000;
  if (d.refresh_token) cfg.refreshToken = d.refresh_token;
  state.settings.bankConfig = cfg;
  await dbSaveSettings();
}

async function gcConnectBank() {
  const clientId = document.getElementById('gc-id')?.value?.trim();
  if (!clientId) { toast('Enter your TrueLayer Client ID first.'); return; }
  state.settings.bankConfig = { ...state.settings.bankConfig, clientId };
  await dbSaveSettings();
  const authUrl = 'https://auth.truelayer-sandbox.com/'
    + '?response_type=code'
    + '&client_id=' + encodeURIComponent(clientId)
    + '&scope=' + encodeURIComponent('accounts transactions balance offline_access')
    + '&redirect_uri=' + encodeURIComponent(TL_REDIRECT)
    + '&providers=mock';
  window.location.href = authUrl;
}

async function gcCompleteAuth() {
  if (writesBlocked()) return;
  const urlParams = new URLSearchParams(window.location.search);
  const code      = urlParams.get('code');
  if (!code) { toast('No auth code received — please try connecting again.'); return; }
  try {
    setSyncStatus('syncing', 'Completing bank setup…');
    const d = await tlProxy('exchange_code', { code, redirect_uri: TL_REDIRECT });
    if (!d.access_token) throw new Error(d.error || 'Token exchange failed.');
    const cfg = state.settings.bankConfig || {};
    const now = Date.now();
    cfg.accessToken   = d.access_token;
    cfg.accessExpires = now + (d.expires_in || 3600) * 1000;
    cfg.refreshToken  = d.refresh_token;
    // Get account list to find account ID
    const accounts = await tlProxy('get_accounts', { access_token: d.access_token });
    const account  = accounts.results?.[0];
    if (!account) throw new Error('No accounts found.');
    cfg.accountId       = account.account_id;
    cfg.institutionName = account.provider?.display_name || account.display_name || 'Bank';
    state.settings.bankConfig = cfg;
    await dbSaveSettings();
    setSyncStatus('synced', 'Bank connected');
    toast('Bank connected ✓');
    window.history.replaceState({}, '', window.location.pathname);
    renderView('settings');
  } catch (e) {
    setSyncStatus('error', 'Setup failed');
    toast('Bank setup failed: ' + e.message);
  }
}

async function gcFetchTransactions() {
  const cfg = state.settings.bankConfig || {};
  if (!cfg.accountId) { toast('No bank account connected.'); return; }
  try {
    setSyncStatus('syncing', 'Fetching transactions…');
    await gcEnsureToken();
    const dateFrom = cfg.lastSync
      || addDays(londonToday(), -60);
    const data = await tlProxy('get_transactions', {
      access_token: cfg.accessToken,
      account_id:   cfg.accountId,
      date_from:    dateFrom,
    });
    const txs = data.results || [];
    // Keep debits only (amount < 0 = money out)
    const debits = txs.filter(t => (t.amount || 0) < 0);
    // Exclude anything already in the app (same date + same amount within 1p)
    const pending = debits.filter(bt => {
      const d = bt.timestamp?.slice(0, 10);
      const a = Math.abs(bt.amount);
      return !state.transactions.some(t => t.date === d && Math.abs(t.amount - a) < 0.01);
    });
    setSyncStatus('synced', 'Synced');
    if (!pending.length) { toast('No new transactions to review.'); return; }
    _pendingBankTxs = pending;
    showBankReviewModal();
  } catch (e) {
    setSyncStatus('error', 'Fetch failed');
    toast('Failed to fetch transactions: ' + e.message);
  }
}

function showBankReviewModal() {
  const rows = _pendingBankTxs.map((bt, i) => {
    const amount  = Math.abs(bt.amount || 0);
    const date    = bt.timestamp?.slice(0, 10) || '';
    const rawDesc = bt.description || bt.merchant_name || 'Unknown';
    const rule    = gcMatchRule(rawDesc);
    const sugDesc = rule ? rule.description : rawDesc.replace(/"/g, '\'').slice(0, 60);
    const sugCat  = rule ? rule.category : 'Other Expenses';
    return `<tr style="border-bottom:1px solid var(--border)">
      <td style="padding:8px 4px">
        <input type="checkbox" class="gc-chk" data-i="${i}" checked style="width:15px;height:15px;cursor:pointer">
      </td>
      <td style="padding:8px 6px;font-size:12px;color:var(--text-2);white-space:nowrap">${date}</td>
      <td style="padding:8px 6px">
        <input type="text" class="gc-desc" data-i="${i}" value="${sugDesc}"
          style="width:100%;font-size:13px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;background:var(--bg-2);color:var(--text-1)">
      </td>
      <td style="padding:8px 6px">
        <select class="gc-cat" data-i="${i}"
          style="width:100%;font-size:13px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;background:var(--bg-2);color:var(--text-1)">
          ${CATEGORIES.map(c => `<option${c===sugCat?' selected':''}>${c}</option>`).join('')}
        </select>
      </td>
      <td style="padding:8px 6px;text-align:right;font-weight:600;white-space:nowrap">£${amount.toFixed(2)}</td>
    </tr>`;
  }).join('');

  document.getElementById('modal-title').textContent = 'Review Bank Transactions';
  document.getElementById('modal-body').innerHTML = `
    <p style="font-size:13px;color:var(--text-2);margin-bottom:12px">
      ${_pendingBankTxs.length} new outgoing transaction${_pendingBankTxs.length > 1 ? 's' : ''} from your bank.
      Tick the ones to log, adjust descriptions/categories, then click Log.
    </p>
    <div style="overflow-x:auto;max-height:52vh;overflow-y:auto">
      <table style="width:100%;border-collapse:collapse">
        <thead><tr style="font-size:11px;color:var(--text-3);text-transform:uppercase;border-bottom:1px solid var(--border)">
          <th style="padding:4px 4px"></th>
          <th style="padding:4px 6px;text-align:left">Date</th>
          <th style="padding:4px 6px;text-align:left">Description</th>
          <th style="padding:4px 6px;text-align:left">Category</th>
          <th style="padding:4px 6px;text-align:right">Amount</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  document.getElementById('modal-footer').innerHTML = `
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="logBankTransactions()">Log Selected</button>`;
  openModal();
}

async function logBankTransactions() {
  const checks = document.querySelectorAll('.gc-chk');
  const descs  = document.querySelectorAll('.gc-desc');
  const cats   = document.querySelectorAll('.gc-cat');
  if (writesBlocked()) return;
  let added = 0, failedBank = 0;
  for (let i = 0; i < _pendingBankTxs.length; i++) {
    if (!checks[i]?.checked) continue;
    const bt     = _pendingBankTxs[i];
    const amount = Math.abs(bt.amount || 0);
    const date   = bt.timestamp?.slice(0, 10) || londonToday();
    const tx = {
      id: state.nextId.tx++,
      date,
      description: descs[i]?.value?.trim() || 'Bank Transaction',
      category:    cats[i]?.value || 'Other Expenses',
      amount
    };
    state.transactions.push(tx);
    skipNextRefresh = true;
    if (await dbUpsertTx(tx)) added++;
    else { state.transactions = state.transactions.filter(t => t !== tx); failedBank++; }
  }
  if (added > 0) {
    state.settings.bankConfig.lastSync = londonToday();
    await dbSaveSettings();
  }
  closeModal();
  renderView('transactions');
  toast(`Logged ${added} transaction${added !== 1 ? 's' : ''}${failedBank ? ` · ${failedBank} NOT saved` : ' ✓'}`);
}

async function gcDisconnect() {
  if (!confirm('Disconnect your bank account?')) return;
  state.settings.bankConfig = {};
  await dbSaveSettings();
  renderView('settings');
  toast('Bank disconnected.');
}

// ── Password protection ──────────────────────────────────────────
const PW_HASH = '46cde98529630458a95bb5974210c1b1a0a76debaf8f4024301dd84782024db2'; // sha256 of current password
const PW_SESSION_KEY = 'nova_auth';
const PW_STORE = localStorage;

async function hashString(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkPassword() {
  const input = document.getElementById('pw-input');
  const error = document.getElementById('pw-error');
  const hash = await hashString(input.value);
  if (hash === PW_HASH) {
    PW_STORE.setItem(PW_SESSION_KEY, '1');
    document.getElementById('pw-screen').classList.add('hidden');
    input.value = '';
    error.textContent = '';
  } else {
    input.classList.add('shake');
    error.textContent = 'Incorrect password';
    setTimeout(() => { input.classList.remove('shake'); input.value = ''; input.focus(); }, 350);
  }
}

// Show/hide password screen
if (PW_STORE.getItem(PW_SESSION_KEY) === '1') {
  document.getElementById('pw-screen').classList.add('hidden');
} else {
  // Keep loading splash hidden until auth
  document.getElementById('loading-splash').style.display = 'none';
  setTimeout(() => document.getElementById('pw-input').focus(), 100);
}

// Boot
(async () => {
  // Wait for password if not yet authenticated
  if (PW_STORE.getItem(PW_SESSION_KEY) !== '1') {
    await new Promise(resolve => {
      const interval = setInterval(() => {
        if (PW_STORE.getItem(PW_SESSION_KEY) === '1') {
          clearInterval(interval);
          document.getElementById('loading-splash').style.display = '';
          resolve();
        }
      }, 100);
    });
  }
  // Exchange bank auth code FIRST — codes expire in ~30s, before Supabase loads
  const _urlParams  = new URLSearchParams(window.location.search);
  const _isBankAuth = _urlParams.get('bankauth') === '1';
  const _bankCode   = _urlParams.get('code');
  let   _bankTokens = null;
  if (_isBankAuth && _bankCode) {
    try { _bankTokens = await tlProxy('exchange_code', { code: _bankCode, redirect_uri: TL_REDIRECT }); }
    catch(e) { console.error('Early token exchange failed:', e); }
  }

  try {
    await loadFromSupabase();
    await checkRecurringExpenses();
    lastSyncTime = new Date();
    syncConnectionStatus = 'connected';
    subscribeRealtime();
  } catch (e) {
    console.error('Supabase load failed:', e);
    syncConnectionStatus = 'error';
    // Show nothing rather than stale or sample figures, and write nothing.
    loadError = e?.message || String(e);
    state.orders = [];
    state.transactions = [];
    setSyncStatus('error', 'Could not load data');
  }
  // Hide splash
  const splash = document.getElementById('loading-splash');
  splash.classList.add('hidden');
  setTimeout(() => splash.remove(), 500);

  if (_isBankAuth) {
    navigate('settings');
    await gcCompleteAuth(_bankTokens);
  } else {
    navigate('dashboard');
  }
})();
</script>
