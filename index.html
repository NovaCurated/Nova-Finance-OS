let orderSearch = '';
let orderFilter = 'all';     // all | review | missing | refunds | gifts | zero
const openOrders = new Set();
let editingOrderId = null;

function orderNet(o, c) { return c.revenue - refundTotal(o, c); }
function orderChips(o, c) {
  const chips = [];
  if (c.type !== 'sale') chips.push(`<span class="status-chip">${ORDER_TYPES[c.type]}</span>`);
  if (c.costMissing) chips.push(`<span class="status-chip err">Cost missing</span>`);
  const refs = refundsOf(o, c);
  if (refs.some(r => r.legacy)) chips.push(`<span class="status-chip warn">Refund — add details</span>`);
  else if (refs.length) chips.push(`<span class="status-chip">${fullyRefunded(o, c) ? 'Refunded' : 'Part refunded'}</span>`);
  return chips.join('');
}
function orderMatches(o, c, q) {
  if (q && !((o.customer || '').toLowerCase().includes(q) || (o.orderNum || '').toLowerCase().includes(q) || orderLines(o).some(l => l.sku.toLowerCase().includes(q)))) return false;
  const refs = refundsOf(o, c);
  switch (orderFilter) {
    case 'missing': return c.costMissing;
    case 'refunds': return refs.length > 0;
    case 'gifts': return c.type !== 'sale';
    case 'zero': return c.type === 'sale' && !(c.revenue > 0) && !o.orderType;
    case 'review': return c.costMissing || refs.some(r => r.legacy) || (c.type === 'sale' && !(c.revenue > 0) && !o.orderType);
    default: return true;
  }
}

function renderOrders(el, actions) {
  actions.innerHTML = `<button class="btn btn-primary" onclick="openAddOrder()">+ Add order</button>`;
  const chip = (k, l) => `<button class="chip" aria-pressed="${orderFilter === k}" onclick="orderFilter='${k}';updateOrderList();document.querySelectorAll('#order-chips .chip').forEach(c=>c.setAttribute('aria-pressed', c.dataset.k==='${k}'))" data-k="${k}">${l}</button>`;
  const unlocked = state.orders.filter(o => !o.costSnapshot && orderType(o) !== 'cancelled').length;
  el.innerHTML = `
    ${unlocked && schema.costSnapshot ? `<div class="review-bar"><div><span class="dot"></span>${unlocked} order${unlocked > 1 ? 's' : ''} without locked costs (e.g. new Shopify orders).</div><button class="btn btn-secondary btn-sm" onclick="openLockCosts()">Review &amp; lock</button></div>` : ''}
    ${schema.costSnapshot === false || schema.refunds === false ? `<div class="notice-list"><div class="notice warn">Run migration <code>002</code> to save locked costs, refund details and order types. Until then those actions are unavailable; everything else works.</div></div>` : ''}
    <div class="list">
      <div class="list-tools">
        <input class="search-input" type="search" id="order-search" placeholder="Search orders…" aria-label="Search orders" value="${esc(orderSearch)}" oninput="orderSearch=this.value;updateOrderList()">
        <div id="order-chips" style="display:flex;gap:6px;flex-wrap:wrap">${chip('all', 'All')}${chip('review', 'Needs review')}${chip('refunds', 'Refunds')}${chip('gifts', 'Gifts & samples')}</div>
        <span class="muted" style="font-size:13px" id="order-count"></span>
      </div>
      <div id="order-list"></div>
    </div>`;
  updateOrderList();
}

// Only the list re-renders while typing, so the search box keeps focus and cursor position.
function updateOrderList() {
  const list = document.getElementById('order-list');
  if (!list) return;
  const idx = postageIndex();
  const q = orderSearch.trim().toLowerCase();
  const rows = state.orders.map(o => ({ o, c: calcOrder(o, idx) })).filter(x => orderMatches(x.o, x.c, q))
    .sort((a, b) => (a.o.date < b.o.date ? 1 : a.o.date > b.o.date ? -1 : b.o.id - a.o.id));
  document.getElementById('order-count').textContent = `${rows.length} order${rows.length !== 1 ? 's' : ''}`;
  list.innerHTML = rows.length ? rows.map(({ o, c }) => orderRowHTML(o, c)).join('')
    : `<div class="empty-state"><div class="empty-state-text">No orders match.</div></div>`;
}

function orderRowHTML(o, c) {
  const open = openOrders.has(o.id);
  const items = orderLines(o).map(l => `${esc(l.sku)}${l.qty > 1 ? ` ×${l.qty}` : ''}`).join(', ');
  return `<button class="order-row" aria-expanded="${open}" onclick="toggleOrder(${o.id})">
      <span class="col-date">${fmtDate(o.date)}</span><span class="col-num"><strong>${esc(o.orderNum)}</strong></span>
      <span>${esc(o.customer)} ${orderChips(o, c)}<div class="sub">${items}</div></span>
      <span class="amt">${fmt(orderNet(o, c))}<div class="sub" style="font-weight:400">${refundTotal(o, c) > 0 ? `${fmt(refundTotal(o, c))} refunded` : c.costMissing ? 'contribution incomplete' : `contribution ${fmt(c.contribution)}`}</div></span>
      <span aria-hidden="true" style="color:var(--text-3)">${open ? '▴' : '▾'}</span>
    </button>${open ? orderDetailHTML(o, c) : ''}`;
}
function toggleOrder(id) { openOrders.has(id) ? openOrders.delete(id) : openOrders.add(id); updateOrderList(); }

function orderDetailHTML(o, c) {
  const refs = refundsOf(o, c);
  const lines = c.lines.map(l => `${esc(l.sku)} ×${l.qty} @ ${l.unit === null ? '<span class="neg-text">no cost</span>' : fmt(l.unit)}${l.source === 'rate' ? '' : ''}`).join('<br>');
  const can = { snap: schema.costSnapshot === true, ref: schema.refunds === true };
  return `<div class="order-detail">
    <div class="detail-grid">
      <div><span>Date</span>${fmtDateLong(o.date)}</div>
      <div><span>Channel</span>${c.channel === 'fold' ? `Fold ${Math.round(c.foldRate * 100)}%` : c.channel === 'direct' ? 'Direct' : 'Shopify'}</div>
      <div><span>Type</span>${ORDER_TYPES[c.type]}</div>
      <div><span>Sale value</span>${fmt(c.revenue)}</div>
      <div><span>Items &amp; unit cost</span>${lines}</div>
      <div><span>Scarf cost</span>${c.costMissing ? '<span class="neg-text">incomplete</span>' : fmt(c.productCost)}</div>
      <div><span>Postage</span>${fmt(c.postage)} ${c.postageMatched ? `(actual; estimate ${fmt(c.shipEst)})` : '(estimate)'}</div>
      <div><span>Platform fee</span>${fmt(c.fee)}</div>
      <div><span>Contribution at sale</span>${c.costMissing ? 'incomplete' : fmt(c.contribution)}</div>
      <div><span>Costs</span>${esc(snapshotLabel(o))}</div>
    </div>
    ${refs.length ? `<div style="margin-bottom:12px"><strong>Refunds</strong>${refs.map((r, i) => `<div style="font-size:13.5px;color:var(--text-2);margin-top:4px">
        ${r.legacy ? 'Marked refunded before details were recorded — treated as a full refund at the order date; stock not assumed returned. Add the real details.' :
        `${fmt(num(r.amount))} on ${fmtDateLong(r.date)} · ${r.paid_date ? `paid ${fmtDateLong(r.paid_date)}` : 'not yet paid'} · ${r.resaleable === true ? 'returned, resaleable' : r.resaleable === false ? 'returned, not resaleable' : 'no return recorded'}${num(r.return_postage) ? ` · return postage ${fmt(num(r.return_postage))}` : ''}`}
        ${!r.legacy && can.ref ? ` <button class="linkbtn" onclick="deleteRefund(${o.id},'${esc(r.id)}')">Remove</button>` : ''}</div>`).join('')}</div>` : ''}
    ${o.costSnapshot?.corrections?.length ? `<details style="margin-bottom:12px;font-size:13px"><summary>Cost corrections</summary>${o.costSnapshot.corrections.map(k => `<div style="margin-top:4px">${fmtDateLong(k.on)}: ${esc(k.reason)} — ${esc(k.summary || '')}</div>`).join('')}</details>` : ''}
    <div class="detail-actions">
      <button class="btn btn-secondary btn-sm" onclick="editOrder(${o.id})">Edit</button>
      ${c.type === 'sale' && c.revenue > 0 ? `<button class="btn btn-secondary btn-sm" ${can.ref ? '' : 'disabled title="Needs migration 002"'} onclick="openRefund(${o.id})">${refs.some(r => r.legacy) ? 'Add refund details' : 'Record refund'}</button>` : ''}
      <button class="btn btn-secondary btn-sm" ${can.snap ? '' : 'disabled title="Needs migration 002"'} onclick="openCorrectCosts(${o.id})">Correct costs</button>
      <button class="btn btn-danger btn-sm" onclick="deleteOrder(${o.id})">Delete</button>
    </div>
  </div>`;
}

function validateOrderForm(f, prev = null) {

// Re-reads the order before a change to refunds or locked costs, so another device's edits are never overwritten.
async function freshOrderRow(id) {
  const { data, error } = await sb.from('orders').select('*').eq('id', id).maybeSingle();
  if (error) throw new Error(error.message || 'could not re-read the order');
  if (!data) throw new Error('this order no longer exists (deleted on another device?)');
  return rowToOrder(data);
}
function sameJSON(a, b) { return JSON.stringify(a ?? null) === JSON.stringify(b ?? null); }
async function saveOrder() {
  if (writesBlocked()) throw new Error('data not loaded');
  const f = readOrderForm(); validateOrderForm(f);
  const o = { ...f, refunded: false, refunds: [] };
  o.costSnapshot = schema.costSnapshot ? buildSnapshot(o, 'recorded') : null;
  const res = failIf(await insertRecord('orders', { ...orderBaseRow(o), refunded: false, ...orderOptionalRow(o, ['cost_snapshot', 'order_type']) }));
  state.orders.push(rowToOrder({ ...res.data, cost_snapshot: res.data.cost_snapshot ?? o.costSnapshot, order_type: res.data.order_type ?? o.orderType }));

async function updateOrder(id) {

  const prev = state.orders.find(x => x.id === id);
  if (!prev) throw new Error('order not found');
  const f = readOrderForm(); validateOrderForm(f, prev);
  const fresh = await freshOrderRow(id);
  if (!sameJSON(fresh.costSnapshot, prev.costSnapshot) || !sameJSON(fresh.refunds, prev.refunds)) {
    Object.assign(prev, { costSnapshot: fresh.costSnapshot, refunds: fresh.refunds, refunded: fresh.refunded });
    throw new Error('costs or refunds on this order were changed on another device — check the latest values, then save again');
  }
  const next = { ...prev, ...f };
  next.costSnapshot = prev.costSnapshot ? snapshotAfterEdit(prev, next) : null;
  failIf(await updateRecord('orders', id, { ...orderBaseRow(next), ...orderOptionalRow(next, ['cost_snapshot', 'order_type']) }));
  Object.assign(prev, next);

}
async function deleteOrder(id) {

async function saveRefund(id) {
  if (writesBlocked()) throw new Error('data not loaded');
  const o = state.orders.find(x => x.id === id); if (!o) throw new Error('order not found');
  const c = calcOrder(o);
  const amount = parseFloat(document.getElementById('rf-amt').value);
  const date = document.getElementById('rf-date').value;
  if (!(amount > 0)) throw new Error('enter a refund amount');
  if (!isValidYMD(date)) throw new Error('enter the refund date');
  const fresh = await freshOrderRow(id);
  o.refunds = fresh.refunds; o.refunded = fresh.refunded;
  const already = (o.refunds || []).reduce((a, r) => a + num(r.amount), 0);
  if (already + amount > c.revenue + 0.005) throw new Error(`refunds would exceed the sale value (${fmt(c.revenue)})`);
  const paid = document.getElementById('rf-paid').checked;
  const paidDate = document.getElementById('rf-paid-date').value;
  if (paid && !isValidYMD(paidDate)) throw new Error('enter the date the refund was paid');
  const resale = document.getElementById('rf-resale').value;
  const returned = Array.from(document.querySelectorAll('.rf-ret')).map(i => ({ sku: i.dataset.sku, qty: parseInt(i.value) || 0 })).filter(x => x.qty > 0);
  const refund = { id: newUid(), amount: r2(amount), date, paid_date: paid ? paidDate : null, returned,
    resaleable: resale === 'yes' ? true : resale === 'no' ? false : null,
    fees_retained: r2(num(document.getElementById('rf-fee').value)), return_postage: r2(num(document.getElementById('rf-post').value)),
    note: document.getElementById('rf-note').value.trim(), recorded_at: new Date().toISOString() };
  const refunds = [...(o.refunds || []), refund];
  const full = refunds.reduce((a, r) => a + num(r.amount), 0) >= c.revenue - 0.005;
  failIf(await updateRecord('orders', id, { refunds, refunded: full }));
  o.refunds = refunds; o.refunded = full;
  closeModal(); toast('Refund recorded.'); renderView(currentView);
}
async function deleteRefund(id, refundId) {
  if (writesBlocked()) return;

}

async function saveCostCorrection(id) {

    summary: `${snapshotSummary(before)} → ${snapshotSummary(after)}` }];

// ── Review & lock: older and synced orders get costs from the rates on their own order dates ──
// Each is marked "estimated" unless you tick it as confirmed (checked against invoices). Nothing is
// claimed as confirmed automatically, and already-locked orders are never overwritten.
function lockCandidates() { return state.orders.filter(o => !o.costSnapshot && orderType(o) !== 'cancelled' && isValidYMD(o.date)).sort((a, b) => (a.date < b.date ? -1 : 1)); }
function openLockCosts() {
  if (schema.costSnapshot !== true) { toast('Run migration 002 first.'); return; }
  const hits = lockCandidates();
  if (!hits.length) { toast('All orders already have locked costs.'); return; }
  const rows = hits.map(o => { const s = buildSnapshot(o, 'estimated'); const missing = calcOrder(o).costMissing;
    return `<tr><td>${fmtDate(o.date)}</td><td>${esc(o.orderNum)}</td><td>${esc(snapshotSummary(s))}</td>
      <td style="text-align:center"><input type="checkbox" class="lk-conf" data-id="${o.id}" aria-label="Costs confirmed for ${esc(o.orderNum)}" ${missing ? 'disabled title="A product cost is missing"' : ''}></td></tr>`; }).join('');
  openFormModal('Review & lock costs on existing orders', `
    <p style="font-size:13.5px;color:var(--text-2);margin-bottom:10px">${hits.length} order${hits.length > 1 ? 's' : ''} will be locked with the costs <strong>in force on each order's date</strong>. Each is marked <strong>estimated</strong> unless you tick <em>Confirmed</em> because you've checked its costs. Already-locked orders are never overwritten. A backup is downloaded first.</p>
    <label class="checkbox-row" style="text-transform:none;letter-spacing:0;margin-bottom:8px"><input type="checkbox" id="lk-all" onchange="document.querySelectorAll('.lk-conf:not(:disabled)').forEach(c => c.checked = this.checked)"> Tick all as confirmed</label>
    <div style="max-height:46vh;overflow:auto;border:1px solid var(--border-light);border-radius:var(--radius)"><table class="mini-table"><thead><tr><th>Date</th><th>Order</th><th>Costs to lock</th><th>Confirmed</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${hits.some(o => calcOrder(o).costMissing) ? `<p class="form-hint neg-text" style="margin-top:8px">Orders with a missing product cost are locked without it and stay flagged — fix them with Correct costs.</p>` : ''}`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="lock-go" onclick="runSave(this, runLockBackup)">Download backup</button>`);
}
async function runLockBackup() {
  const ok = await exportBackup();
  if (!ok) throw new Error('the backup failed, so nothing was locked');
  const n = lockCandidates().length;
  document.getElementById('modal-body').insertAdjacentHTML('beforeend', `<div class="notice warn" style="margin-top:10px">Backup <strong>${esc(lastBackup.file)}</strong> sent to your browser — check it's in your Downloads before continuing.</div>`);
  document.getElementById('modal-footer').innerHTML = `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" id="lock-confirm" onclick="runSave(this, lockEstimatedCosts)">Backup saved — lock ${n} order${n !== 1 ? 's' : ''}</button>`;
}
async function lockEstimatedCosts() {
  if (writesBlocked()) throw new Error('data not loaded');
  const confirmed = new Set(Array.from(document.querySelectorAll('.lk-conf:checked')).map(c => parseInt(c.dataset.id, 10)));
  const hits = lockCandidates();
  let done = 0, conf = 0; const failed = [], noChange = [];
  suppressRealtime++;
  try {
    for (const o of hits) {
      const snap = buildSnapshot(o, confirmed.has(o.id) && !calcOrder(o).costMissing ? 'confirmed' : 'estimated');
      const { data, error } = await sb.from('orders').update({ cost_snapshot: snap }).eq('id', o.id).is('cost_snapshot', null).select('id');
      if (error) failed.push(o.orderNum || `#${o.id}`); else if (!data || !data.length) noChange.push(o.id);
      else { o.costSnapshot = snap; done++; if (snap.basis === 'confirmed') conf++; }
    }
  } finally { suppressRealtime--; }
  let skipped = 0;
  try { await loadFromSupabase(); noChange.forEach(id => { if (state.orders.find(x => x.id === id)?.costSnapshot) skipped++; else failed.push(`#${id}`); }); }
  catch (e) { noChange.forEach(id => failed.push(`#${id}`)); }
  const summary = `Locked ${done} order${done !== 1 ? 's' : ''} (${conf} confirmed, ${done - conf} estimated)${skipped ? ` · ${skipped} already locked elsewhere` : ''}`;
  if (failed.length) {
    document.getElementById('modal-title').textContent = 'Locking only partly saved';
    document.getElementById('modal-body').innerHTML = `<div class="notice err" data-testid="lock-partial">${summary}. <strong>${failed.length} NOT saved:</strong> ${failed.map(esc).join(', ')}. They still use the rates for their dates — run Review &amp; lock again to retry them.</div>`;
    document.getElementById('modal-footer').innerHTML = `<button class="btn btn-primary" onclick="closeModal()">Close</button>`;
    renderView(currentView); return;
  }
  closeModal(); renderView(currentView); toast(summary + '.');
}

        : `<p class="form-hint">Nothing to review.</p>`}
    </section>
    <div class="list">
      <div class="list-tools">
        <input class="search-input" type="search" id="tx-search" aria-label="Search expenses" placeholder="Search expenses…" value="${esc(txSearch)}" oninput="txSearch=this.value;updateTxList()">
        <span class="muted" style="font-size:13px" id="tx-count"></span>
      </div>
      <div id="tx-list"></div>
    </div>`;
  updateTxList();
  if (expenseFilter === 'postage') { document.getElementById('postage-review')?.scrollIntoView({ block: 'start' }); expenseFilter = 'all'; }
}

function updateTxList() {
  const list = document.getElementById('tx-list'); if (!list) return;
  const q = txSearch.trim().toLowerCase();
  const idx = postageIndex();
  const txs = state.transactions.filter(t => !q || t.description.toLowerCase().includes(q) || (t.category || '').toLowerCase().includes(q))
    .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id));
  document.getElementById('tx-count').textContent = `${txs.length} item${txs.length !== 1 ? 's' : ''}`;
  list.innerHTML = txs.map(t => {
    const dir = CAT_CFG[t.category]?.d;
    const info = idx.txInfo.get(t.id);
    const pchip = info ? (info.status === 'orders' ? `<span class="status-chip">Matched ${fmt(info.allocated)}</span>` : info.status === 'non_order' ? `<span class="status-chip">Not for an order</span>` : `<span class="status-chip warn">To review</span>`) : '';
    return `<div class="order-row" style="cursor:default">
      <span class="col-date">${fmtDate(t.date)}</span><span class="col-num"></span>
      <span>${esc(t.description)} ${t.category === 'Sales' ? '<span class="status-chip warn">Excluded</span>' : ''}${pchip}<div class="sub">${esc(t.category || 'No category')}</div></span>
      <span class="amt ${dir === 'In' ? 'pos-text' : ''}">${dir === 'In' ? '+' : ''}${fmt(t.amount)}</span>
      <span class="row-actions">
        <button class="edit-btn" onclick="editTx(${t.id})" aria-label="Edit">✎</button>
        <button class="edit-btn" onclick="copyTxToday(${t.id})" aria-label="Copy to today">⧉</button>
        <button class="delete-btn" onclick="deleteTx(${t.id})" aria-label="Delete">×</button>
      </span></div>`;
  }).join('') || `<div class="empty-state"><div class="empty-state-text">No expenses match.</div></div>`;
}

function categoryTreatmentHint(cat) {
  switch (cat) {
    case 'Sales': return 'Not counted in profit or cash — sales come from Orders. Record a sale as an order instead.';
    case 'Stock Purchases': return 'Adds to book stock (landed cost, incl. inbound shipping). Charged to profit as scarves are sold.';
    case 'Packaging': return 'Expensed when bought.';
    case 'Shipping & Postage': return 'Starts "to review". Match it to the order(s) it paid for so their estimates are replaced, or mark it as not for an order.';
    case 'Other Income': return 'Added below net profit.';
    case 'Loan Received': case 'Loan Repayment': return 'Financing — affects cash and the balance sheet, never sales or profit.';
    case 'Owner Investment': case 'Owner Drawings': return 'Your own money — affects cash and equity, never sales or profit.';
    default: return CAT_CFG[cat] ? 'Operating expense.' : '';
  }
}
function txFormHTML(t = null, preset = null) {
  const v = t || preset || {};
  return `<div class="form-grid">
    <div class="form-group"><label for="t-date">Date</label><input type="date" id="t-date" value="${v.date || londonToday()}"></div>
    <div class="form-group"><label for="t-amount">Amount (£)</label><input type="number" id="t-amount" step="0.01" min="0" value="${v.amount ?? ''}"></div>
    <div class="form-group full"><label for="t-desc">Description</label><input type="text" id="t-desc" value="${esc(v.description || '')}"></div>
    <div class="form-group full"><label for="t-cat">Category</label><select id="t-cat" onchange="document.getElementById('t-hint').textContent=categoryTreatmentHint(this.value)">
      ${CATEGORIES.map(c => `<option ${c === (v.category || 'Other Expenses') ? 'selected' : ''}>${c}</option>`).join('')}</select>
      <p class="form-hint" id="t-hint">${categoryTreatmentHint(v.category || 'Other Expenses')}</p></div>
  </div>`;
}
function readTxForm() {
  const t = { date: document.getElementById('t-date').value, description: document.getElementById('t-desc').value.trim(),
              amount: parseFloat(document.getElementById('t-amount').value), category: document.getElementById('t-cat').value };
  if (!isValidYMD(t.date) || !t.description || !(t.amount > 0)) throw new Error('fill in the date, description and a valid amount');
  t.amount = r2(t.amount);
  return t;
}
function openAddTx(preset = null) {
  editingTxId = null;
  openFormModal('Add expense', txFormHTML(null, preset),
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="runSave(this, saveTx)">Add</button>`);
}
function editTx(id) {
  const t = state.transactions.find(x => x.id === id); if (!t) return;
  editingTxId = id;
  openFormModal('Edit expense', txFormHTML(t),
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="runSave(this, () => updateTx(${id}))">Save changes</button>`);
}
async function createTx(t) {
  const res = await insertRecord('transactions', txBaseRow(t));
  if (res.error) return res;
  const tx = rowToTx(res.data);
  state.transactions.push(tx);
  return { data: tx };
}
async function saveTx() {
  if (writesBlocked()) throw new Error('data not loaded');
  const t = readTxForm();
  failIf(await createTx(t));
  closeModal(); toast('Saved.'); renderView(currentView);
}
async function updateTx(id) {
  if (writesBlocked()) throw new Error('data not loaded');
  const t = readTxForm();
  failIf(await updateRecord('transactions', id, txBaseRow(t)));
  Object.assign(state.transactions.find(x => x.id === id), t);
  closeModal(); toast('Updated.'); renderView(currentView);
}
async function copyTxToday(id) {
  if (writesBlocked() || _busy) return;
  const o = state.transactions.find(x => x.id === id); if (!o) return;
  _busy = true;
  try {
    const res = await createTx({ date: londonToday(), description: o.description, category: o.category, amount: o.amount });
    if (res.error) toast('Not saved — ' + res.error.message); else { toast(`Copied "${o.description}" to today.`); renderView(currentView); }
  } finally { _busy = false; }
}
async function deleteTx(id) {
  if (writesBlocked()) return;
  if (!confirm('Delete this transaction?')) return;
  const res = await deleteRecord('transactions', id);
  if (res.error) { toast('Delete FAILED — ' + res.error.message); return; }
  state.transactions = state.transactions.filter(t => t.id !== id);
  toast('Deleted.'); renderView(currentView);
}

// ── Expected subscriptions ─────────────────────────
function confirmExpected(key) {
  const x = expectedItems().find(i => i.key === key); if (!x) return;
  openAddTx({ date: x.due, description: x.description, category: x.category, amount: x.amount });
  document.getElementById('modal-title').textContent = 'Confirm subscription payment';
}
async function skipExpected(key) {
  const next = { ...(recurringState || {}), [key]: 'skipped' };
  failIf(await saveSettingsRow('recurring_review', next));
  recurringState = next; renderView(currentView);
}

// ── Postage matching (explicit; never automatic) ───
function openMatchPostage(txId) {
  const t = state.transactions.find(x => x.id === txId); if (!t) return;
  const idx = postageIndex();
  const from = addDays(t.date, -21), to = addDays(t.date, 7);
  const cands = state.orders.filter(o => orderType(o) !== 'cancelled' && isValidYMD(o.date) && o.date >= from && o.date <= to && o.date <= londonToday())
    .sort((a, b) => (a.date < b.date ? 1 : -1));
  openFormModal('Match postage payment', `
    <p style="font-size:13.5px;color:var(--text-2);margin-bottom:10px"><strong>${esc(t.description)}</strong> · ${fmt(t.amount)} paid ${fmtDateLong(t.date)}.
      Tick the order(s) this paid for and enter each one's share. Orders are listed from 3 weeks before to 1 week after the payment — nothing is matched automatically.</p>
    <div style="max-height:44vh;overflow:auto">${cands.map(o => { const c = calcOrder(o, idx);
      return `<label class="checkbox-row" style="text-transform:none;letter-spacing:0;padding:6px 0;border-bottom:1px solid var(--border-light)">
        <input type="checkbox" class="mp-chk" data-id="${o.id}" onchange="mpSum(${t.amount})">
        <span style="flex:1">${fmtDate(o.date)} ${esc(o.orderNum)} ${esc(o.customer)} <span class="muted">· est. ${fmt(c.shipEst)}${c.postageMatched ? ` · already matched ${fmt(c.postageActual)}` : ''}</span></span>
        <input type="number" class="mp-amt" data-id="${o.id}" step="0.01" min="0" value="${c.shipEst.toFixed(2)}" style="width:84px" oninput="mpSum(${t.amount})" aria-label="Amount for ${esc(o.orderNum)}"></label>`; }).join('') || '<p class="form-hint">No orders around this date.</p>'}</div>
    <p id="mp-sum" style="margin-top:10px;font-size:13.5px"></p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="runSave(this, () => savePostageMatch(${txId}))">Save match</button>`);
  mpSum(t.amount);
}
function mpSum(total) {
  let s = 0;
  document.querySelectorAll('.mp-chk').forEach(ch => { if (ch.checked) s += num(document.querySelector(`.mp-amt[data-id="${ch.dataset.id}"]`).value); });
  const el = document.getElementById('mp-sum'); if (!el) return;
  const left = total - s;
  el.innerHTML = `Matched ${fmt(s)} of ${fmt(total)}${Math.abs(left) < 0.005 ? '' : left > 0 ? ` · ${fmt(left)} stays as postage not linked to orders` : ` · <span class="neg-text">${fmt(-left)} more than the payment</span>`}`;
}
async function savePostageMatch(txId) {
  if (writesBlocked()) throw new Error('data not loaded');
  const t = state.transactions.find(x => x.id === txId); if (!t) throw new Error('payment not found');
  const allocations = [];
  document.querySelectorAll('.mp-chk').forEach(ch => { if (ch.checked) allocations.push({ order_id: parseInt(ch.dataset.id, 10), amount: r2(num(document.querySelector(`.mp-amt[data-id="${ch.dataset.id}"]`).value)) }); });
  if (!allocations.length) throw new Error('tick at least one order, or use "Not for an order"');
  const total = allocations.reduce((a, x) => a + x.amount, 0);
  if (total > num(t.amount) + 0.005) throw new Error('the matched amounts are more than the payment');
  const review = { status: 'orders', allocations, reviewed_on: londonToday() };
  failIf(await updateRecord('transactions', txId, { postage_review: review }));
  t.postageReview = review;
  closeModal(); toast('Postage matched.'); renderView(currentView);
}
async function markNonOrderPostage(txId) {
  if (writesBlocked()) throw new Error('data not loaded');
  const t = state.transactions.find(x => x.id === txId); if (!t) return;
  const review = { status: 'non_order', allocations: [], reviewed_on: londonToday() };
  failIf(await updateRecord('transactions', txId, { postage_review: review }));
  t.postageReview = review; toast('Marked as not for a customer order.'); renderView(currentView);
}

function renderReports(el) {
  const today = londonToday();

  const tab = (k, l) => `<button role="tab" aria-selected="${reportsTab === k}" onclick="reportsTab='${k}';renderView('reports')">${l}</button>`;

const plHead = label => `<div class="pl-row section-header"><span>${label}</span></div>`;

    ${plHead('Operating expenses')}
    ${OPEX_CATS.map(c => p.opex[c] ? plRow(esc(c), -p.opex[c], '', true) : '').join('') || `<div class="pl-row"><span style="padding-left:28px;color:var(--text-3)">None in this period</span></div>`}

let settingsDraftBase = null;   // saved settings the draft started from
function draft() { if (!settingsDraft) { settingsDraft = clone(state.settings); settingsDraftBase = clone(state.settings); } return settingsDraft; }

function setDraft(path, value) {

  for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];

// ═══════════════════════════════════════════════════
// APPLY COST CHANGE — one workflow for dated rates and corrections to saved orders
// ═══════════════════════════════════════════════════
//  A. Forward only (default): the new cost goes into the dated rate history from an effective date.
//     Saved (locked) orders keep their costs.
//  B. Apply to existing orders too: the chosen cost component is updated on matching orders in an
//     order-date range — nothing else on those orders changes — and a correction (previous cost, new
//     cost, dates, reason) is recorded on each. The new default applies from its own effective date.
//  Stock-purchase payments and bank transactions are never touched.

function costChanges(base, next) {
  const out = [];
  const today = londonToday();
  const cmp = (bList, nList, key, kind) => (nList || []).forEach(n => {
    const b = (bList || []).find(x => x.uid && x.uid === n.uid);
    const was = b ? validCost(rateOn(historyOf(b), today)?.cost) : null, now = validCost(n.cost);
    if (b && now !== null && was !== null && Math.abs(now - was) > 1e-9) out.push({ kind, uid: n.uid, label: n[key], was, now });
  });
  cmp(base.skuCosts, next.skuCosts, 'sku', 'sku');
  cmp(base.shippingMethods, next.shippingMethods, 'method', 'ship');
  const bDef = num(rateOn(historyOf({ history: base.defaultShippingHistory, cost: base.defaultShipping }), today)?.cost);
  if (Math.abs(num(next.defaultShipping) - bDef) > 1e-9) out.push({ kind: 'defship', label: 'Default shipping', was: bDef, now: num(next.defaultShipping) });
  const bFee = feesOn(today, base);
  if (Math.abs(num(next.shopifyFeeRate) - bFee.rate) > 1e-9 || Math.abs(num(next.shopifyFixedFee) - bFee.fixed) > 1e-9)
    out.push({ kind: 'fee', label: 'Shopify fee', was: bFee, now: { rate: num(next.shopifyFeeRate), fixed: num(next.shopifyFixedFee) } });
  return out;
}
// Writes each change into its dated history from ch.eff (or fromDate). Entries on/after that date are replaced.
function applyCostChanges(next, base, changes, fromDate) {
  const today = londonToday();
  changes.forEach(ch => {
    const from = ch.eff || fromDate;
    const meta = { set_on: today, ...(ch.reason ? { reason: ch.reason } : {}), ...(ch.mode === 'existing' ? { applied_to_orders: { from: ch.from, to: ch.to } } : {}) };
    const put = (hist, entry) => sortedHistory([...hist.filter(h => h.from < from), { from, ...entry, ...meta }]);
    if (ch.kind === 'sku' || ch.kind === 'ship') {
      const key = ch.kind === 'sku' ? 'skuCosts' : 'shippingMethods';
      const e = next[key].find(x => x.uid === ch.uid), b = base[key].find(x => x.uid === ch.uid);
      e.history = put(historyOf(b), { cost: ch.now }); e.cost = validCost(rateOn(e.history, today).cost);
    } else if (ch.kind === 'defship') {
      next.defaultShippingHistory = put(historyOf({ history: base.defaultShippingHistory, cost: base.defaultShipping }), { cost: ch.now });
      next.defaultShipping = num(rateOn(next.defaultShippingHistory, today).cost);
    } else {
      const prev = Array.isArray(base.feeHistory) && base.feeHistory.length ? sortedHistory(base.feeHistory) : [{ from: EPOCH, rate: base.shopifyFeeRate, fixed: base.shopifyFixedFee }];
      next.feeHistory = put(prev, { rate: ch.now.rate, fixed: ch.now.fixed });
      const t = rateOn(next.feeHistory, today); next.shopifyFeeRate = num(t.rate); next.shopifyFixedFee = num(t.fixed);
    }
  });
  return next;
}
function withSettings(s, fn) { const keep = state.settings; state.settings = s; try { return fn(); } finally { state.settings = keep; } }
function withTrial(orders, settings, fn) {
  const ko = state.orders, ks = state.settings; state.orders = orders; state.settings = settings;
  try { return fn(); } finally { state.orders = ko; state.settings = ks; }
}

// ── Cost components on orders ──
function componentNames(ch, s = state.settings) {
  if (ch.kind !== 'sku' && ch.kind !== 'ship') return [];
  const key = ch.kind === 'sku' ? 'skuCosts' : 'shippingMethods', f = ch.kind === 'sku' ? 'sku' : 'method';
  const e = (s[key] || []).find(x => x.uid === ch.uid);
  return [...new Set([e?.[f], ch.label, ...(e?.aliases || [])].filter(Boolean))];
}
function orderUsesComponent(o, ch, names, base) {
  if (orderType(o) === 'cancelled' || !isValidYMD(o.date)) return false;
  if (ch.kind === 'sku') return orderLines(o).some(l => names.includes(l.sku));
  if (ch.kind === 'ship') return names.includes(o.shippingMethod);
  if (ch.kind === 'defship') return !o.shippingMethod || !findShipEntry(o.shippingMethod, base);
  return orderChannel(o) === 'shopify';
}
function componentOf(snap, ch, names) {
  if (ch.kind === 'sku') { const l = (snap.lines || []).find(x => names.includes(x.sku)); return l ? validCost(l.unit_cost) : null; }
  if (ch.kind === 'fee') return { rate: num(snap.fees?.shopify_rate), fixed: num(snap.fees?.shopify_fixed) };
  return num(snap.shipping?.estimate ?? snap.shipping?.cost);
}
function sameComponent(a, b, ch) {
  if (ch.kind === 'fee') return !!a && Math.abs(a.rate - b.rate) < 1e-9 && Math.abs(a.fixed - b.fixed) < 0.0005;
  return a !== null && a !== undefined && Math.abs(a - b) < 0.0005;
}
function withComponent(snap, ch, names, o) {
  const s = clone(snap);
  if (ch.kind === 'sku') s.lines = s.lines.map(l => names.includes(l.sku) ? { ...l, unit_cost: r2(ch.now) } : l);
  else if (ch.kind === 'fee') s.fees = { shopify_rate: ch.now.rate, shopify_fixed: r2(ch.now.fixed) };
  else s.shipping = { ...(s.shipping || {}), method: o.shippingMethod || null, estimate: r2(ch.now) };
  return s;
}
function fmtComp(v, ch) {
  if (ch.kind === 'fee') return v ? `${fmtPct(v.rate)} + ${fmt(v.fixed)}` : '—';
  return v === null || v === undefined ? 'no cost' : fmt(v);
}
function componentTitle(ch) {
  return ch.kind === 'sku' ? `${ch.label} landed cost per unit` : ch.kind === 'ship' ? `${ch.label} postage estimate` : ch.kind === 'defship' ? 'Default postage estimate' : 'Shopify fee';
}
function firstOrderDate() { return state.orders.map(o => o.date).filter(isValidYMD).sort()[0] || null; }

// Matching saved orders in the chosen range whose cost would actually change (option B).
function existingHits(ch, base = state.settings) {
  const names = componentNames(ch, base);
  return state.orders.filter(o => orderUsesComponent(o, ch, names, base) && o.date >= ch.from && o.date <= ch.to).map(o => {
    const snap = o.costSnapshot ? o.costSnapshot : buildSnapshot(o, 'estimated', base);
    const before = componentOf(snap, ch, names);
    return { o, snap, before, locked: !!o.costSnapshot };
  }).filter(t => !sameComponent(t.before, ch.now, ch));
}
function updatesDefault(ch) { return !(ch.mode === 'existing' && ch.keepDefault); }

// Preview using the real report engine on a trial copy of orders and settings.
function costChangeImpact(ch) {
  const today = londonToday(), base = state.settings;
  const names = componentNames(ch, base);
  const trialS = updatesDefault(ch) ? applyCostChanges(clone(base), base, [ch]) : base;
  let trialO = state.orders, hits = [];
  if (ch.mode === 'existing') {
    hits = existingHits(ch, base);
    const m = new Map(hits.map(t => [t.o.id, t]));
    trialO = state.orders.map(o => m.has(o.id) ? { ...o, costSnapshot: withComponent(m.get(o.id).snap, ch, names, o) } : o);
  }
  const from = ch.mode === 'existing' ? ch.from : ch.eff;
  const to = ch.mode === 'existing' ? (ch.to > today ? today : ch.to) : today;
  const hasPeriod = from <= to;
  const rep = () => { const R = computeReport({ kind: 'custom', from, to, label: '' }, today); return { c: R.contribution, op: R.operatingProfit }; };
  const allOp = () => computeReport(allTimeRange(today), today).operatingProfit;
  const before = hasPeriod ? rep() : { c: 0, op: 0 }, after = hasPeriod ? withTrial(trialO, trialS, rep) : before;
  const allDelta = withTrial(trialO, trialS, allOp) - allOp();
  const targetIds = new Set(hits.map(t => t.o.id));
  const was = new Map(state.orders.map(o => [o.id, calcOrder(o).contribution]));
  const repriced = withTrial(trialO, trialS, () => trialO.filter(o => !o.costSnapshot && !targetIds.has(o.id) && Math.abs(calcOrder(o).contribution - was.get(o.id)) > 0.004));
  const lockedKept = state.orders.filter(o => o.costSnapshot && !targetIds.has(o.id) && orderUsesComponent(o, ch, names, base) && o.date >= ch.eff).length;
  return { from, to, hasPeriod, before, after, dC: after.c - before.c, dOp: after.op - before.op, allDelta,
           hits, newlyLocked: hits.filter(t => !t.locked).length, repriced: repriced.length, lockedKept,
           refundsTouched: hits.filter(t => refundsOf(t.o).length).length };
}

  changes.forEach((_, i) => ccSet(i));
}

  const money = `contribution ${fmt(imp.before.c)} → ${fmt(imp.after.c)} (<strong>${deltaMoney(imp.dC)}</strong>), net profit ${fmt(imp.before.op)} → ${fmt(imp.after.op)} (<strong>${deltaMoney(imp.dOp)}</strong>) for ${range}`;

    if (imp.refundsTouched) parts.push(`${imp.refundsTouched} ha${imp.refundsTouched === 1 ? 's' : 've'} refunds; returned stock is revalued at the new cost, refund records are unchanged.`);

async function confirmApplyCostChange() {
  if (writesBlocked()) throw new Error('data not loaded');
  const job = _costJob; if (!job) throw new Error('nothing to apply');
  job.changes.forEach((_, i) => ccRead(i));
  job.changes.forEach((ch, i) => { const p = ccProblem(ch); if (p) throw needInput(`${p} (${componentTitle(ch)})`, `cc-eff-${i}`); });
  job.changes.forEach((ch, i) => { if (ch.mode === 'existing' && !ch.reason) throw needInput(`enter a reason for changing existing orders (${componentTitle(ch)})`, `cc-reason-${i}`); });
  job.base = clone(state.settings);
  job.plans = job.changes.filter(ch => ch.mode === 'existing').map(ch => ({ ch, names: componentNames(ch, job.base), ids: existingHits(ch, job.base).map(t => t.o.id) }));
  // 1. Settings (the dated rate history). If this fails nothing has changed.
  const def = job.changes.filter(updatesDefault);
  if (def.length) {
    const next = applyCostChanges(clone(job.direct ? state.settings : draft()), state.settings, def);
    await persistSettings(next, { checkDraftBase: !job.direct });
  }
  job.settingsSaved = def.length > 0;
  // 2. Saved orders (option B), one at a time; failures are listed and can be retried.
  await applyCostToOrders(job);
  finishCostJob(job);
}
async function applyCostToOrders(job, onlyFailed = false) {
  const today = londonToday();
  const prevFailed = new Set((job.failed || []).map(f => `${f.plan}:${f.id}`));
  job.failed = []; job.done = job.done || 0; job.unchanged = job.unchanged || 0;
  suppressRealtime++;
  try {
    for (let pi = 0; pi < job.plans.length; pi++) {
      const { ch, names, ids } = job.plans[pi];
      for (const id of ids) {
        if (onlyFailed && !prevFailed.has(`${pi}:${id}`)) continue;
        const local = state.orders.find(x => x.id === id);
        try {
          const fresh = await freshOrderRow(id);
          if (orderType(fresh) === 'cancelled' || !(fresh.date >= ch.from && fresh.date <= ch.to)) { job.unchanged++; continue; }
          const snap0 = fresh.costSnapshot ? clone(fresh.costSnapshot) : buildSnapshot(fresh, 'estimated', job.base);
          const before = componentOf(snap0, ch, names);
          if (sameComponent(before, ch.now, ch)) { if (local) local.costSnapshot = fresh.costSnapshot; job.unchanged++; continue; }
          const after = withComponent(snap0, ch, names, fresh);
          after.corrections = [...(snap0.corrections || []), {
            on: today, type: 'cost_change', reason: ch.reason, component: componentTitle(ch), field: ch.kind,
            before, after: ch.now, orders_from: ch.from, orders_to: ch.to, default_from: updatesDefault(ch) ? ch.eff : null,
            locked_now: !fresh.costSnapshot, summary: `${componentTitle(ch)}: ${fmtComp(before, ch)} → ${fmtComp(ch.now, ch)} (orders ${fmtDate(ch.from)}–${fmtDate(ch.to)})` }];
          const res = await updateRecord('orders', id, { cost_snapshot: after });
          if (res.error) throw new Error(res.error.message || 'database error');
          if (local) local.costSnapshot = after;
          job.done++;
        } catch (e) { job.failed.push({ plan: pi, id, orderNum: local?.orderNum || `#${id}`, msg: e.message || 'not saved' }); }
      }
    }
  } finally { suppressRealtime--; }
  setSyncStatus(job.failed.length ? 'error' : 'synced', job.failed.length ? 'Some orders not saved' : 'Saved');
}
function finishCostJob(job) {
  const total = job.plans.reduce((a, p) => a + p.ids.length, 0);
  if (!job.failed.length) {
    closeModal(); _costJob = null;
    const bits = [job.settingsSaved ? 'Cost change saved' : 'Saved', total ? `${job.done} order${job.done !== 1 ? 's' : ''} updated` : ''].filter(Boolean);
    toast(bits.join(' · ') + '.');
    document.getElementById('page-subtitle').textContent = pageSubtitle();
    renderView(currentView);
    return;
  }
  // Partially completed: say exactly what was and wasn't saved, and offer a retry for the failures only.
  document.getElementById('modal-title').textContent = 'Cost change only partly saved';
  document.getElementById('modal-body').innerHTML = `<div class="notice err" data-testid="cc-partial">
      ${job.settingsSaved ? 'The new cost for new orders <strong>was saved</strong>. ' : ''}<strong>${job.done} of ${total}</strong> order${total !== 1 ? 's were' : ' was'} updated${job.unchanged ? ` (${job.unchanged} already had this cost)` : ''};
      <strong>${job.failed.length} NOT saved</strong>. Reports currently use the old cost for ${job.failed.length === 1 ? 'that order' : 'those orders'}.</div>
    <ul style="margin:10px 0 0 18px;font-size:13.5px">${job.failed.map(f => `<li>${esc(f.orderNum)} — ${esc(f.msg)}</li>`).join('')}</ul>`;
  document.getElementById('modal-footer').innerHTML = `<button class="btn btn-ghost" onclick="closeModal();renderView(currentView)">Close</button>
    <button class="btn btn-primary" id="cc-retry" onclick="runSave(this, retryCostOrders)">Retry ${job.failed.length} order${job.failed.length !== 1 ? 's' : ''}</button>`;
  renderView(currentView);
}

async function saveSettings(btn) {
  if (writesBlocked()) return;
  const d = draft();
  // renames keep the old name so past orders keep matching
  [['skuCosts', 'sku'], ['shippingMethods', 'method']].forEach(([list, key]) => (d[list] || []).forEach(e => {
    const b = (state.settings[list] || []).find(x => x.uid === e.uid);

  const strip = x => { const y = clone(x); delete y.bankConfig; delete y.bankBalances; return JSON.stringify(y); };
  if (checkDraftBase && settingsDraftBase && strip(settingsDraftBase) !== strip(state.settings))
    throw new Error('settings were changed on another device since you started editing. Discard, then make your change again — nothing was saved');
  const d = clone(next);
  d.bankConfig = clone(state.settings.bankConfig); d.bankBalances = clone(state.settings.bankBalances);

  setSyncStatus('synced', 'Saved');

  try { await persistSettings(draft()); }
  catch (e) { settingsDraftError = e.message.replace(/ — nothing was saved$/, ''); renderView('settings'); return; }

  document.getElementById('page-subtitle').textContent = pageSubtitle();
  renderView('settings');
}

      span.className = 'sync-info-value ' + (v === APP_VERSION ? 'ok' : 'warn');
    });
  }
}

// ── Backup export ───────────────────────────────────
// Reads fresh copies from the database (not the screen), strips bank secrets, verifies the
// JSON round-trips, and only reports success once the download has been handed to the browser.
const SECRET_KEY_RE = /token|secret|password|expires/i;

function stripSecrets(v) {
  if (Array.isArray(v)) return v.map(stripSecrets);
  if (v && typeof v === 'object') {
    const out = {};
    for (const [k, val] of Object.entries(v)) { if (!SECRET_KEY_RE.test(k)) out[k] = stripSecrets(val); }
    return out;
  }
  return v;
}

async function exportBackup() {
  try {
    setSyncStatus('syncing', 'Preparing backup…');
    const [orders, transactions, settingsRows] = await Promise.all([
      fetchAllRows('orders', 'id'),
      fetchAllRows('transactions', 'id'),
      fetchAllRows('settings', 'key'),
    ]);
    const settings = settingsRows.map(r => ({ ...r, value: stripSecrets(r.value) }));
    const stamp = londonToday();
    const payload = {
      format: 'nova-finance-backup', format_version: 1,
      app_version: APP_VERSION, exported_at: new Date().toISOString(), exported_on: stamp, timezone: LONDON_TZ,
      source: SUPABASE_URL,
      counts: { orders: orders.length, transactions: transactions.length, settings: settings.length },
      excluded: 'Bank access/refresh tokens and token expiry fields are removed from settings.',
      orders, transactions, settings,
    };
    const json = JSON.stringify(payload, null, 2);
    const check = JSON.parse(json);
    if (check.orders.length !== orders.length || check.transactions.length !== transactions.length) throw new Error('verification failed');
    if (/"(accessToken|refreshToken|access_token|refresh_token)"/.test(JSON.stringify(check.settings))) throw new Error('bank token still present');

    const file = `nova-finance-backup-${stamp}.json`;
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = file; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);

    lastBackup = { at: new Date(), file, counts: payload.counts };
    setSyncStatus('synced', 'Backup ready');
    toast(`Backup downloaded: ${file} — ${orders.length} orders, ${transactions.length} transactions`);
    if (currentView === 'sync' || currentView === 'settings') renderView(currentView);
    return true;
  } catch (e) {
    console.error('Backup failed:', e);
    setSyncStatus('error', 'Backup failed');
    toast('Backup FAILED — nothing was downloaded. ' + (e?.message || ''));
    return false;
  }
}

const TL_PROXY    = `${SUPABASE_URL}/functions/v1/truelayer-proxy`;
const TL_REDIRECT = 'https://novacurated.github.io/Nova-Finance-OS/?bankauth=1';

// Auto-categorisation rules — add more as needed
const BANK_RULES = [
  { keywords: ['ADOBE'],                  description: 'Adobe Illustrator Monthly Cost', category: 'Software & Subscriptions' },
  { keywords: ['SHOPIFY'],                description: 'Shopify Website Monthly Cost',   category: 'Software & Subscriptions' },
  { keywords: ['CANVA'],                  description: 'Canva Monthly Cost',             category: 'Software & Subscriptions' },
  { keywords: ['GOOGLE'],                 description: 'Google Services',                category: 'Software & Subscriptions' },
  { keywords: ['ROYAL MAIL', 'RM GROUP'], description: 'Postage & Delivery',            category: 'Shipping & Postage' },
  { keywords: ['DPD', 'EVRI', 'HERMES', 'PARCELFORCE'], description: 'Courier Delivery', category: 'Shipping & Postage' },
  { keywords: ['AMAZON', 'AMZN'],         description: 'Amazon Purchase',                category: 'Other Expenses' },
  { keywords: ['META', 'FACEBOOK ADS', 'INSTAGRAM'], description: 'Social Media Ads',   category: 'Marketing & Advertising' },
];

let _pendingBankTxs = [];

function gcMatchRule(raw) {
  const up = raw.toUpperCase();
  return BANK_RULES.find(r => r.keywords.some(k => up.includes(k))) || null;
}

async function tlProxy(action, params = {}) {
  const res = await fetch(TL_PROXY, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'apikey': SUPABASE_KEY,
    },
    body: JSON.stringify({ action, ...params }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'TrueLayer proxy error');
  return data;
}

async function gcEnsureToken() {
  const cfg = state.settings.bankConfig || {};
  const now = Date.now();
  if (cfg.accessToken && (cfg.accessExpires || 0) > now + 60000) return;
  if (!cfg.refreshToken) throw new Error('Not connected to bank. Please reconnect.');
  const d = await tlProxy('refresh_token', { refresh_token: cfg.refreshToken });
  if (!d.access_token) throw new Error(d.error || 'Failed to refresh token. Please reconnect.');
  cfg.accessToken   = d.access_token;
  cfg.accessExpires = now + (d.expires_in || 3600) * 1000;
  if (d.refresh_token) cfg.refreshToken = d.refresh_token;
  state.settings.bankConfig = cfg;
  await dbSaveSettings();
}

async function gcConnectBank() {
  const clientId = document.getElementById('gc-id')?.value?.trim();
  if (!clientId) { toast('Enter your TrueLayer Client ID first.'); return; }
  state.settings.bankConfig = { ...state.settings.bankConfig, clientId };
  await dbSaveSettings();
  const authUrl = 'https://auth.truelayer-sandbox.com/'
    + '?response_type=code'
    + '&client_id=' + encodeURIComponent(clientId)
    + '&scope=' + encodeURIComponent('accounts transactions balance offline_access')
    + '&redirect_uri=' + encodeURIComponent(TL_REDIRECT)
    + '&providers=mock';
  window.location.href = authUrl;
}

async function gcCompleteAuth(preTokens = null) {
  if (writesBlocked()) return;
  const urlParams = new URLSearchParams(window.location.search);
  const code      = urlParams.get('code');
  if (!code) { toast('No auth code received — please try connecting again.'); return; }
  try {
    setSyncStatus('syncing', 'Completing bank setup…');
    // the boot sequence already exchanged the one-time code; reuse those tokens instead of exchanging it twice
    const d = preTokens && preTokens.access_token ? preTokens : await tlProxy('exchange_code', { code, redirect_uri: TL_REDIRECT });
    if (!d.access_token) throw new Error(d.error || 'Token exchange failed.');
    const cfg = state.settings.bankConfig || {};
    const now = Date.now();
    cfg.accessToken   = d.access_token;
    cfg.accessExpires = now + (d.expires_in || 3600) * 1000;
    cfg.refreshToken  = d.refresh_token;
    // Get account list to find account ID
    const accounts = await tlProxy('get_accounts', { access_token: d.access_token });
    const account  = accounts.results?.[0];
    if (!account) throw new Error('No accounts found.');
    cfg.accountId       = account.account_id;
    cfg.institutionName = account.provider?.display_name || account.display_name || 'Bank';
    state.settings.bankConfig = cfg;
    await dbSaveSettings();
    setSyncStatus('synced', 'Bank connected');
    toast('Bank connected ✓');
    window.history.replaceState({}, '', window.location.pathname);
    renderView('settings');
  } catch (e) {
    setSyncStatus('error', 'Setup failed');
    toast('Bank setup failed: ' + e.message);
  }
}

async function gcFetchTransactions() {
  const cfg = state.settings.bankConfig || {};
  if (!cfg.accountId) { toast('No bank account connected.'); return; }
  try {
    setSyncStatus('syncing', 'Fetching transactions…');
    await gcEnsureToken();
    const dateFrom = cfg.lastSync
      || addDays(londonToday(), -60);
    const data = await tlProxy('get_transactions', {
      access_token: cfg.accessToken,
      account_id:   cfg.accountId,
      date_from:    dateFrom,
    });
    const txs = data.results || [];
    // Keep debits only (amount < 0 = money out)
    const debits = txs.filter(t => (t.amount || 0) < 0);
    // Exclude anything already in the app (same date + same amount within 1p)
    const pending = debits.filter(bt => {
      const d = bt.timestamp?.slice(0, 10);
      const a = Math.abs(bt.amount);
      return !state.transactions.some(t => t.date === d && Math.abs(t.amount - a) < 0.01);
    });
    setSyncStatus('synced', 'Synced');
    if (!pending.length) { toast('No new transactions to review.'); return; }
    _pendingBankTxs = pending;
    showBankReviewModal();
  } catch (e) {
    setSyncStatus('error', 'Fetch failed');
    toast('Failed to fetch transactions: ' + e.message);
  }
}

async function logBankTransactions() {
  const checks = document.querySelectorAll('.gc-chk');
  const descs  = document.querySelectorAll('.gc-desc');
  const cats   = document.querySelectorAll('.gc-cat');
  if (writesBlocked() || _busy) return;
  _busy = true;
  document.querySelectorAll('#modal-footer button').forEach(b => b.disabled = true);
  let added = 0, failedBank = 0;
  for (let i = 0; i < _pendingBankTxs.length; i++) {
    if (!checks[i]?.checked) continue;
    const bt     = _pendingBankTxs[i];
    const amount = Math.abs(bt.amount || 0);
    const date   = bt.timestamp?.slice(0, 10) || londonToday();
    const res = await createTx({ date, description: descs[i]?.value?.trim() || 'Bank Transaction', category: cats[i]?.value || 'Other Expenses', amount: r2(amount) });
    if (res.error) failedBank++; else added++;
  }
  if (added > 0) {
    state.settings.bankConfig.lastSync = londonToday();
    await dbSaveSettings();
  }
  _busy = false;
  closeModal();
  renderView('expenses');
  toast(`Logged ${added} transaction${added !== 1 ? 's' : ''}${failedBank ? ` · ${failedBank} NOT saved` : ' ✓'}`);
}

const PW_HASH = '46cde98529630458a95bb5974210c1b1a0a76debaf8f4024301dd84782024db2'; // sha256 of current password
const PW_SESSION_KEY = 'nova_auth';
const PW_STORE = localStorage;

async function hashString(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function checkPassword() {
  const input = document.getElementById('pw-input');
  const error = document.getElementById('pw-error');
  const hash = await hashString(input.value);
  if (hash === PW_HASH) {
    PW_STORE.setItem(PW_SESSION_KEY, '1');
    document.getElementById('pw-screen').classList.add('hidden');
    input.value = '';
    error.textContent = '';
  } else {
    input.classList.add('shake');
    error.textContent = 'Incorrect password';
    setTimeout(() => { input.classList.remove('shake'); input.value = ''; input.focus(); }, 350);
  }
}

// ═══════════════════════════════════════════════════
// ANDROID BACK, SHEETS AND KEYBOARD
// ═══════════════════════════════════════════════════
// Back closes an open sheet first, then returns to the previous app view (with the reporting
// period it had), and only then leaves the app.
let modalEntry = false;     // a history entry exists for the open sheet
let skipPop = 0;            // pops we caused ourselves
let modalReturnFocus = null;

function historyState(view) { return { nova: 1, view, period: clone(reportPeriod) }; }
function pushViewHistory(view) {
  try {
    if (!history.state || !history.state.nova) { history.replaceState(historyState(view), ''); return; }
    if (modalEntry) {
      // navigating from a sheet: its history entry becomes the new view, so Back returns to the view under the sheet
      modalEntry = false;
      if (modalOverlay().classList.contains('open')) hideModal();
      history.replaceState(historyState(view), '');
      return;
    }
    if (history.state.view !== view) history.pushState(historyState(view), '');
  } catch (e) { /* history unavailable (e.g. sandboxed preview) — navigation still works */ }
}

// called whenever the period changes, so Back restores the period each view was showing
function rememberPeriod() { try { if (history.state && history.state.nova) history.replaceState({ ...history.state, period: clone(reportPeriod) }, ''); } catch (e) {} }

function modalOverlay() { return document.getElementById('modal-overlay'); }
function openModal() {
  const ov = modalOverlay();
  if (!ov.classList.contains('open')) modalReturnFocus = document.activeElement;
  ov.classList.add('open');
  document.body.classList.add('sheet-open');
  if (!modalEntry) { try { history.pushState({ ...(history.state || {}), sheet: 1 }, ''); modalEntry = true; } catch (e) {} }
}
function hideModal() {
  modalOverlay().classList.remove('open');
  document.body.classList.remove('sheet-open');
  const f = modalReturnFocus; modalReturnFocus = null;
  if (f && f.isConnected && typeof f.focus === 'function') { try { f.focus({ preventScroll: true }); } catch (e) {} }
  if (!_busy && pendingRemoteChange) setTimeout(handleRemoteChange, 0);   // apply remote changes held while the form was open
  if (typeof maybeApplyPendingUpdate === 'function') maybeApplyPendingUpdate();
}
function closeModal() {
  hideModal();
  // drop the sheet's history entry — unless another sheet opened straight away and is using it
  setTimeout(() => {
    if (modalEntry && !modalOverlay().classList.contains('open')) { modalEntry = false; skipPop++; try { history.back(); } catch (e) { skipPop--; } }
  }, 0);
}
window.addEventListener('popstate', e => {
  if (skipPop > 0) { skipPop--; return; }
  if (modalOverlay().classList.contains('open') || modalEntry) {
    modalEntry = false;
    if (_busy) { try { history.pushState({ ...(history.state || {}), sheet: 1 }, ''); modalEntry = true; } catch (err) {} return; }  // never abandon a save in progress
    hideModal(); return;
  }
  if (document.getElementById('more-sheet')?.classList.contains('open')) { closeMore(); }
  const st = e.state;
  if (st && st.nova && st.view) {
    if (st.period) reportPeriod = st.period;
    navigate(st.view, null, { fromHistory: true });
  }
});

// Android keyboard: keep the focused field in view inside a sheet (the layout viewport resizes
// with interactive-widget=resizes-content; the sheet's body scrolls, its header and footer stay put).
document.addEventListener('focusin', e => {
  const t = e.target;
  if (!t || !t.closest || !t.closest('#modal') || !/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) return;
  setTimeout(() => { try { t.scrollIntoView({ block: 'center', behavior: 'instant' }); } catch (err) {} }, 250);
});

// ═══════════════════════════════════════════════════
// KEEPING THE INSTALLED APP CURRENT
// ═══════════════════════════════════════════════════
// An installed Android app is usually resumed, not reloaded, so it can keep showing an old
// version. On every resume (and every 10 minutes while open) we ask the server which version is
// live. A newer version is loaded straight away if nothing is being edited; otherwise it waits
// until the open form is saved or closed and Settings has no unsaved changes, so no entries are lost.
let updatePending = null;

function cmpVersion(a, b) {
  const pa = String(a).split('.').map(n => parseInt(n, 10) || 0), pb = String(b).split('.').map(n => parseInt(n, 10) || 0);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) { const d = (pa[i] || 0) - (pb[i] || 0); if (d) return d; }
  return 0;
}
function safeToReload() {
  return !_busy && !document.getElementById('modal-overlay').classList.contains('open') && !(typeof isDirty === 'function' && isDirty());
}
async function liveVersion() {
  const r = await fetch('./sw.js?check=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) return null;
  return ((await r.text()).match(/APP_VERSION = '([^']+)'/) || [])[1] || null;
}
async function checkForUpdate() {
  try {
    if (swRegistration) swRegistration.update().catch(() => {});
    const v = await liveVersion();
    if (v && cmpVersion(v, APP_VERSION) > 0) announceUpdate(v);
  } catch (e) { /* offline — try again later */ }
}
function announceUpdate(v) {
  updatePending = v;
  let tried = null; try { tried = sessionStorage.getItem('nova-update-tried'); } catch (e) {}
  const banner = document.getElementById('update-banner');
  const span = banner.querySelector('span');
  if (tried === v) {   // we already reloaded for this version and still got the old page (cached somewhere)
    span.textContent = `Version ${v} is available but didn't load. Close the app fully and reopen it.`;
    banner.classList.add('show'); return;
  }
  if (safeToReload()) { reloadForUpdate(); return; }
  span.textContent = `Version ${v} is ready — it will load once you've saved or closed what you're editing.`;
  banner.classList.add('show');
}
function reloadForUpdate() {
  if (!safeToReload()) { toast('Save or close the open form first — your entries are kept.'); return; }
  try {
    sessionStorage.setItem('nova-update-tried', updatePending || '');
    sessionStorage.setItem('nova-restore', JSON.stringify({ view: currentView, period: reportPeriod }));
  } catch (e) {}
  if (swRegistration?.waiting) swRegistration.waiting.postMessage('skipWaiting');
  location.reload();
}
// The banner's "Update now" button (replaces the earlier immediate reload).
function applyUpdate() { reloadForUpdate(); }
// After a form closes or Settings saves, apply a waiting update.
function maybeApplyPendingUpdate() { if (updatePending && safeToReload()) setTimeout(() => { if (safeToReload()) reloadForUpdate(); }, 400); }

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
setInterval(checkForUpdate, 10 * 60 * 1000);
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => {
  if (e.data?.type === 'SW_ACTIVATED' && e.data.version && cmpVersion(e.data.version, APP_VERSION) > 0) announceUpdate(e.data.version);
});
// view and period to reopen after an update reload (used once by boot)
function takeRestoreState() {
  try {
    const r = JSON.parse(sessionStorage.getItem('nova-restore') || 'null');
    sessionStorage.removeItem('nova-restore');
    if (cmpVersion(APP_VERSION, sessionStorage.getItem('nova-update-tried') || '0') >= 0) sessionStorage.removeItem('nova-update-tried');
    return r;
  } catch (e) { return null; }
}

document.getElementById('sidebar-date').textContent =
  new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', timeZone: LONDON_TZ });
document.getElementById('more-ver').textContent = 'Nova Finance OS · version ' + APP_VERSION;
document.addEventListener('click', e => { if (!e.target.closest('#more-sheet, #more-btn')) closeMore(); });

// Boot
(async () => {
  if (PW_STORE.getItem(PW_SESSION_KEY) !== '1') {
    await new Promise(resolve => {
      const interval = setInterval(() => {
        if (PW_STORE.getItem(PW_SESSION_KEY) === '1') { clearInterval(interval); document.getElementById('loading-splash').style.display = ''; resolve(); }
      }, 100);
    });
  }
  // Exchange bank auth code FIRST — codes expire in ~30s, before Supabase loads
  const _urlParams  = new URLSearchParams(window.location.search);
  const _isBankAuth = _urlParams.get('bankauth') === '1';
  const _bankCode   = _urlParams.get('code');
  let   _bankTokens = null;
  if (_isBankAuth && _bankCode) {
    try { _bankTokens = await tlProxy('exchange_code', { code: _bankCode, redirect_uri: TL_REDIRECT }); }
    catch (e) { console.error('Early token exchange failed:', e); }
  }
  try {
    await loadFromSupabase();
    lastSyncTime = new Date();
    syncConnectionStatus = 'connected';
    if (!dataEmpty) await ensureMilestoneBaseline();
    subscribeRealtime();
  } catch (e) {
    console.error('Supabase load failed:', e);
    syncConnectionStatus = 'error';
    loadError = e?.message || String(e);   // show nothing rather than stale or sample figures, and write nothing
    state.orders = []; state.transactions = [];
    setSyncStatus('error', 'Could not load data');
  }
  const splash = document.getElementById('loading-splash');
  splash.classList.add('hidden');
  setTimeout(() => splash.remove(), 500);
  if (_isBankAuth) { navigate('settings'); await gcCompleteAuth(_bankTokens); }
  else {
    const restore = takeRestoreState();   // reopen the same view and period after an update
    if (restore && restore.period) reportPeriod = restore.period;
    navigate(restore && restore.view ? restore.view : 'overview');
  }
  setTimeout(checkForUpdate, 3000);
})();

</script>
</body>
</html>
